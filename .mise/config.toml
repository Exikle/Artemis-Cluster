# `include` needs 2026.9.18; an older mise ignores it silently and installs none of the
# shared tools, so refuse to run instead.
min_version = "2026.9.18"

# Shared pins from exikle/mise-config: base.toml (every repo) and cluster.toml (both cluster
# repos). Renovate bumps the tools there and moves this commit pin here. A [tools] entry
# below wins over an included one.
include = [
  "git::https://git.dcunha.io/exikle/mise-config.git//base.toml?ref=512aa236dd2a295d5610d734e137a4b173a85816",
  "git::https://git.dcunha.io/exikle/mise-config.git//cluster.toml?ref=512aa236dd2a295d5610d734e137a4b173a85816",
]

[env]
# Agent MCP bearer tokens (gitignored). Regenerate with `just ai env`.
# opencode has no headersHelper equivalent, so opencode.json interpolates
# {env:...} and the values have to be real environment variables.
_.file = { path = "{{config_root}}/.env", redact = true }
# ansible refuses to start unless the locale is a generated UTF-8 one; this box
# has LANG=en_US.utf-8 exported but only C.utf8 actually generated.
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
KUBECONFIG = "{{config_root}}/kubeconfig"
# Without these, running `ansible` from the repo root silently picks up
# /etc/ansible/ansible.cfg — wrong inventory, wrong roles path. Absolute so they
# hold no matter which directory the command is run from.
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
ANSIBLE_INVENTORY = "{{config_root}}/ansible/inventory/hosts.yml"
ANSIBLE_ROLES_PATH = "{{config_root}}/ansible/roles"
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/ansible/collections"
# fjo reads the host from the environment; the matching FORGEJO_TOKEN is a
# secret and comes from .env via `just ai env`, not from here.
FORGEJO_HOST = "git.dcunha.io"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[settings]
# No mise.lock here. Every tool is an exact pin that Renovate bumps, and mise still
# verifies signatures at install; the lock only added churn and a slow `mise lock`.
# The global config says the same; this holds it for CI and machines without it.
lockfile = false

[tools]
# Only what this repo needs beyond the shared pins. Exact versions, never "latest";
# Renovate bumps them in one grouped "mise tools" PR.
#
# Pin to the cluster's Talos version. Previously unpinned here, so `render-config` and
# `validate` silently used whatever the global mise install resolved to.
talos = "1.14.4"
"github:home-operations/kopiur" = "0.10.16"
opentofu = "1.13.2"
"pypi:ansible-core" = "2.21.5"
"pipx:ansible-lint" = "26.10.1"
