---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labels Sync

on:
  push:
    branches:
      - main
    paths:
      - .forgejo/labels.yaml
  workflow_dispatch:

# Serialize rather than cancel — the sync deletes labels, so a cancelled run
# can leave the label set half-applied.
concurrency:
  group: labels-sync-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  sync:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/labels-sync.yaml@e80393cd68beed2a70e819d4d71b57a6a8d45796
    secrets: inherit # zizmor: ignore[secrets-inherit]
