---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labels Sync (Tekton)

on:
  push:
    branches:
      - main
    paths:
      - .forgejo/labels.yaml
  workflow_dispatch:

# Serialize rather than cancel — the sync deletes labels, so a cancelled run
# can leave the label set half-applied.
concurrency:
  group: labels-sync-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  sync:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/labels-sync.yaml@b4a92a955a1846d4d4ed9b96724b7705a741d07f
    secrets: inherit # zizmor: ignore[secrets-inherit]
