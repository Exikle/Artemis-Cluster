---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Push OCI Artifact

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - .sourceignore
  workflow_dispatch:

concurrency:
  group: oci-push-${{ forgejo.ref }}
  cancel-in-progress: true

# permissions: unsupported in Forgejo — grant via repo Settings → Actions → Authorized Integrations
# permissions:
#   contents: read

jobs:
  push:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/oci-push.yaml@fec3e3729a0bbae2bc2cc6305bd4892274814348
    with:
      registry-host: registry.dcunha.io
      forgejo-oci-url: oci://git.dcunha.io/exikle/artemis-cluster
      registry-oci-url: oci://registry.dcunha.io/exikle/artemis-cluster
    secrets: inherit # zizmor: ignore[secrets-inherit]
