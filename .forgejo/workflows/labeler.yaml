---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labeler

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.number || forgejo.ref }}
  cancel-in-progress: true

# permissions: unsupported in Forgejo — grant via repo Settings → Actions → Authorized Integrations
# permissions:
#   contents: read

jobs:
  labeler:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/labeler.yaml@fec3e3729a0bbae2bc2cc6305bd4892274814348
    secrets: inherit # zizmor: ignore[secrets-inherit]
