---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labeler (Tekton)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.number || forgejo.ref }}
  cancel-in-progress: true

# permissions: unsupported in Forgejo — grant via repo Settings → Actions → Authorized Integrations
# permissions:
#   contents: read

jobs:
  labeler:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/labeler.yaml@141a5b2cacbecacd30c12ce75be8097395869686
    secrets: inherit # zizmor: ignore[secrets-inherit]
