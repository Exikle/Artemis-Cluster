---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Review (AI)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.number || forgejo.ref }}
  cancel-in-progress: true

# permissions: unsupported in Forgejo — grant via repo Settings → Actions → Authorized Integrations
# permissions:
#   contents: read
#   pull-requests: write

jobs:
  review:
    uses: Exikle/forgejo-workflows/.forgejo/workflows/pr-review.yaml@fec3e3729a0bbae2bc2cc6305bd4892274814348
    secrets: inherit # zizmor: ignore[secrets-inherit]
