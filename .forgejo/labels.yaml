# Work Kind
- name: "kind/bug"
  color: "d73a4a"
  description: "Something is broken or behaves incorrectly"
- name: "kind/chore"
  color: "c5def5"
  description: "Maintenance, cleanup, config"
- name: "kind/debt"
  color: "fbca04"
  description: "Known compromise to revisit"
- name: "kind/feature"
  color: "0e8a16"
  description: "New capability"

# Work Status — absence means active
- name: "status/blocked"
  color: "b60205"
  description: "Cannot proceed until a dependency clears"
- name: "status/parked"
  color: "bfd4f2"
  description: "Known, deliberately not being worked on"

# Semantic Types — Renovate, PRs only
- name: "type/digest"
  color: "ffec19"
  description: "Container digest updates (same version, new build)"
- name: "type/patch"
  color: "ffec19"
  description: "Patch version updates (bug fixes)"
- name: "type/minor"
  color: "ff9800"
  description: "Minor version updates (new features, backward compatible)"
- name: "type/major"
  color: "f6412d"
  description: "Major version updates (breaking changes)"

# Priority — absence means normal
- name: "priority/high"
  color: "d93f0b"
  description: "Needs attention before other open work"
