[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-just]
glob = ["*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt --unstable; done'
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml"]
run = "mise fmt"
stage_fixed = true

# Key ordering for ks.yaml spec and app-template values. Was author-applied
# prose in yaml-conventions.md and had already drifted on 2 files by the time it
# was wired up here. The script refuses to write if the result is not
# semantically identical, so it can safely stage its own fixes.
# Agent docs that name a repo path which no longer exists. The Rook-Ceph removal
# left ~40 wrong claims across .agents/ because nothing checked this; three
# separate audit passes still missed five dead paths that this catches in 0.1s.
[pre-commit.commands.doc-paths]
glob = ".agents/**/*.md"
run = "python3 scripts/check-doc-paths.py {staged_files}"

[pre-commit.commands.normalize-yaml-order]
glob = "kubernetes/**/*.{yml,yaml}"
run = "hooks/.venv/bin/python scripts/normalize-yaml-order.py {staged_files}"
stage_fixed = true

[pre-commit.commands.k8s-schema-hook]
glob = "kubernetes/**/*.{yml,yaml}"
run = "hooks/.venv/bin/python hooks/k8s_yaml_schema.py --config .k8s-schema-hook.yaml {staged_files}"
stage_fixed = true

[pre-commit.commands.format-tofu]
glob = ["*.tf", "*.tfvars"]
run = 'for f in {staged_files}; do tofu fmt "$f"; done'
stage_fixed = true

[pre-commit.commands.tfstate-encrypted]
glob = ["*.tfstate"]
run = "hooks/.venv/bin/python hooks/tfstate_encrypted.py {staged_files}"

[pre-commit.commands.mise-lock]
glob = [".mise/config.toml"]
run = 'mise lock -p linux-x64,linux-arm64 && { for f in {staged_files}; do l="$(dirname "$f")/mise.lock"; [ -f "$l" ] && git add "$l"; done; true; }'

[pre-commit.commands.shellcheck]
glob = ["*.sh"]
run = "shellcheck {staged_files}"

[pre-commit.commands.zizmor]
glob = [".forgejo/workflows/*.yaml", ".forgejo/actions/**/action.yaml"]
run = "zizmor --offline --min-severity=high {staged_files}"

[pre-commit.commands.agent-hooks-generated]
glob = [".claude/hooks/*", ".opencode/plugins/guard-destructive.js"]
run = "python3 .claude/hooks/gen-guards.py --check"

[pre-commit.commands.agent-hooks-vendored]
glob = [".claude/hooks/*"]
run = 'if [ -d "$HOME/dotfiles/home/claude/agent-hooks" ]; then "$HOME/dotfiles/home/claude/agent-hooks/sync-hooks.sh" --check "$PWD"; fi'

# Karpathy gate: complexity warnings on staged code plus a diff-noise ratio.
# Advisory only — never blocks a commit.
#
# Calls the plugin's scripts directly rather than its own hooks/karpathy-gate.sh,
# which is broken upstream: that wrapper resolves SCRIPT_DIR to <plugin>/scripts,
# but the scripts ship at <plugin>/skills/karpathy-coder/scripts, so every call
# fails into `2>/dev/null || true` and the gate silently reports nothing.
#
# The plugin lives in ~/.claude/plugins, which a fresh clone will not have, so
# resolve it at runtime and skip silently when absent rather than breaking
# commits for anyone without it installed.
[pre-commit.commands.karpathy-gate]
glob = ["*.py", "*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs"]
run = 's=$(find ~/.claude/plugins/cache/claude-code-skills/karpathy-coder -type d -name scripts 2>/dev/null | head -1); [ -z "$s" ] && exit 0; python3 "$s/complexity_checker.py" {staged_files} --threshold medium || true; python3 "$s/diff_surgeon.py" || true'
