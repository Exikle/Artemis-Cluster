[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown", "*.mdx"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-just]
glob = ["*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt --unstable; done'
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.k8s-schema-hook]
glob = "kubernetes/**/*.{yml,yaml}"
run = "hooks/.venv/bin/python hooks/k8s_yaml_schema.py --config .k8s-schema-hook.yaml {staged_files}"
stage_fixed = true

[pre-commit.commands.format-tofu]
glob = ["*.tf", "*.tfvars"]
run = 'for f in {staged_files}; do tofu fmt "$f"; done'
stage_fixed = true

[pre-commit.commands.tfstate-encrypted]
glob = ["*.tfstate"]
run = "hooks/.venv/bin/python hooks/tfstate_encrypted.py {staged_files}"

[pre-commit.commands.mise-lock]
glob = [".mise/config.toml"]
run = 'mise lock -p linux-x64,linux-arm64 && { for f in {staged_files}; do l="$(dirname "$f")/mise.lock"; [ -f "$l" ] && git add "$l"; done; true; }'

[pre-commit.commands.shellcheck]
glob = ["*.sh"]
run = "shellcheck {staged_files}"

[pre-commit.commands.zizmor]
glob = [".forgejo/workflows/*.yaml", ".forgejo/actions/**/action.yaml"]
run = "zizmor --offline --min-severity=high {staged_files}"
