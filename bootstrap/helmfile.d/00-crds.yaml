---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.21.1

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: 1.9.0

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.24.0

  # CRDs only (this stage extracts CustomResourceDefinition kind and discards
  # the rest) — the kube-prometheus-stack release itself is not installed;
  # the cluster runs VictoriaMetrics instead. Kept because monitoring.coreos.com
  # CRDs (ServiceMonitor, PodMonitor, PrometheusRule, Probe, ...) are still
  # consumed throughout the repo and converted by vm-operator.
  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 88.2.0
