---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    tag: main
  url: oci://registry.dcunha.io/exikle/artemis-cluster
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-bootstrap
  namespace: cert-manager
stringData:
  ACME_EMAIL: placeholder@example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-dns-tunnel-secret
  namespace: network
stringData:
  FROSTLINK_TUNNEL_ID: placeholder
---
apiVersion: v1
kind: Secret
metadata:
  name: flux-operator-oidc-credentials
  namespace: flux-system
stringData:
  client-secret: placeholder
