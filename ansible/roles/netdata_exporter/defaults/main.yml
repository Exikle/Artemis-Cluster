---
# Where the canonical copy lives. This must be on a dataset: TrueNAS replaces
# /etc/netdata on update, which is the whole reason this role exists.
netdata_exporter_config_dir: /mnt/atlas/config/netdata

# netdata's own Prometheus endpoint, scraped by the cluster at
# /api/v1/allmetrics?format=prometheus. The loopback bind is kept because
# TrueNAS's Reporting tab reads netdata there.
netdata_exporter_bind: 127.0.0.1:6999 10.10.99.100:19999
netdata_exporter_allow_from: localhost 10.10.*
