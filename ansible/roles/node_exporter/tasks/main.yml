---
# Shell matches what the host already has. Normalising it to nologin would be a
# change for its own sake, and this role is adopting an existing install.
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /bin/false
    # The account's home is listed in passwd but has never existed. Without
    # this the module reports changed on every run, wanting to create it.
    create_home: false

- name: Check the installed binary version
  ansible.builtin.command: "{{ node_exporter_bin }} --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the node_exporter binary
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))
  block:
    - name: Download the release archive
      ansible.builtin.get_url:
        url: "{{ node_exporter_base_url }}/v{{ node_exporter_version }}/{{ node_exporter_archive }}"
        dest: "/tmp/{{ node_exporter_archive }}"
        mode: "0644"

    - name: Unpack the binary into place
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}"
        dest: /usr/local/bin
        remote_src: true
        extra_opts:
          - --strip-components=1
          - "{{ node_exporter_dir }}/node_exporter"
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
