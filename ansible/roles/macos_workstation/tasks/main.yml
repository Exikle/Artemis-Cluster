---
# Prerequisites only. This role is the macOS analogue of wsl-privileged-setup:
# it does the things mise deliberately cannot — anything needing root, and the
# package manager mise is not. The toolchain itself, the dotfiles and the shell
# are all still `mise bootstrap`'s job, driven from the same repo as every other
# machine. Adding tool installs here would fork the toolchain per-OS, which is
# exactly what the mise lockfile exists to prevent.

- name: Assert this is actually macOS
  # The whole role assumes launchd, scutil and Homebrew. Running it against a
  # Linux host by a mistaken --limit would otherwise fail deep inside a task
  # with a confusing error instead of here.
  ansible.builtin.assert:
    that: ansible_facts['system'] == 'Darwin'
    fail_msg: >-
      macos_workstation targets macOS only, but {{ inventory_hostname }}
      reports system={{ ansible_facts['system'] }}.

# --- Homebrew ---------------------------------------------------------------
# Not installed by this role. Homebrew's installer wants an interactive sudo
# session and prompts to accept the Xcode CLT licence, neither of which
# survives a non-interactive Ansible connection. Detect and report instead.
- name: Locate the Homebrew executable
  ansible.builtin.stat:
    path: "{{ item }}"
  register: macos_workstation_brew_stat
  loop: "{{ macos_workstation_brew_prefixes }}"

- name: Record the Homebrew path that exists
  ansible.builtin.set_fact:
    macos_workstation_brew_bin: >-
      {{ (macos_workstation_brew_stat.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('', true) }}

- name: Fail with the bootstrap command when Homebrew is absent
  ansible.builtin.fail:
    msg: >-
      Homebrew is not installed at any of {{ macos_workstation_brew_prefixes | join(', ') }}.
      It cannot be installed from here — its installer needs an interactive sudo
      session. Run this on {{ inventory_hostname }} first, then re-run:
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/brew/HEAD/install.sh)"
  when: macos_workstation_brew_bin | length == 0

- name: Install the formulae that cover mise's darwin gaps
  community.general.homebrew:
    name: "{{ macos_workstation_brew_formulae }}"
    state: present
    path: "{{ macos_workstation_brew_bin | dirname }}"
    update_homebrew: "{{ macos_workstation_brew_update }}"

# --- Machine identity -------------------------------------------------------
# macOS keeps three separate names and they drift independently: ComputerName
# is the Sharing-pane label (allows spaces), LocalHostName is the Bonjour name
# (<name>.local, restricted charset), HostName is what `hostname` returns. Only
# setting one is the usual cause of a Mac that reports two different names.
# scutil is used rather than ansible.builtin.hostname, whose darwin
# implementation sets HostName alone.
- name: Read the current machine names
  ansible.builtin.command: "scutil --get {{ item }}"
  register: macos_workstation_current_names
  changed_when: false
  # Read-only, so it must run even under --check. Without this the command
  # module skips in check mode, the register is left undefined, and the rename
  # task below silently skips too — making a dry run look clean while having
  # validated nothing about the one privileged thing this role does.
  check_mode: false
  # Carries the SAME tags as the rename task it feeds. A tag selects individual
  # tasks, not dependency chains, so `--tags privileged` would otherwise filter
  # this one out and leave the rename looping over an undefined register. Any
  # task that only exists to populate a variable must be tagged wherever its
  # consumer is.
  tags:
    - privileged
    - rename
  # HostName is genuinely unset on a stock Mac and scutil exits non-zero for
  # it, which is a valid state to converge from, not an error.
  failed_when: false
  loop:
    - ComputerName
    - LocalHostName
    - HostName

- name: Set the machine names
  ansible.builtin.command: "scutil --set {{ item.item }} {{ macos_workstation_hostname }}"
  become: true
  when: item.stdout | default('') | trim != macos_workstation_hostname
  changed_when: true
  loop: "{{ macos_workstation_current_names.results }}"
  loop_control:
    label: "{{ item.item }}"
  # Tagged so the unprivileged majority of this role can run unattended. This
  # account's sudo prompts for a password and ansible.cfg sets
  # become_ask_pass = False, so the rename needs an explicit -K:
  #   just ansible apply grimoire --tags privileged -K
  # Everything else runs with --skip-tags privileged and no prompt at all.
  tags:
    - privileged
    - rename

# --- Dotfiles ---------------------------------------------------------------
# Cloned, never applied. `mise bootstrap` writes to $HOME and reconciles the
# shell; running it from here would mean a remote non-interactive shell doing
# the one step whose failure mode is a half-linked home directory.
- name: Back up shell config that mise bootstrap will replace
  # Ordered BEFORE the clone so it cannot be skipped by a clone that no-ops on a
  # re-run. mise's symlink-each writes straight over these, and a symlink
  # replacing a real file is not recoverable — this machine arrived with a
  # diverged 103-line starship.toml and an oh-my-zsh .zshrc predating the repo.
  ansible.builtin.copy:
    src: "{{ ansible_facts['env'].HOME }}/{{ item }}"
    dest: "{{ ansible_facts['env'].HOME }}/{{ item }}.pre-dotfiles"
    remote_src: true
    force: false # never overwrite an existing backup on a re-run
    mode: preserve
  loop:
    - .zshrc
    - .config/starship.toml
  # A machine that never had these is a perfectly normal starting state.
  failed_when: false

- name: Confirm the backups exist before removing anything
  # The interlock for the next task. Removing a file is the one destructive
  # thing this role does, so it is gated on the backup being present on disk
  # rather than on the copy task having reported "changed" — which it does not
  # on a re-run, even though the backup is sitting right there.
  ansible.builtin.stat:
    path: "{{ ansible_facts['env'].HOME }}/{{ item }}.pre-dotfiles"
  register: macos_workstation_backups
  loop:
    - .zshrc
    - .config/starship.toml

- name: Remove the originals so mise bootstrap can take over
  # mise refuses to replace a real file with a symlink and aborts the whole
  # dotfiles stage — on this machine it stopped on ~/.zshrc (oh-my-zsh) and a
  # diverged ~/.config/starship.toml. The repo versions are the intended state,
  # so clear the way; the .pre-dotfiles copies above are the undo.
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/{{ item.item }}"
    state: absent
  when: item.stat.exists
  loop: "{{ macos_workstation_backups.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Clone the dotfiles working copy # noqa: command-instead-of-module
  # The git module is the right default and is used everywhere else; this is a
  # deliberate exception. It accepts a credential only as part of the repo URL,
  # and then records that URL as the remote — writing the PAT into the Mac's
  # .git/config permanently. Cloning by hand is what keeps the token in the
  # environment for exactly one command.
  # ansible.builtin.git cannot take a credential separately from the URL, and
  # embedding one in the URL persists it into the Mac's .git/config. So: a
  # throwaway inline credential helper, fed entirely from the environment. The
  # token never appears in argv (visible in `ps`), never reaches git's config,
  # and no_log keeps it out of the Ansible output.
  #
  # The two empty `-c credential.helper=` assignments are load-bearing: -c
  # APPENDS to the helper chain rather than replacing it, and once the dotfiles
  # are applied, ~/.gitconfig points git.dcunha.io at git-credential-forgejo.
  # That helper shells out to `op`, which on a machine where 1Password is not
  # signed in prints an error and then an EMPTY password — which git accepts and
  # authenticates with, failing. An empty value resets the list, so ours is the
  # only helper that runs. Both the generic and the URL-scoped key need it.
  ansible.builtin.command:
    cmd: >-
      git -c credential.helper=
      -c credential.https://{{ macos_workstation_forgejo_host }}.helper=
      -c credential.helper='!f() { echo username=$FORGEJO_USER; echo password=$FORGEJO_PAT; }; f'
      clone {{ macos_workstation_dotfiles_repo }} {{ macos_workstation_dotfiles_dest }}
    creates: "{{ macos_workstation_dotfiles_dest }}/.git"
  environment:
    FORGEJO_USER: "{{ macos_workstation_forgejo_user }}"
    FORGEJO_PAT: "{{ lookup('community.general.onepassword',
      macos_workstation_forgejo_item,
      field=macos_workstation_forgejo_field,
      vault=macos_workstation_forgejo_vault) }}"
  no_log: true

- name: Fast-forward the dotfiles working copy # noqa: command-instead-of-module
  # Same credential problem as the clone, and the same solution: on a machine
  # that has not been bootstrapped yet, git-credential-forgejo does not exist,
  # so even `git pull` cannot authenticate. Without this the role would clone a
  # repo once and then let it rot at whatever commit was current that day.
  #
  # --ff-only is what makes this safe to run unattended. It refuses rather than
  # merges, so local commits or a diverged branch stop the play loudly instead
  # of being silently rewritten — this is a machine dotfiles get authored on,
  # not a deployment target.
  #
  # --autostash is not optional here. ~/.config/mise/mise.lock is a symlink INTO
  # this repo, so every `mise install` writes through to the working copy and
  # leaves it dirty — on a Mac it adds the macos-* platform entries. Without
  # autostash, the second run of this play always fails on "local changes would
  # be overwritten", for churn the machine generated itself.
  #
  # Diagnosing a failure here needs a shell on the host: no_log below hides the
  # git output along with the token. `ssh grimoire 'cd ~/dotfiles && git status'`.
  ansible.builtin.command:
    cmd: >-
      git -c credential.helper=
      -c credential.https://{{ macos_workstation_forgejo_host }}.helper=
      -c credential.helper='!f() { echo username=$FORGEJO_USER; echo password=$FORGEJO_PAT; }; f'
      pull --ff-only --autostash
    chdir: "{{ macos_workstation_dotfiles_dest }}"
  environment:
    FORGEJO_USER: "{{ macos_workstation_forgejo_user }}"
    FORGEJO_PAT: "{{ lookup('community.general.onepassword',
      macos_workstation_forgejo_item,
      field=macos_workstation_forgejo_field,
      vault=macos_workstation_forgejo_vault) }}"
  register: macos_workstation_pull
  changed_when: "'Already up to date' not in macos_workstation_pull.stdout"
  no_log: true

- name: Ensure the mise config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.config/mise"
    state: directory
    mode: "0755"

- name: Select the macOS overlay
  # Machine-local and untracked by design: it is the one file that tells mise
  # which mise.<machine>.toml applies, so it cannot itself live in the repo.
  # Note the global path has no leading dot, unlike the project-root variant.
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env'].HOME }}/.config/mise/miserc.toml"
    content: |
      env = ["mac"]
    mode: "0644"
