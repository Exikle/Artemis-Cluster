---
- name: Install the tailscale0 MSS clamp script
  ansible.builtin.template:
    src: tailscale-mss.sh.j2
    dest: "{{ ucg_tailscale_mss_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the tailscale0 MSS clamp units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - tailscale-mss.service
    - tailscale-mss.timer
  notify: Reload systemd

- name: Run pending handlers before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the tailscale0 MSS clamp timer
  ansible.builtin.systemd:
    name: tailscale-mss.timer
    enabled: true
    state: started
  # A check run never writes the unit files, so systemd cannot find them yet.
  ignore_errors: "{{ ansible_check_mode }}"
