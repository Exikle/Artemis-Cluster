---
# Builds a Forgejo host from a bare Debian container, and converges an existing one. On a
# fresh box it installs the latest release and starts it with only the managed app.ini
# keys; carrying an existing instance over (data, app.ini, the git user's .ssh) is the
# rebuild procedure in .agents/references/ansible.md, not something this role does.
# A check run on a converged host should report 0 changed.
- name: Install the packages Forgejo and its scripts use
  ansible.builtin.apt:
    name: "{{ forgejo_packages }}"
    state: present
    update_cache: true

- name: Create the forgejo system group
  ansible.builtin.group:
    name: "{{ forgejo_group }}"
    gid: "{{ forgejo_gid }}"
    system: true

# Shell is /bin/bash because git-over-SSH needs a real shell.
- name: Create the forgejo system user
  ansible.builtin.user:
    name: "{{ forgejo_user }}"
    uid: "{{ forgejo_uid }}"
    group: "{{ forgejo_group }}"
    home: "{{ forgejo_home }}"
    shell: /bin/bash
    system: true
    comment: "Forgejo,,,"

# System-wide, not [git.config]: SSH pushes run as the git user with its own HOME, so
# Forgejo's private gitconfig never applies to the gc that git runs after a push. Packing
# unreachable objects instead of leaving them loose is what stops "too many unreachable
# loose objects" (git 2.41+ defaults to it; set explicitly so it never depends on that).
- name: Pack unreachable objects into cruft packs
  community.general.git_config:
    scope: system
    name: gc.cruftPacks
    value: "true"

- name: Refuse to let two things own the binary
  ansible.builtin.assert:
    that: not (forgejo_manage_binary and forgejo_update_cron_enabled)
    fail_msg: >-
      forgejo_manage_binary and forgejo_update_cron_enabled are both true. The
      cron job would upgrade to the latest release and the next Ansible run
      would put forgejo_version ({{ forgejo_version }}) back. Turn one off.

- name: Manage the forgejo binary
  when: forgejo_manage_binary
  block:
    - name: Check the installed binary version
      ansible.builtin.command: "{{ forgejo_bin }} --version"
      register: forgejo_installed
      changed_when: false
      failed_when: false
      check_mode: false

    # get_url writes to a temp path and renames, so the running process keeps
    # its own inode and stays up until the handler restarts it. If the new
    # binary is bad, the restart is where it surfaces — the service is down at
    # that point, not before.
    - name: Install the forgejo binary
      when: forgejo_version not in (forgejo_installed.stdout | default(''))
      ansible.builtin.get_url:
        url: "{{ forgejo_base_url }}/v{{ forgejo_version }}/{{ forgejo_archive }}"
        dest: "{{ forgejo_bin }}"
        checksum: "sha256:{{ forgejo_base_url }}/v{{ forgejo_version }}/{{ forgejo_archive }}.sha256"
        owner: root
        group: root
        mode: "0755"
      notify: Restart forgejo

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ forgejo_config_dir }}"
    state: directory
    owner: root
    group: "{{ forgejo_group }}"
    mode: "0770"

- name: Create the work directory
  ansible.builtin.file:
    path: "{{ forgejo_work_dir }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"

# touch with preserved times: creates the file on a fresh box, changes nothing on a
# converged one beyond owner and mode.
- name: Set the config file ownership and mode
  ansible.builtin.file:
    path: "{{ forgejo_config }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "{{ forgejo_config_mode }}"

- name: Create the custom theme directory
  ansible.builtin.file:
    path: "{{ forgejo_theme_dir }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0755"

# Forgejo serves these straight off disk, so the CSS itself needs no restart —
# but adding a name to the THEMES list in app.ini does, and that task notifies.
- name: Install the custom theme stylesheets
  ansible.builtin.copy:
    src: "themes/{{ item }}"
    dest: "{{ forgejo_theme_dir }}/{{ item }}"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0644"
  loop: "{{ forgejo_custom_themes }}"

# Key-by-key, not templated. See forgejo_settings in defaults/main.yml for why.
- name: Apply the managed app.ini settings
  community.general.ini_file:
    path: "{{ forgejo_config }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "{{ forgejo_config_mode }}"
  loop: "{{ forgejo_settings }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  notify: Restart forgejo

- name: Remove app.ini keys that moved or were renamed
  community.general.ini_file:
    path: "{{ forgejo_config }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    state: absent
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "{{ forgejo_config_mode }}"
  loop: "{{ forgejo_settings_absent }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  notify: Restart forgejo

# no_log because the values are secrets — the task still reports ok/changed, it
# just will not print them. An `ok` here is also the proof that what is in
# 1Password matches what is live on the box.
- name: Apply the app.ini settings held in 1Password
  community.general.ini_file:
    path: "{{ forgejo_config }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: >-
      {{ lookup('community.general.onepassword', forgejo_op_item,
                field=item.field, vault=forgejo_op_vault) }}
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "{{ forgejo_config_mode }}"
  loop: "{{ forgejo_secret_settings }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  no_log: true
  notify: Restart forgejo

- name: Install the systemd unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart forgejo

- name: Create the database backup directory
  ansible.builtin.file:
    path: "{{ forgejo_backup_dir }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"

# Weekly: latest release, majors included. It backs the database up first, checks
# /api/healthz after, and puts the old binary back if the check fails. The Proxmox
# snapshot taken minutes before it on pantheon (roles/pve_guest_snapshots) is the
# rollback for a major upgrade, whose database migration the binary swap cannot undo.
- name: Install the self-update script
  ansible.builtin.template:
    src: forgejo-update.sh.j2
    dest: /usr/local/sbin/forgejo-update.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule the weekly self-update
  ansible.builtin.cron:
    name: forgejo-update
    cron_file: forgejo-update
    user: root
    job: /usr/local/sbin/forgejo-update.sh
    minute: "{{ forgejo_update_cron.minute }}"
    hour: "{{ forgejo_update_cron.hour }}"
    weekday: "{{ forgejo_update_cron.weekday }}"
    state: "{{ 'present' if forgejo_update_cron_enabled else 'absent' }}"

# A fresh box has no binary yet; the updater is the one thing that knows how to fetch
# the latest release, so it installs the first one too.
- name: Install the latest release when there is no binary yet
  when: forgejo_update_cron_enabled
  ansible.builtin.command: /usr/local/sbin/forgejo-update.sh
  args:
    creates: "{{ forgejo_bin }}"

- name: Create the git user's .ssh directory
  ansible.builtin.file:
    path: "{{ forgejo_home }}/.ssh"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0700"

# Forgejo refuses to start without the key [repository.signing] names. A fresh instance
# gets a new one; a rebuilt one carries the old key over with /home/git, which this
# never overwrites — replacing it breaks verification of every commit it signed.
- name: Create the instance signing key when there is none
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ forgejo_user }} -- ssh-keygen -q -t ed25519 -N ""
      -C "git.dcunha.io Instance" -f {{ forgejo_home }}/.ssh/forgejo_signing
    creates: "{{ forgejo_home }}/.ssh/forgejo_signing"

- name: Enable and start forgejo
  ansible.builtin.systemd_service:
    name: forgejo
    enabled: true
    state: started
    daemon_reload: true

# systemd reports "started" before Forgejo has read its config, so a fatal config error
# would otherwise pass the play. Flush handlers first so a pending restart is included.
- name: Apply any pending restart before the health check
  ansible.builtin.meta: flush_handlers

- name: Wait for Forgejo to report healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_settings | selectattr('option', 'equalto', 'HTTP_PORT') | map(attribute='value') | first }}/api/healthz"
    status_code: 200
  register: forgejo_health
  until: forgejo_health.status == 200
  retries: 24
  delay: 5
  check_mode: false

- name: Install the commit_status cleanup script
  ansible.builtin.template:
    src: forgejo-status-cleanup.sh.j2
    dest: /usr/local/sbin/forgejo-status-cleanup.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule the nightly commit_status cleanup
  ansible.builtin.cron:
    name: forgejo-status-cleanup
    cron_file: forgejo-status-cleanup
    user: root
    job: /usr/local/sbin/forgejo-status-cleanup.sh
    minute: "{{ forgejo_cleanup_cron.minute }}"
    hour: "{{ forgejo_cleanup_cron.hour }}"
    state: "{{ 'present' if forgejo_cleanup_cron_enabled else 'absent' }}"
