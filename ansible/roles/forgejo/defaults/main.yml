---
# The host already self-updates. `forgejo-update.sh` runs from cron every Sunday
# at 03:00, follows the Codeberg `latest` release, and rewrites the binary — so
# this role does NOT manage the binary by default. Two owners of one file means
# the cron job upgrades on Sunday and the next Ansible run downgrades it back to
# whatever forgejo_version says.
#
# Pick one. Leave this false to let the updater own upgrades, or set it true and
# set forgejo_update_cron_enabled to false to move upgrades onto Renovate + a
# pinned version, applied by hand.
forgejo_manage_binary: false

# renovate: datasource=gitea-releases depName=forgejo/forgejo registryUrl=https://codeberg.org
forgejo_version: "16.0.3"

forgejo_base_url: https://codeberg.org/forgejo/forgejo/releases/download
forgejo_archive: "forgejo-{{ forgejo_version }}-linux-amd64"
forgejo_bin: /usr/local/bin/forgejo

# The two cron jobs that were already on the box, adopted so they live in git
# rather than only in /usr/local/sbin.
forgejo_update_cron_enabled: true
forgejo_update_cron: { minute: "0", hour: "3", weekday: "0" }
forgejo_update_log: /var/log/forgejo-update.log

forgejo_cleanup_cron_enabled: true
forgejo_cleanup_cron: { minute: "30", hour: "4" }
forgejo_cleanup_log: /var/log/forgejo-status-cleanup.log
forgejo_status_retention_days: 90

forgejo_user: git
forgejo_group: git
forgejo_home: /home/git
forgejo_config_dir: /etc/forgejo
forgejo_config: "{{ forgejo_config_dir }}/app.ini"
forgejo_work_dir: /var/lib/forgejo

# Applied 2026-09-07; the file was 0644 before that. The 0770 parent directory
# is what actually keeps it away from other accounts, so this was a
# belt-and-braces tightening rather than a fix for live exposure.
forgejo_config_mode: "0640"

# Custom themes, shipped from files/themes/ into Forgejo's custom asset dir.
# A theme is live when theme-<name>.css exists AND <name> is in the THEMES list,
# so the list below is derived from the filenames rather than repeated by hand.
#
# anthracite is Erwan Leboucher's theme (eleboucher/homelab). ayu is derived from
# it: same compiled Forgejo base, with the palette block at the end swapped for
# the official ayu palette (ayu-theme/ayu-colors).
forgejo_custom_themes:
  - theme-anthracite.css
  - theme-anthracite-dark.css
  - theme-anthracite-light.css
  - theme-ayu.css
  - theme-ayu-dark.css
  - theme-ayu-light.css

forgejo_builtin_themes: forgejo-auto,forgejo-light,forgejo-dark

# The THEMES value Forgejo gets: the built-ins plus every custom stylesheet,
# with the theme-/.css wrapper stripped back off the filenames.
forgejo_theme_names: >-
  {{ ([forgejo_builtin_themes] + (forgejo_custom_themes
     | map('regex_replace', '^theme-(.*)\.css$', '\1') | list)) | join(',') }}
forgejo_theme_dir: "{{ forgejo_work_dir }}/custom/public/assets/css"

# The four app.ini values that are secrets, held in 1Password rather than here.
# They were generated by Forgejo at install time and lifted into the vault on
# 2026-09-07. `infrastructure`, not `artemis`, deliberately: the artemis vault is
# readable by the in-cluster 1Password Connect token, and these protect the host
# that serves the GitOps repo the cluster pulls from.
#
# SECRET_KEY is deliberately absent — it is not set on this instance either, and
# Forgejo falls back to its own default. Do not "helpfully" add one: changing it
# invalidates data encrypted under the old value.
forgejo_op_vault: infrastructure
forgejo_op_item: forgejo-host

forgejo_secret_settings:
  - section: security
    option: INTERNAL_TOKEN
    field: INTERNAL_TOKEN
  - section: security
    option: PASSWORD_HASH_ALGO
    field: PASSWORD_HASH_ALGO
  - section: oauth2
    option: JWT_SECRET
    field: OAUTH2_JWT_SECRET
  - section: server
    option: LFS_JWT_SECRET
    field: LFS_JWT_SECRET

# Settings this role owns. Everything absent here is left exactly as it is on
# the host — including `[database] PASSWD`, a dead MySQL leftover that is inert
# under sqlite3 and whose value is recorded nowhere. That is why app.ini is
# edited key-by-key instead of templated: a template renders the whole file, so
# every key it fails to reproduce is a key it deletes.
forgejo_settings:
  # These five sit above the first section header. `section: DEFAULT` does NOT
  # mean that to ini_file — it appends a literal [DEFAULT] block at the end of
  # the file and leaves the real keys untouched. A null section is the one that
  # edits the pre-section area in place.
  - section: null
    option: APP_NAME
    value: Forgejo
  - section: null
    option: APP_SLOGAN
    value: Beyond coding. We Forge.
  - section: null
    option: RUN_USER
    value: git
  - section: null
    option: WORK_PATH
    value: /var/lib/forgejo
  - section: null
    option: RUN_MODE
    value: prod

  - section: database
    option: DB_TYPE
    value: sqlite3
  - section: database
    option: PATH
    value: /var/lib/forgejo/data/forgejo.db
  - section: database
    option: SQLITE_JOURNAL_MODE
    value: WAL
  - section: database
    option: LOG_SQL
    value: "false"

  - section: repository
    option: ROOT
    value: /var/lib/forgejo/data/forgejo-repositories

  - section: server
    option: DOMAIN
    value: git.dcunha.io
  - section: server
    option: SSH_DOMAIN
    value: 10.10.99.24
  - section: server
    option: ROOT_URL
    value: https://git.dcunha.io/
  - section: server
    option: HTTP_PORT
    value: "3000"
  - section: server
    option: REVERSE_PROXY_LIMIT
    value: "1"
  - section: server
    option: REVERSE_PROXY_TRUSTED_PROXIES
    value: 10.42.0.0/16
  - section: server
    option: APP_DATA_PATH
    value: /var/lib/forgejo/data
  - section: server
    option: DISABLE_SSH
    value: "false"
  - section: server
    option: SSH_PORT
    value: "22"
  - section: server
    option: LFS_START_SERVER
    value: "true"
  - section: server
    option: OFFLINE_MODE
    value: "false"

  - section: lfs
    option: PATH
    value: /var/lib/forgejo/data/lfs

  - section: mailer
    option: ENABLED
    value: "false"

  - section: service
    option: REGISTER_EMAIL_CONFIRM
    value: "false"
  - section: service
    option: ENABLE_NOTIFY_MAIL
    value: "false"
  - section: service
    option: DISABLE_REGISTRATION
    value: "false"
  - section: service
    option: ALLOW_ONLY_EXTERNAL_REGISTRATION
    value: "true"
  - section: service
    option: ENABLE_CAPTCHA
    value: "false"
  - section: service
    option: REQUIRE_SIGNIN_VIEW
    value: "false"
  - section: service
    option: DEFAULT_KEEP_EMAIL_PRIVATE
    value: "false"
  - section: service
    option: DEFAULT_ALLOW_CREATE_ORGANIZATION
    value: "true"
  - section: service
    option: DEFAULT_ENABLE_TIMETRACKING
    value: "true"
  - section: service
    option: NO_REPLY_ADDRESS
    value: noreply.dcunha.io
  - section: service
    option: USERNAME_COOLDOWN_PERIOD
    value: "7"

  - section: openid
    option: ENABLE_OPENID_SIGNIN
    value: "false"
  - section: openid
    option: ENABLE_OPENID_SIGNUP
    value: "false"

  - section: session
    option: PROVIDER
    value: file
  - section: session
    option: COOKIE_SECURE
    value: "true"

  - section: log
    option: MODE
    value: console
  - section: log
    option: LEVEL
    value: info
  - section: log
    option: ROOT_PATH
    value: /var/lib/forgejo/log

  - section: repository.pull-request
    option: DEFAULT_MERGE_STYLE
    value: merge

  # This is the instance signing identity referenced in commit-style.md — the
  # key that signs Renovate squash-merges. Do not repoint it casually.
  - section: repository.signing
    option: SIGNING_KEY
    value: /home/git/.ssh/forgejo_signing.pub
  - section: repository.signing
    option: SIGNING_NAME
    value: git.dcunha.io Instance
  - section: repository.signing
    option: SIGNING_EMAIL
    value: noreply@git.dcunha.io
  - section: repository.signing
    option: FORMAT
    value: ssh
  - section: repository.signing
    option: INITIAL_COMMIT
    value: always
  - section: repository.signing
    option: CRUD_ACTIONS
    value: pubkey, parentsigned
  - section: repository.signing
    option: MERGES
    value: always
  - section: repository.signing
    option: DEFAULT_TRUST_MODEL
    value: committer

  - section: security
    option: INSTALL_LOCK
    value: "true"
  - section: security
    option: LOGIN_REMEMBER_DAYS
    value: "365"

  - section: oauth2_client
    option: USERNAME
    value: nickname

  - section: ui
    option: THEMES
    value: "{{ forgejo_theme_names }}"
  # Only applies to accounts with no stored preference of their own — an
  # existing user who has picked a theme keeps it. `ayu` (not ayu-dark) so it
  # follows the viewer's OS light/dark setting.
  - section: ui
    option: DEFAULT_THEME
    value: ayu

  - section: cache
    option: ADAPTER
    value: twoqueue
  - section: cache
    option: INTERVAL
    value: "60"
  - section: cache
    option: ITEM_TTL
    value: 16h

  - section: packages
    option: ENABLED
    value: "true"

  - section: indexer
    option: ISSUE_INDEXER_TYPE
    value: bleve
  - section: indexer
    option: REPO_INDEXER_ENABLED
    value: "true"
  - section: indexer
    option: REPO_INDEXER_TYPE
    value: bleve

  - section: federation
    option: ENABLED
    value: "true"

  - section: webhook
    option: ALLOWED_HOST_LIST
    value: external,10.10.99.0/24

  - section: git.config
    option: user.name
    value: Forgejo
  - section: git.config
    option: user.email
    value: admin@dcunha.io

  - section: picture
    option: DISABLE_GRAVATAR
    value: "true"
  - section: picture
    option: ENABLE_FEDERATED_AVATAR
    value: "false"

  - section: cron.update_checker
    option: ENABLED
    value: "true"

  - section: markup.sanitizer.align_div
    option: ELEMENT
    value: div
  - section: markup.sanitizer.align_div
    option: ATTRIBUTE
    value: align
  - section: markup.sanitizer.align_div
    option: REGEXP
    value: ^(left|right|center|justify)$

  - section: markup.sanitizer.align_p
    option: ELEMENT
    value: p
  - section: markup.sanitizer.align_p
    option: ATTRIBUTE
    value: align
  - section: markup.sanitizer.align_p
    option: REGEXP
    value: ^(left|right|center|justify)$
