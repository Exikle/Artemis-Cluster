---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  mover:
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: atlas
  retention:
    keepDaily: 30
    keepHourly: 24
    keepLatest: 5
    keepMonthly: 6
    keepWeekly: 8
  sources:
    - pvc:
        name: ${APP}
  staging:
    storageClassName: ${KOPIUR_STAGING_STORAGECLASS:=miroir-local}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir}
