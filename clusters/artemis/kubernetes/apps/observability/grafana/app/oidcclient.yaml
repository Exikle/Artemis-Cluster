---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
    - name: app-ops
      namespace: security
  callbackUrls:
    - "https://grafana.dcunha.io/login/generic_oauth"
  clientID: grafana
  launchUrl: "https://grafana.dcunha.io"
  logo:
    autoGenerate: false
  pkceEnabled: true
  secret:
    storeClientSecret: true
