---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pocket-id
spec:
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
  namespaceSelector:
    matchNames:
      - security
  selector:
    matchLabels:
      managed-by: pocket-id-operator
