---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-edge
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns-edge
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-edge
            key: CF_TOKEN
      - name: CF_ZONE_ID
        valueFrom:
          secretKeyRef:
            name: *secret
            key: CF_ZONE_ID
    extraArgs:
      - --annotation-prefix=edge-dns.kubernetes.io/
      - --cloudflare-dns-records-per-page=1000
      - --gateway-name=edge-gateway
      - --zone-id-filter=$(CF_ZONE_ID)
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
    txtOwnerId: artemis-edge
    txtPrefix: k8s.edge.%{record_type}-
    domainFilters:
      - dcunha.io
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
