---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  upgrade:
    timeout: 20m
  values:
    agent:
      loopfileBaseDirs:
        - /var/lib/miroir
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    autoDiskfulAfter: ""
    autoEvictAfter: 6h
    global:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: miroir
                  app.kubernetes.io/instance: miroir
                  app.kubernetes.io/component: controller
              topologyKey: kubernetes.io/hostname
    drbd:
      alExtents: 6007
      portBase: 7800
      verify:
        schedule: "0 4 * * 0"
    groupSnapshots:
      enabled: true
    storageCapacity:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        overrides:
          MiroirVolumeRemoteConsumer:
            disabled: true
    replicaCount: 2
