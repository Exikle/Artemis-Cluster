---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr
spec:
  allowedUserGroups:
    - name: app-ops
      namespace: security
  callbackUrls:
    - "https://radarr.dcunha.io/signin-oidc"
  clientID: radarr
  launchUrl: "https://radarr.dcunha.io/"
  logo:
    autoGenerate: false
  logoutCallbackUrls:
    - "https://radarr.dcunha.io/signout-callback-oidc"
  pkceEnabled: true
  secret:
    storeClientSecret: true
