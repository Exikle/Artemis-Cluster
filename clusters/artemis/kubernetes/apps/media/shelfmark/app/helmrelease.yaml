---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.7.0@sha256:94217011ca1b743ba4ad2923fe8c435b932840dc4e4a227114c83b677b52e51c
            env:
              ABB_ENABLED: "true"
              ABB_HOSTNAME: audiobookbay.lu
              AUDIOBOOK_LIBRARY_URL: "https://audiobooks.dcunha.io"
              AUTH_METHOD: oidc
              BOOKLORE_DESTINATION: bookdrop
              BOOKLORE_HOST: http://bookboss.media.svc.cluster.local:8080
              BOOKLORE_USERNAME: dixon
              BOOKS_OUTPUT_MODE: booklore
              CALIBRE_WEB_URL: "https://books.dcunha.io"
              DESTINATION_AUDIOBOOK: /media/audiobooks
              DOCKERMODE: "true"
              EXT_BYPASSER_TIMEOUT: "120000"
              EXT_BYPASSER_URL: http://trawl.media.svc.cluster.local:8191
              FILE_ORGANIZATION_AUDIOBOOK: organize
              FLASK_PORT: &port 8084
              HARDLINK_TORRENTS_AUDIOBOOK: "false"
              HIDE_LOCAL_AUTH: "true"
              INGEST_DIR: /media/book-ingest
              MAX_CONCURRENT_DOWNLOADS: "8"
              OIDC_ADMIN_GROUP: app_admin
              OIDC_AUTO_REDIRECT: "true"
              OIDC_CLIENT_ID: shelfmark
              OIDC_DISCOVERY_URL: "https://id.dcunha.io/.well-known/openid-configuration"
              PGID: "1000"
              PROWLARR_COLLAPSE_DUPLICATES: "false"
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local:80
              PROWLARR_USE_SEED_PREFERENCES: "true"
              PUID: "1000"
              QBITTORRENT_CATEGORY_AUDIOBOOK: shelfmark-audiobooks
              QBITTORRENT_URL: http://qbittorrent.media.svc.cluster.local:80
              SEARCH_PAGE_TITLE: "Book & Audiobook Search"
              SESSION_COOKIE_SECURE: "true"
              SUPPORTED_FORMATS: epub
              TEMPLATE_AUDIOBOOK_ORGANIZE: "{Author}/{Title}/{Title}"
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: prowlarr
          - extract:
              key: shelfmark
          - extract:
              key: bookboss
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
              OIDC_CLIENT_SECRET: "{{ .SHELFMARK__OIDC__CLIENT_SECRET }}"
              BOOKLORE_PASSWORD: "{{ .API_TOKEN }}"
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /media
      tmpfs:
        type: emptyDir
        advancedMounts:
          shelfmark:
            app:
              - path: /home/shelfmark
                subPath: home
              - path: /var/log
                subPath: log
              - path: /tmp
                subPath: tmp

    route:
      app:
        hostnames:
          - "booksearch.dcunha.io"
        parentRefs:
          - name: edge-gateway
            namespace: network

    service:
      app:
        ports:
          http:
            port: *port
