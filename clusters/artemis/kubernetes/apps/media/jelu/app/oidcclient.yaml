---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: jelu
spec:
  allowedUserGroups:
    - name: app-users
      namespace: security
  callbackUrls:
    - "https://jelu.dcunha.io/login/oauth2/code/pocketid"
  clientID: jelu
  launchUrl: "https://jelu.dcunha.io"
  logo:
    autoGenerate: false
  pkceEnabled: true
  secret:
    storeClientSecret: true
