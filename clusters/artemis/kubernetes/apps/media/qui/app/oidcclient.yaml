---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: qui
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
    - name: app-ops
      namespace: security
  callbackUrls:
    - "https://qui.dcunha.io/api/auth/oidc/callback"
  clientID: qui
  launchUrl: "https://qui.dcunha.io/"
  logo:
    autoGenerate: false
  pkceEnabled: true
  secret:
    storeClientSecret: true
