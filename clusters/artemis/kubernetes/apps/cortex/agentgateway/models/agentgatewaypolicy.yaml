---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway-models
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-models
  traffic:
    headerModifiers:
      request:
        remove:
          - x-api-key
    rateLimit:
      local:
        - key: apiKey.user_id
          tokens: 2000000
          unit: Hours
