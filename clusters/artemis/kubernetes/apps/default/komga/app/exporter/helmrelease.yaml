---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: komga-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: komga-exporter
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      komga-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheuscommunity/json-exporter
              tag: v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
            args:
              - --config.file=/config/config.yml
              - --log.level=warn
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &port 7979
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: komga
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              config.yml: "modules:\n  komga:\n    headers:\n      X-API-Key: \"{{ .KOMGA_API_KEY
                }}\"\n    metrics:\n      - name: komga_actuator\n        type: object\n\
                \        help: Spring Boot Actuator measurement scraped from Komga\n \
                \       path: '{.measurements[*]}'\n        labels:\n          statistic:
                '{.statistic}'\n        values:\n          value: '{.value}'\n  komga-page:\n\
                \    headers:\n      X-API-Key: \"{{ .KOMGA_API_KEY }}\"\n    metrics:\n\
                \      - name: komga_library_books\n        type: value\n        help:
                Books Komga has indexed in this library\n        path: '{.totalElements}'\n"
    persistence:
      config:
        type: secret
        name: komga-exporter
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
    service:
      app:
        ports:
          http:
            port: *port
