---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fingerjoin
spec:
  chartRef:
    kind: OCIRepository
    name: fingerjoin
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/m00nwtchr/fingerjoin
              tag: 0.4.2
              digest: sha256:4531aea179413113edbed7bd833fe51397e55980b770c7fcc5b2da7752ebe95b
            env:
              RUST_LOG: fingerjoin=info,tower_http=info
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 400"]
        hostnames:
          - dcunha.io
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /.well-known/webfinger
            backendRefs:
              - identifier: main
                port: 80
