---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldpd
spec:
  chartRef:
    kind: OCIRepository
    name: lldpd
  interval: 1h
  values:
    defaultPodOptions:
      hostNetwork: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    controllers:
      lldpd:
        type: daemonset
        containers:
          app:
            image:
              repository: ghcr.io/lldpd/lldpd
              tag: 1.0.22@sha256:c12c113c432212b207e42d2a7caff81b22258c96858616c79c50af3c8fbb54c8
            args:
              - -I
              - "*,!cilium*,!lxc*"
              - -m
              - 10.10.99.*
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - NET_ADMIN
                  - NET_RAW
                  - SETGID
                  - SETPCAP
                  - SETUID
                  - SYS_CHROOT
    persistence:
      os-release:
        type: hostPath
        hostPath: /etc/os-release
        hostPathType: File
        globalMounts:
          - path: /etc/os-release
            readOnly: true
