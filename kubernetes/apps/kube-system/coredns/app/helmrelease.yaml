---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    podDisruptionBudget:
      minAvailable: 2
    priorityClassName: system-cluster-critical
    prometheus:
      monitor:
        enabled: false
      service:
        enabled: false
    prometheusRules:
      enabled: false
    replicaCount: 3
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Talos 1.14 applies the DHCPv4 search domain, so every pod's resolv.conf now ends
          # with `dcunha.io`. With ndots:5, a name like `pooler-rw.database.svc.cluster.local`
          # (4 dots) walks the search list before being tried absolute — and
          # `<anything>.dcunha.io` resolves via a Cloudflare wildcard, so upstream answered
          # 172.64.80.1 instead of the ClusterIP. glibc callers (immich, paperless, zigbee,
          # forgesync…) broke; busybox was unaffected as it tries the absolute name first.
          # NXDOMAIN here stops the wildcard being consulted, so glibc falls through correctly.
          # It is not just cluster names: `ghcr.io` (1 dot, also under ndots:5) becomes
          # `ghcr.io.dcunha.io`, which the wildcard answers, and TLS then fails on the cert
          # mismatch — that took out every OCIRepository at once. The bug class is "a name
          # that already contains a dot got the search domain appended", so NXDOMAIN
          # anything with 2+ labels ahead of dcunha.io. Real hosts here are single-label
          # (git/id/artemis.dcunha.io) and keep resolving normally.
          - name: template
            parameters: ANY ANY dcunha.io
            configBlock: |-
              match ^([^.]+\.){2,}dcunha\.io\.$
              rcode NXDOMAIN
              fallthrough
          # Internal split-horizon only overrides the A record: `external.dcunha.io`
          # (which git/registry/… CNAME to) answers 10.10.99.97 internally, but the
          # public Cloudflare AAAA 2606:4700:… passes through untouched. This cluster
          # is IPv4-only, so that address is unreachable by construction and any client
          # that happens to try it first dies with "network is unreachable" — which is
          # why oci-push failed intermittently across different tasks and both
          # registries, not on any one host or tool. Answer NODATA (NOERROR, no answer,
          # no fallthrough) for AAAA so callers only ever see the reachable IPv4.
          # Must stay AFTER the guard above so 2+ label names still get NXDOMAIN.
          - name: template
            parameters: ANY AAAA dcunha.io
            configBlock: |-
              rcode NOERROR
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    service:
      clusterIP: 10.43.0.10
      name: kube-dns
    serviceAccount:
      create: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
