---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    podDisruptionBudget:
      minAvailable: 2
    prometheus:
      monitor:
        enabled: false
      service:
        enabled: false
    prometheusRules:
      enabled: false
    replicaCount: 3
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Talos 1.14 applies the DHCPv4 search domain, so every pod's resolv.conf now ends
          # with `dcunha.io`. With ndots:5, a name like `pooler-rw.database.svc.cluster.local`
          # (4 dots) walks the search list before being tried absolute — and
          # `<anything>.dcunha.io` resolves via a Cloudflare wildcard, so upstream answered
          # 172.64.80.1 instead of the ClusterIP. glibc callers (immich, paperless, zigbee,
          # forgesync…) broke; busybox was unaffected as it tries the absolute name first.
          # NXDOMAIN here stops the wildcard being consulted, so glibc falls through correctly.
          - name: template
            parameters: ANY ANY cluster.local.dcunha.io
            configBlock: |-
              rcode NXDOMAIN
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    service:
      clusterIP: 10.43.0.10
      name: kube-dns
    serviceAccount:
      create: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
