---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: miroir.home-operations.com
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/fstype: ext4
  miroir.home-operations.com/allowRemoteVolumeAccess: "true"
  miroir.home-operations.com/pool: nvme
  miroir.home-operations.com/quorum: freeze
  miroir.home-operations.com/replicas: "3"
volumeBindingMode: WaitForFirstConsumer
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-local
provisioner: miroir.home-operations.com
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/fstype: ext4
  miroir.home-operations.com/pool: nvme
  miroir.home-operations.com/replicas: "1"
volumeBindingMode: WaitForFirstConsumer
