---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  upgrade:
    timeout: 20m
  values:
    agent:
      loopfileBaseDirs:
        - /var/lib/miroir
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    autoDiskfulAfter: ""
    # Eviction discards the dead node's copy, so the threshold must clear the
    # longest planned outage — a Talos upgrade plus reboot, not one hour.
    # Inert today regardless: it needs a spare storage node carrying the
    # volume's pool, and replicas=3 already occupies all three nvme nodes.
    autoEvictAfter: 6h
    global:
      # replicaCount > 1 elects a leader but does not spread the replicas;
      # both warm standbys on one node would fail together.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: miroir
                  app.kubernetes.io/instance: miroir
                  app.kubernetes.io/component: controller
              topologyKey: kubernetes.io/hostname
    drbd:
      alExtents: 6007
      portBase: 7800
      verify:
        # Online verify is the only cross-leg integrity check — a pool scrub
        # only validates a leg against itself. algorithm defaults to crc32c
        # and arms it; without a schedule it never actually runs. Setting it
        # also renders the MiroirVolumeVerifyStale rule (verifyStaleDays: 8
        # suits a weekly cadence).
        schedule: "0 4 * * 0"
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    replicaCount: 2
