---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
    - name: app-ops
      namespace: security
  callbackUrls:
    - "https://photos.dcunha.io/auth/login"
    - "https://photos.dcunha.io/api/oauth/mobile-redirect"
  clientID: immich
  launchUrl: "https://photos.dcunha.io"
  logo:
    autoGenerate: false
  pkceEnabled: false
  secret:
    storeClientSecret: true
