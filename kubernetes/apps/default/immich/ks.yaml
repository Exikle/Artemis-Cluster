---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-database-backup-target
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  path: ./kubernetes/apps/default/immich/database/backup-target
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: cnpg
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich-database-cluster
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  path: ./kubernetes/apps/default/immich/database/cluster
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: cnpg
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
    - name: immich-database-backup-target
      namespace: default
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-app
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  path: ./kubernetes/apps/default/immich/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: immich-database-cluster
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/postgres/app
  postBuild:
    substitute:
      APP: immich
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-microservices
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  path: ./kubernetes/apps/default/immich/microservices
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: immich-app
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-machine-learning
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: immich
  path: ./kubernetes/apps/default/immich/machine-learning
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: immich-app
  wait: false
