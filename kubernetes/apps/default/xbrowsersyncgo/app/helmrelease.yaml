---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xbrowsersyncgo
spec:
  chartRef:
    kind: OCIRepository
    name: xbrowsersyncgo
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
    controllers:
      xbrowsersyncgo:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: git.dcunha.io/exikle/xbrowsersyncgo
              tag: 0.3.0@sha256:aac4a5ba89ec241f2500d73a7ceb8e0c923012273e56a3c27e8156f07b88210f
            env:
              XBROWSERSYNCGO_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: signet-postgres
                    key: url
              XBROWSERSYNCGO_THROTTLE_REQUESTS: "0"
              XBROWSERSYNCGO_TRUST_PROXY: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    route:
      app:
        hostnames:
          - xbs.dcunha.io
        parentRefs:
          - name: edge-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: 8081
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics
            interval: 60s
            scrapeTimeout: 15s
