---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manga-watcher
  namespace: default
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: watcher
              image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              command:
                - "/bin/sh"
                - "-c"
              args:
                - |
                  set -eu

                  FAILED=0
                  TAB="$(printf '\t')"
                  export LC_ALL=C

                  komga_scan() {
                    if wget --post-data="" \
                      --header="X-API-Key: $KOMGA_API_KEY" \
                      "http://komga.default.svc.cluster.local/api/v1/libraries/$1/scan" \
                      -q -O /dev/null
                    then
                      echo "[*] Scan triggered for library $1"
                    else
                      echo "[!] Scan trigger failed for library $1"
                      FAILED=1
                    fi
                  }

                  plan_links() {
                    awk -v dest="$1" -v skipfile="$2" '
                      {
                        n = split($0, p, "/")
                        base = p[n]
                        sub(/\.cbz$/, "", base)
                        num = ""
                        if (match(base, /^Chapter[ ]*[0-9]+(\.[0-9]+)?/)) {
                          num = substr(base, RSTART, RLENGTH)
                          sub(/^Chapter[ ]*/, "", num)
                        } else if (match(base, /[0-9]+(\.[0-9]+)?$/)) {
                          num = substr(base, RSTART, RLENGTH)
                        }
                        if (num == "") {
                          print base >> skipfile
                        } else {
                          while (length(num) > 1 && substr(num, 1, 1) == "0" && substr(num, 2, 1) != ".") {
                            num = substr(num, 2)
                          }
                          printf "%s\t%s/%s/Chapter %s.cbz\n", $0, dest, p[n - 1], num
                        }
                      }
                    '
                  }

                  kai_process() {
                    SRC="$1"
                    DEST="$2"
                    LIB="$3"
                    LABEL="$4"

                    echo "[*] Scanning Rensaio $LABEL..."

                    if [ ! -d "$SRC" ]; then
                      echo "[!] Source directory missing: $SRC"
                      FAILED=1
                      return 0
                    fi
                    mkdir -p "$DEST"

                    plan=/tmp/plan.$LABEL
                    winners=/tmp/winners.$LABEL
                    skips=/tmp/skips.$LABEL
                    expected=/tmp/expected.$LABEL
                    actual=/tmp/actual.$LABEL
                    orphans=/tmp/orphans.$LABEL
                    : > "$skips"

                    linked=0
                    pruned=0

                    find "$SRC" -mindepth 2 -maxdepth 2 -name '*.cbz' \
                      | plan_links "$DEST" "$skips" \
                      | sort -t"$TAB" -k2,2 -k1,1 > "$plan"

                    awk -F"$TAB" '
                      NR > 1 && $2 != prev { print keep }
                      { keep = $0; prev = $2 }
                      END { if (NR > 0) print keep }
                    ' "$plan" > "$winners"

                    cut -f2 "$winners" | sort -u > "$expected"

                    contested=$(($(wc -l < "$plan") - $(wc -l < "$winners")))
                    if [ "$contested" -gt 0 ]; then
                      echo "[!] $LABEL: $contested source file(s) lost a chapter-slot collision"
                    fi

                    while IFS="$TAB" read -r filepath target; do
                      [ -n "$target" ] || continue
                      if [ "$filepath" -ef "$target" ]; then
                        continue
                      fi
                      mkdir -p "$(dirname "$target")"
                      ln -f "$filepath" "$target"
                      linked=$((linked + 1))
                      echo "[*] Linked: $target"
                    done < "$winners"

                    skipped=$(wc -l < "$skips")

                    find "$DEST" -mindepth 2 -maxdepth 2 -name '*.cbz' | sort -u > "$actual"

                    if [ ! -s "$expected" ] && [ -s "$actual" ]; then
                      echo "[!] $LABEL: source yielded no files but $DEST is not empty — refusing to prune"
                      FAILED=1
                      return 0
                    fi

                    comm -23 "$actual" "$expected" > "$orphans"

                    while IFS= read -r stale; do
                      [ -n "$stale" ] || continue
                      rm -f "$stale"
                      pruned=$((pruned + 1))
                      echo "[-] Pruned: $stale"
                    done < "$orphans"

                    find "$DEST" -mindepth 1 -maxdepth 1 -type d -exec rmdir {} + 2>/dev/null || true

                    if [ "$skipped" -gt 0 ]; then
                      echo "[!] $LABEL: $skipped file(s) had no parseable chapter number:"
                      sed 's/^/      /' "$skips"
                    fi

                    echo "[*] $LABEL: linked=$linked pruned=$pruned skipped=$skipped"

                    if [ "$linked" -gt 0 ] || [ "$pruned" -gt 0 ]; then
                      komga_scan "$LIB"
                    else
                      echo "[*] No $LABEL changes."
                    fi
                  }

                  kai_process \
                    /media/downloads/kaizoku/Manga \
                    /media/manga \
                    0Q7FWJ7XXAPEC \
                    manga
                  kai_process \
                    /media/downloads/kaizoku/Manhwa \
                    /media/manhwa \
                    0QGGQTW99MDZB \
                    manhwa
                  kai_process \
                    /media/downloads/kaizoku/Comic \
                    /media/comic \
                    0QGGW20SXM5Q3 \
                    comic

                  if [ "$FAILED" -ne 0 ]; then
                    echo "[!] Completed with errors."
                    exit 1
                  fi
                  echo "[*] Done."
              env:
                - name: KOMGA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: komga
                      key: KOMGA_API_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - "ALL"
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: media
                  mountPath: /media
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: media
              nfs:
                server: 10.10.99.100
                path: /mnt/atlas/media
            - name: tmp
              emptyDir: {}
