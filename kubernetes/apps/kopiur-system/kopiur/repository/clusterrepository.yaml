---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: atlas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: 10.10.99.100
          path: /mnt/atlas/Kopiur
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  moverDefaults:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: ceph-block
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  scheduleDefaults:
    timezone: America/Toronto
