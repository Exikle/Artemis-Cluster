---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: atlas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: 10.10.99.100
          path: /mnt/atlas/Kopiur
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 1800
  # Was unlimited. 28 hourly policies can put every mover in flight at once,
  # and each one asks miroir for a snapshot and a staged volume; capping the
  # pool keeps that load bounded while a storage node is degraded, and bounds
  # the node-local emptyDir caches (~3Gi each) to three at a time. Restores are
  # always admitted and displace backups rather than queueing behind them.
  concurrency:
    maxConcurrentJobs: 3
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  health:
    indexBlobWarnThreshold: 4000
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    failurePolicy:
      activeDeadlineSeconds: 3600
    mover:
      cache:
        capacity: 10Gi
        contentCacheSizeMb: 3000
        metadataCacheSizeMb: 4000
        mode: Persistent
        storageClassName: miroir
    schedule:
      full:
        cron: 0 3 * * *
        jitter: 1h
      quick:
        cron: 0 * * * *
        jitter: 10m
  moverDefaults:
    # No `capacity` on purpose: an Ephemeral cache without one is a node-local
    # emptyDir instead of a PVC. That drops 28 miroir-local volumes an hour, and
    # it removes the second node-pinned volume from every mover pod — the staged
    # `-src` and the cache could land on different nodes, and a PV's node
    # affinity is immutable, so the pod was then unschedulable forever. The
    # kopia budgets below still bound what the mover writes into the emptyDir.
    # Measured across 615 snapshots here: a PVC-backed cache buys no speedup,
    # 30-50s median regardless of volume size.
    cache:
      contentCacheSizeMb: 2000
      metadataCacheSizeMb: 1000
      mode: Ephemeral
    # The `nvme` pool only exists on the three storage nodes, so a mover
    # scheduled onto a worker cannot host its own staged PVC — miroir then
    # places it elsewhere in the pool and the pod can never bind. Same label the
    # MiroirNodeGroup selects on.
    nodeSelector:
      storage.dcunha.io/miroir: "true"
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: America/Toronto
