---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: audiobookshelf
spec:
  allowedUserGroups:
    - name: app-users
      namespace: security
  callbackUrls:
    - "https://audiobooks.dcunha.io/auth/openid/callback"
    - "https://audiobooks.dcunha.io/auth/openid/mobile-redirect"
    - "https://audiobooks.dcunha.io/audiobookshelf/auth/openid/callback"
    - "https://audiobooks.dcunha.io/audiobookshelf/auth/openid/mobile-redirect"
  clientID: audiobookshelf
  launchUrl: "https://audiobooks.dcunha.io"
  logo:
    autoGenerate: false
  pkceEnabled: true
  secret:
    storeClientSecret: true
