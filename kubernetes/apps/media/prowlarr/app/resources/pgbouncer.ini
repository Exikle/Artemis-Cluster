[databases]
prowlarr = host=pooler-rw.database.svc port=5432 dbname=prowlarr user=prowlarr
prowlarr-log = host=pooler-rw.database.svc port=5432 dbname=prowlarr-log user=prowlarr

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 5432
unix_socket_dir =
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 100
default_pool_size = 5
max_db_connections = 5
server_tls_sslmode = verify-full
server_tls_ca_file = /var/run/secrets/postgres-server-ca/ca.crt
server_tls_cert_file = /var/run/secrets/postgresql/tls.crt
server_tls_key_file = /var/run/secrets/postgresql/tls.key
ignore_startup_parameters = extra_float_digits
