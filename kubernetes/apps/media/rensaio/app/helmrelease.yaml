---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rensaio
spec:
  chartRef:
    kind: OCIRepository
    name: rensaio
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      rensaio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/maxpiva/rensaio
              tag: latest@sha256:199777c5daf62fb476882ff03914722dc723df619d03c4f61250297651083ffe
            env:
              Oidc__AdminGroup: app_admin
              Oidc__AutoRegister: "true"
              Oidc__ButtonLabel: Sign in with Pocket ID
              Oidc__ClientId: rensaio
              Oidc__ClientSecret:
                valueFrom:
                  secretKeyRef:
                    name: rensaio-oidc-credentials
                    key: client_secret
              Oidc__Enabled: "true"
              Oidc__Issuer: https://id.dcunha.io
              PGID: 100
              PUID: 99
              RENSAIO_DATADIR: /config
              UMASK: "022"
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 750m
                memory: 1Gi
              limits:
                memory: 3Gi
          logrotate:
            image:
              repository: docker.io/library/busybox
              tag: 1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -c
              - |
                while true; do
                  if [ -f "$CRASH_LOG" ] && [ "$(stat -c %s "$CRASH_LOG")" -gt "$MAX_BYTES" ]; then
                    : > "$CRASH_LOG"
                    echo "truncated $CRASH_LOG"
                  fi
                  sleep 60
                done
            env:
              CRASH_LOG: /config/logs/crash-.log
              MAX_BYTES: "104857600"
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsUser: 99
              runAsGroup: 100
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        advancedMounts:
          rensaio:
            app:
              - path: /series
                subPath: downloads/kaizoku
      tmp:
        type: emptyDir
        advancedMounts:
          rensaio:
            app:
              - path: /tmp
                subPath: tmp
      backups:
        type: emptyDir
        advancedMounts:
          rensaio:
            app:
              - path: /config/Backups
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: external-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: 9833
