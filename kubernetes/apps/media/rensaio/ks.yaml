---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rensaio
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/rensaio/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 1m
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CACHE_STORAGECLASS: miroir-local
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PGID: "100"
      KOPIUR_PUID: "99"
      KOPIUR_SNAPSHOTCLASS: miroir
      KOPIUR_STORAGECLASS: miroir
  wait: false
