---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: jelu-crowdsec
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jelu
  wasm:
    - name: crowdsec
      code:
        type: Image
        image:
          sha256: 3177bda88147c0a2493911af7e17fc79e6603bdcbaefccde8eae83b7ebeeb0e0
          url: ghcr.io/aarnaud/crowdsec-wasm-bouncer:0.8.4
      config:
        crowdsec:
          appsec:
            async_mode: false
            cluster: crowdsec_appsec
            enabled: true
            fail_open: true
            forward_body: true
            max_body_size_kb: 64
          lapi:
            cluster: crowdsec_lapi
            enabled: false
      env:
        hostKeys:
          - CROWDSEC_LAPI_KEY
          - CROWDSEC_APPSEC_KEY
      failOpen: true
