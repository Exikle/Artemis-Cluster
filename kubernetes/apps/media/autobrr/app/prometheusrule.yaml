---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: autobrr
spec:
  groups:
    - name: autobrr.rules
      rules:
        - alert: AutobrrIrcNetworkDown
          annotations:
            summary: >-
              autobrr IRC watchdog has not passed in over an hour — an IRC network is
              still unhealthy after restarts, so its announces are not being received
              (kubectl -n media logs job/<latest autobrr-irc-watchdog job>)
          expr: |-
            time() - kube_cronjob_status_last_successful_time{namespace="media", cronjob="autobrr-irc-watchdog"} > 3600
          for: 15m
          labels:
            severity: warning
