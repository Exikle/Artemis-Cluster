---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lncrawl
spec:
  chartRef:
    kind: OCIRepository
    name: lncrawl
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      lncrawl:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lncrawl/lightnovel-crawler
              tag: 4.14.0@sha256:7ef56dce9521847798d68f4d73eb3e899a5dd2e18ce6ae60ced6a5485babc53b
            args:
              - -ll
              - server
              - -p
              - "8080"
            env:
              LNCRAWL_DATA_PATH: /data
              PYTHONUNBUFFERED: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          ingest-sync:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            args:
              - |
                # Copy each newly built EPUB into bookboss's ingest dir once.
                [ -f /data/.ingest-marker ] || touch /data/.ingest-marker
                while true; do
                  find /data/novels -name '*.epub' -type f -newer /data/.ingest-marker -exec cp {} /media/book-ingest/ \;
                  touch /data/.ingest-marker
                  sleep 120
                done
            command:
              - /bin/sh
              - -c
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /media/book-ingest
            subPath: book-ingest
      tmpfs:
        type: emptyDir
        advancedMounts:
          lncrawl:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - "lncrawl.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
