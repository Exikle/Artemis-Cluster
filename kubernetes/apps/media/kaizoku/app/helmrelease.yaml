---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaizoku
spec:
  chartRef:
    kind: OCIRepository
    name: kaizoku
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      kaizoku:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/maxpiva/rensaio
              tag: latest@sha256:de466f327ab4fd2a501af2872aa9741a0f5ec17ebd5594a18c1c562677cde140
            env:
              PGID: 100
              PUID: 99
              RENSAIO_DATADIR: /config
              UMASK: "022"
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
          # Rensaio's FallbackCrashLogger writes /config/logs/crash-.log with no rotation
          # of any kind — Serilog only manages log-*.txt. Mihon extension errors grew it
          # to 3.4G and filled the config PVC. Truncate in place rather than deleting, so
          # the app's already-open file handle keeps writing instead of leaking the space.
          # It logs first-chance IKVM exceptions at ~5MB/min, hence the 60s check.
          logrotate:
            image:
              repository: docker.io/library/busybox
              tag: 1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -c
              - |
                while true; do
                  if [ -f "$CRASH_LOG" ] && [ "$(stat -c %s "$CRASH_LOG")" -gt "$MAX_BYTES" ]; then
                    : > "$CRASH_LOG"
                    echo "truncated $CRASH_LOG"
                  fi
                  sleep 60
                done
            env:
              CRASH_LOG: /config/logs/crash-.log
              MAX_BYTES: "104857600"
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsUser: 99
              runAsGroup: 100
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        advancedMounts:
          kaizoku:
            app:
              - path: /series
                subPath: downloads/kaizoku
      tmp:
        type: emptyDir
        advancedMounts:
          kaizoku:
            app:
              - path: /tmp
                subPath: tmp
      backups:
        type: emptyDir
        advancedMounts:
          kaizoku:
            app:
              - path: /config/Backups
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: 9833
