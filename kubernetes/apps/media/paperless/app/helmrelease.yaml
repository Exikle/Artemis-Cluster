---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: paperless
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-run:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.0@sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
            command: ["/bin/mkdir", "-p", "-m", "0755", "/vol/run"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.0@sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
            env:
              PAPERLESS_URL: "https://paperless.dcunha.io"
              PAPERLESS_REDIS: "redis://dragonfly.database.svc.cluster.local:6379/1"
              PAPERLESS_DBHOST: postgres-rw.database.svc.cluster.local
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBUSER: paperless
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    key: POSTGRES_PASSWORD
                    name: paperless-postgres
              PAPERLESS_DBSSLMODE: verify-full
              PAPERLESS_DBSSLROOTCERT: /var/run/secrets/postgres-server-ca/ca.crt
              PGSSLMODE: verify-full
              PGSSLROOTCERT: /var/run/secrets/postgres-server-ca/ca.crt
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: "http://paperless-tika.media.svc.cluster.local:9998"
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://paperless-gotenberg.media.svc.cluster.local:3000"
              PAPERLESS_DATA_DIR: /data
              PAPERLESS_CONSUMPTION_DIR: /ingest
              PAPERLESS_MEDIA_ROOT: /documents
              PAPERLESS_EXPORT_DIR: /export
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
              PAPERLESS_OCR_MODE: auto
              PAPERLESS_OCR_CLEAN: clean
              PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{document_type}/{title}"
              PAPERLESS_FILENAME_DATE_ORDER: YMD
              PAPERLESS_TASK_WORKERS: "1"
              PAPERLESS_THREADS_PER_WORKER: "2"
              S6_READ_ONLY_ROOT: "1"
            envFrom:
              - externalSecretRef:
                  identifier: env
              - externalSecretRef:
                  identifier: generated
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /
                    port: &port 8000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: paperless
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
              PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
              PAPERLESS_SOCIALACCOUNT_PROVIDERS: "{\"openid_connect\": {\"EMAIL_AUTHENTICATION\"\
                : true, \"APPS\": [{\"provider_id\": \"pocket-id\", \"name\": \"Pocket-ID\"\
                , \"client_id\": \"paperless\", \"secret\": \"{{ .PAPERLESS_OIDC_CLIENT_SECRET
                }}\", \"settings\": {\"server_url\": \"https://id.dcunha.io\", \"oauth_pkce_enabled\": true}}]}}\n"
      generated:
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: paperless
        refreshPolicy: CreatedOnce
    persistence:
      config:
        existingClaim: paperless
        globalMounts:
          - path: /data
      ocr:
        type: nfs
        path: /mnt/atlas/media/scanned-documents
        server: 10.10.99.100
        globalMounts:
          - path: /ingest
            subPath: ingest
          - path: /documents
            subPath: documents
          - path: /export
            subPath: export
      run:
        type: emptyDir
        advancedMounts:
          paperless:
            init-run:
              - path: /vol
            app:
              - path: /run
                subPath: run
      tmp:
        type: emptyDir
        advancedMounts:
          paperless:
            app:
              - path: /tmp
                subPath: tmp

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: edge-gateway
            namespace: network

    service:
      app:
        ports:
          http:
            port: *port
