---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: paperless
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
  callbackUrls:
    - "https://paperless.dcunha.io/accounts/oidc/pocket-id/login/callback/"
  clientID: paperless
  launchUrl: "https://paperless.dcunha.io/"
  logo:
    autoGenerate: false
  name: Paperless
  pkceEnabled: false
  requiresReauthentication: true
  secret:
    storeClientSecret: true
