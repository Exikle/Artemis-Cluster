---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-gotenberg
spec:
  chartRef:
    kind: OCIRepository
    name: paperless-gotenberg
  interval: 1h
  values:
    controllers:
      gotenberg:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
        containers:
          app:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 9.5.0@sha256:ac61457a1e889ef1ca256a9afc117cff8caf517f19e66ea23cede3feb22f69a5
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      home:
        type: emptyDir
        advancedMounts:
          gotenberg:
            app:
              - path: /home/gotenberg
      tmp:
        type: emptyDir
        advancedMounts:
          gotenberg:
            app:
              - path: /tmp
                subPath: tmp

    service:
      app:
        controller: gotenberg
        ports:
          http:
            port: 3000
