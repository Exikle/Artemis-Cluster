---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: komf
spec:
  chartRef:
    kind: OCIRepository
    name: komf
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 6470
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 6470
        runAsNonRoot: true
        runAsUser: 6470

    controllers:
      komf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: sndxr/komf
              tag: 2.1.0@sha256:373580779e2e75d4e00e2f05859f789e05691c54600ca83d1cb528f0aad1f7b6
            env:
              KOMF_KOMGA_BASE_URI: "http://komga.default.svc.cluster.local:80"
              KOMF_LOG_LEVEL: INFO
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /
                    port: &port 8085
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi

    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: komga
          - extract:
              key: komf
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              KOMF_KOMGA_PASSWORD: "{{ .password }}"
              KOMF_KOMGA_USER: "{{ .username }}"
              KOMF_SERVER_API_KEY: "{{ .KOMF_API_KEY }}"
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      configmap:
        type: configMap
        name: komf-configmap
        globalMounts:
          - path: /config/application.yml
            subPath: application.yml
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /media/manga
            subPath: manga
          - path: /media/manhwa
            subPath: manhwa
          - path: /media/comics
            subPath: comics

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network

    service:
      app:
        ports:
          http:
            port: *port
