---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: komf
spec:
  chartRef:
    kind: OCIRepository
    name: komf
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 6470
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 6470
        runAsNonRoot: true
        runAsUser: 6470

    controllers:
      komf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.dcunha.io/exikle/komfgo
              tag: 0.5.1@sha256:eddc2b84b5487e27494b8b650abc6bdd2e5e688a92939adc2ff70efd027b4cdb
            env:
              KOMF_KOMGA_BASE_URI: "http://komga.default.svc.cluster.local:80"
              KOMF_LOG_LEVEL: INFO
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /
                    port: &port 8085
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: komga
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              KOMF_KOMGA_PASSWORD: "{{ .password }}"
              KOMF_KOMGA_USER: "{{ .username }}"
    persistence:
      # KomfGo keeps no state; /config only holds provider database downloads.
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      configmap:
        type: configMap
        name: komf-configmap
        globalMounts:
          - path: /config/application.yml
            subPath: application.yml
      tmp:
        type: emptyDir
        advancedMounts:
          komf:
            app:
              - path: /tmp
                subPath: tmp

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network

    service:
      app:
        ports:
          http:
            port: *port
