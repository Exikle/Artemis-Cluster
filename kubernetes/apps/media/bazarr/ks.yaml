---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/bazarr/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
    - ../../../../components/tinyauth
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      # Canary for #1524 §10.2 — measured cold-cache runs are no slower than warm
      # ones, so the persistent cache is being retired. Remove this line once the
      # component default flips to Ephemeral.
      KOPIUR_CACHE_MODE: Ephemeral
  wait: true
