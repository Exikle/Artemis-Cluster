---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr-recovery
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: bazarr
  path: ./kubernetes/apps/media/bazarr/recovery
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/bazarr/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/cert
    - ../../../../components/tinyauth
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      PG_APP: *app
  wait: false
