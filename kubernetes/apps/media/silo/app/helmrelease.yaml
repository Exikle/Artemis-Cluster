---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  chartRef:
    kind: OCIRepository
    name: silo
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        supplementalGroups:
          - 44
          - 105
    controllers:
      silo:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: silo-gpu
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1745@sha256:c8060dc2080830a878871e3537a3ee4bf17a2c5a2ef09905f29df62bf11e1c21
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    key: url
                    name: silo-postgres
              HOME: /tmp
              JF_PORT: &jfPort 8096
              PORT: &port 8080
              POSTGRES_TUNE: "off"
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/6
              SILO_METRICS_LISTEN: :9091
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: 10.42.0.0/16
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 120
                  periodSeconds: 10
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 1
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    externalSecrets:
      env:
        data:
          - secretKey: SECRET_KEY
            remoteRef:
              key: silo
              property: SECRET_KEY
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
    persistence:
      appdata:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /var/lib/silo/artwork
            subPath: .silo/artwork
          - path: /var/lib/silo/compat
            subPath: .silo/compat
      media:
        type: nfs
        path: /mnt/atlas/media
        server: 10.10.99.100
        globalMounts:
          - path: /media
            readOnly: true
      tmpfs:
        type: emptyDir
        sizeLimit: 30Gi
        advancedMounts:
          silo:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: edge-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      jellyfin:
        hostnames:
          - "{{ .Release.Name }}-jf.dcunha.io"
          - jellyfin.dcunha.io
        parentRefs:
          - name: edge-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *jfPort
    service:
      app:
        controller: silo
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
