---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: silo
spec:
  compression:
    - type: Zstd
    - type: Brotli
    - type: Gzip
  connection:
    bufferLimit: 8Mi
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - methods:
                - value: POST
              path:
                type: RegularExpression
                value: "^/api/v1/auth/(login|device/start)$"
              sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 10
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 1200
            unit: Minute
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - reset-before-request
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: silo-app
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
