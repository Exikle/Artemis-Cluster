---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: url
              IMMICH_CONFIG_FILE: /config/immich.json
              IMMICH_MACHINE_LEARNING_URL: http://immich-ml.media.svc.cluster.local:3003
              IMMICH_WORKERS_INCLUDE: api
              REDIS_DBINDEX: "2"
              REDIS_HOSTNAME: dragonfly.database.svc.cluster.local
            envFrom:
              - secretRef:
                  name: immich
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 90
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      library:
        type: nfs
        path: /mnt/atlas/media/photos
        server: 10.10.99.100
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload
      config:
        type: secret
        name: immich
        advancedMounts:
          server:
            app:
              - path: /config/immich.json
                subPath: immich.json
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
                subPath: tmp

    route:
      app:
        hostnames:
          - photos.dcunha.io
        parentRefs:
          - name: external-gateway
            namespace: network
        rules:
          - backendRefs:
              - name: immich
                port: 2283

    service:
      server:
        controller: server
        ports:
          http:
            port: 2283
