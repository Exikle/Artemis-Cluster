---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: streamystats
spec:
  chartRef:
    kind: OCIRepository
    name: streamystats
  interval: 1h
  values:
    controllers:
      job-server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-job-server
              tag: v2.18.1@sha256:fba43363b72e1418418e881aca05a8f85652fde5461ff7d71cda209f5d50ab4a
            env:
              NODE_ENV: production
              PORT: "3005"
              HOST: 0.0.0.0
              CRON_EMBEDDINGS_SYNC: "0 0 31 2 *"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    key: url
                    name: streamystats-postgres
              NODE_EXTRA_CA_CERTS: /var/run/secrets/postgres-server-ca/ca.crt
            envFrom:
              - secretRef:
                  name: streamystats
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      nextjs-app:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-nextjs
              tag: v2.18.1@sha256:5560e0a936617a56e70f1951700d202b440072dcd2d7ebffd35e7999c388be8b
            env:
              NODE_ENV: production
              HOSTNAME: 0.0.0.0
              JOB_SERVER_URL: http://streamystats-job-server.media.svc.cluster.local:3005
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    key: url
                    name: streamystats-postgres
              NODE_EXTRA_CA_CERTS: /var/run/secrets/postgres-server-ca/ca.crt
            envFrom:
              - secretRef:
                  name: streamystats
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      nextjs-cache:
        type: emptyDir
        advancedMounts:
          nextjs-app:
            app:
              - path: /app/apps/nextjs-app/.next/cache
      tmpfs:
        type: emptyDir
        advancedMounts:
          job-server:
            app:
              - path: /tmp
                subPath: tmp
          nextjs-app:
            app:
              - path: /tmp
                subPath: tmp

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: internal
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    service:
      app:
        controller: nextjs-app
        ports:
          http:
            port: *port
      job-server:
        controller: job-server
        ports:
          http:
            port: 3005
