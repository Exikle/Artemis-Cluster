---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: streamystats
spec:
  chartRef:
    kind: OCIRepository
    name: streamystats
  interval: 1h
  values:
    controllers:
      job-server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-job-server
              tag: v2.18.1
            env:
              NODE_ENV: production
              PORT: "3005"
              HOST: 0.0.0.0
              # Disable AI embeddings sync
              CRON_EMBEDDINGS_SYNC: "0 0 31 2 *"
              # postgres-js can't present a client cert; the pgbouncer sidecar owns TLS to pooler-rw
              DATABASE_URL: postgresql://streamystats@localhost:5432/streamystats
            envFrom:
              - secretRef:
                  name: streamystats
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          pgbouncer:
            image:
              repository: ghcr.io/cloudnative-pg/pgbouncer
              tag: 1.25.2@sha256:8206b626061af375be017348f81152a4c2005aef9ef56391f7f48e47b8342894
            command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      [
                        "pg_isready",
                        "-h",
                        "127.0.0.1",
                        "-p",
                        "5432",
                        "-d",
                        "streamystats",
                        "-U",
                        "streamystats",
                      ]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      nextjs-app:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-nextjs
              tag: v2.18.1
            env:
              NODE_ENV: production
              HOSTNAME: 0.0.0.0
              JOB_SERVER_URL: http://streamystats-job-server:3005
              # postgres-js can't present a client cert; the pgbouncer sidecar owns TLS to pooler-rw
              DATABASE_URL: postgresql://streamystats@localhost:5432/streamystats
            envFrom:
              - secretRef:
                  name: streamystats
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          pgbouncer:
            image:
              repository: ghcr.io/cloudnative-pg/pgbouncer
              tag: 1.25.2@sha256:8206b626061af375be017348f81152a4c2005aef9ef56391f7f48e47b8342894
            command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      [
                        "pg_isready",
                        "-h",
                        "127.0.0.1",
                        "-p",
                        "5432",
                        "-d",
                        "streamystats",
                        "-U",
                        "streamystats",
                      ]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    persistence:
      pgbouncer-config:
        type: configMap
        name: streamystats-pgbouncer
        advancedMounts:
          job-server:
            pgbouncer:
              - path: /etc/pgbouncer
          nextjs-app:
            pgbouncer:
              - path: /etc/pgbouncer
      nextjs-cache:
        type: emptyDir
        advancedMounts:
          nextjs-app:
            app:
              - path: /app/apps/nextjs-app/.next/cache
      tmpfs:
        type: emptyDir
        advancedMounts:
          job-server:
            app:
              - path: /tmp
                subPath: tmp
          nextjs-app:
            app:
              - path: /tmp
                subPath: tmp

    service:
      app:
        controller: nextjs-app
        ports:
          http:
            port: *port
      job-server:
        controller: job-server
        ports:
          http:
            port: 3005

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: internal
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
