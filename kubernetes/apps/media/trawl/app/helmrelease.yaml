---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trawl
spec:
  chartRef:
    kind: OCIRepository
    name: trawl
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
    controllers:
      trawl:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/germondai/trawl
              tag: 1.4.2@sha256:86b1fdf26cfeebd996eeedaeb774002434f4cf8d02e5486f8a8173373c4d6e9b
            env:
              BROWSER_CONTENT_PROCESSES: "2"
              BROWSER_POOL_SIZE: "1"
              BROWSER_RECYCLE_AFTER_CONTEXTS: "3"
              HOME: /tmp
              PORT: &port 8191
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/5
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 5Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
    persistence:
      addons:
        type: emptyDir
        advancedMounts:
          trawl:
            app:
              - path: /opt/camoufox/addons
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        advancedMounts:
          trawl:
            app:
              - path: /dev/shm
      tmp:
        type: emptyDir
        advancedMounts:
          trawl:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        ports:
          http:
            port: *port
