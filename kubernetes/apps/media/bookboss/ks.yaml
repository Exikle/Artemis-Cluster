---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookboss
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/bookboss/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: pocket-id-operator
      namespace: security
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 512Mi
      KOPIUR_PGID: "1234"
      KOPIUR_PUID: "1234"
  wait: false
