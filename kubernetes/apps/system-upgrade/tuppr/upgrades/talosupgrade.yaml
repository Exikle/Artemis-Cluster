---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.0
  policy:
    rebootMode: powercycle
    # 30m (the default) proved tight: talos-w-01 failed with the node still on
    # the old version, and factory.talos.dev bakes installer images on first
    # request, which already stalled one pre-pull this roll.
    timeout: 45m
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !(status.phase in ['Pending', 'Running'])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
      timeout: 10m
  drain:
    enabled: true
