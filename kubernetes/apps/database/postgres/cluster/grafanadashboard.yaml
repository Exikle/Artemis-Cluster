---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: postgres
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  # Forked from https://grafana.com/api/dashboards/20417/revisions/4/download — the $cluster
  # template variable's regex is patched to read the "exported_cluster" label instead of
  # "cluster", since vmagent's externalLabels.cluster=artemis renames CNPG's own cluster
  # label to exported_cluster (see observability/victoria/agent/vmagent.yaml).
  gzipJson: |-
    
