---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  certificates:
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-replication-cert
    serverCASecret: postgres-server-ca
    serverTLSSecret: postgres-server-cert
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152
  instances: 2
  managed:
    roles:
      - ensure: present
        login: true
        name: apoci
        passwordSecret:
          name: apoci-postgres
        superuser: false
      - ensure: present
        login: true
        name: autobrr
        passwordSecret:
          name: autobrr-postgres
        superuser: false
      - ensure: present
        login: true
        name: autopulse
        passwordSecret:
          name: autopulse-postgres
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: bazarr
        superuser: false
      - ensure: present
        login: true
        name: bookboss
        passwordSecret:
          name: bookboss-postgres
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: litellm
        superuser: false
      - ensure: present
        login: true
        name: memini
        passwordSecret:
          name: memini-postgres
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: paperless
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: pocket-id
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: prowlarr
        superuser: false
      - ensure: present
        login: true
        name: qui
        passwordSecret:
          name: qui-postgres
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: radarr
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: seerr
        superuser: false
      - ensure: present
        login: true
        name: sonarr
        passwordSecret:
          name: sonarr-postgres
        superuser: false
      - disablePassword: true
        ensure: present
        login: true
        name: streamystats
        superuser: false
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: r2-store
  postgresql:
    extensions:
      - dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        name: vchord
    parameters:
      archive_timeout: 900s
      checkpoint_timeout: 30min
      maintenance_work_mem: 128MB
      max_connections: "200"
      max_wal_size: 2GB
      shared_buffers: 256MB
    pg_hba:
      - hostssl all sonarr,apoci,memini,autobrr,qui,bookboss,autopulse all scram-sha-256
      - hostssl all all all cert clientcert=verify-full
    shared_preload_libraries:
      - vchord
  primaryUpdateMethod: switchover
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  storage:
    size: 40Gi
    storageClass: ceph-block
