---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name dragonfly
  labels:
    metrics: *name
spec:
  podMetricsEndpoints:
    - port: admin
  podTargetLabels:
    - app
  selector:
    matchLabels:
      app: *name
