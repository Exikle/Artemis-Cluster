---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/config_v1.json
apiVersion: v1
kind: Config
clusters:
  - name: artemis
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
contexts:
  - name: artemis
    context:
      cluster: artemis
      user: claude-code
      namespace: default
current-context: artemis
users:
  - name: claude-code
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
