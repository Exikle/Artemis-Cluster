---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configmap.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./oidcclient.yaml
  - ./virtualkey.yaml
configMapGenerator:
  - name: hermes-cluster-health-seed
    files:
      - seed/cluster-health/apoci-pvc-triage.md
      - seed/cluster-health/etcd-triage.md
      - seed/cluster-health/miroir-triage.md
      - seed/cluster-health/pocket-id-operator-triage.md
      - seed/cluster-health/resolved-cases.md
      - seed/cluster-health/smartctl-sas-triage.md
      - seed/cluster-health/targetdown-triage.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-adhd-friendly-communication
    files:
      - skills/adhd-friendly-communication/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-artemis-cluster-ops
    files:
      - skills/artemis-cluster-ops/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-cluster-health
    files:
      - skills/cluster-health/SKILL.md
      - skills/cluster-health/references/node-baselines.md
      - skills/cluster-health/scripts/targetdown-check.sh
      - skills/cluster-health/scripts/trim-triage-log.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-forgejo-gitea-api
    files:
      - skills/forgejo-gitea-api/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-session-review
    files:
      - skills/session-review/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-skill-skill-change-pr
    files:
      - skills/skill-change-pr/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
