---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretname hermes-config
spec:
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *secretname
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_API_KEY: "{{ .MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
      templateFrom:
        - configMap:
            name: hermes-configmap
            items:
              - key: env
