---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-config
    creationPolicy: Owner
    template:
      data:
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_OIDC_CLIENT_SECRET }}"
        LITELLM_API_KEY: "{{ .MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        FORGEJO_PAT: "{{ .FORGEJO_PAT }}"
      templateFrom:
        - configMap:
            name: hermes-configmap
            items:
              - key: env
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
    - extract:
        key: forgejo
