---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  timeout: 15m
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        initContainers:
          copy-agent-source:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:a39fc11620213e3669a327aff5c6cb1eb2b8a238c6044e33e7ef8885833d89a7
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # tolerate root-only playwright .deps; fail on anything else
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                cp /run/config/env /opt/data/.env
                chmod 600 /opt/data/.env
                # skills are read-only mounts; drop stale local copies — .agents/references/hermes.md
                rm -rf /opt/data/skills/.git-sync
                STATE=/opt/data/workspace/cluster-health
                mkdir -p "$STATE/archive" /opt/data/skills

                skill_name() {
                  sed -n '/^name:/{s/^name:[[:space:]]*//;p;q}' "$1" | tr -d "\"'"
                }

                for g in /etc/hermes-skills/*/SKILL.md; do
                  skill_name "$g"
                done > /tmp/git-skill-names
                find /opt/data/skills -path '*/.*' -prune -o -name SKILL.md -type f -print > /tmp/local-skills

                while IFS= read -r l; do
                  d="$(dirname "$l")"
                  [ "$d" = /opt/data/skills ] && continue
                  if grep -qxF "$(skill_name "$l")" /tmp/git-skill-names; then
                    for r in "$d"/references/*-triage.md; do
                      if [ -f "$r" ]; then
                        cp -n "$r" "$STATE/archive/$(basename "$r" .md).full.md" || true
                      fi
                    done
                    rm -rf "$d"
                  fi
                done < /tmp/local-skills

                for f in /run/seed/cluster-health/*.md; do
                  cp -nL "$f" "$STATE/$(basename "$f")" || true
                done

                # reclaim /opt/data for uid 1000 — .agents/references/hermes.md
                chown -R 1000:1000 /opt/data 2>/tmp/chown.err || true
                if grep -vE 'Permission denied|Operation not permitted' /tmp/chown.err; then exit 1; fi
                find /opt/data -user 1000 -type d -exec chmod 2775 {} +
                find /opt/data -user 1000 -type f -exec chmod 0664 {} +
                find /opt/data/skills -type f -name '*.sh' -exec chmod 0775 {} +

                # permissive cron perms survive a root-owned rewrite — hermes.md
                mkdir -p /opt/data/cron /opt/data/cron/output
                chmod 755 /opt/data/cron /opt/data/cron/output
                for f in jobs.json .jobs.lock .tick.lock ticker_heartbeat ticker_last_success; do
                  [ -e /opt/data/cron/$f ] && chmod 664 /opt/data/cron/$f || true
                done
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          install-tools:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:a39fc11620213e3669a327aff5c6cb1eb2b8a238c6044e33e7ef8885833d89a7
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /opt/data/.local/bin /opt/data/.local/go

                rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                if [ ! -f /opt/data/.local/bin/gh ]; then
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /opt/data/.local/go/bin/go ]; then
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /opt/data/.local/
                  rm -rf go.tar.gz
                fi

                if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                  export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:a39fc11620213e3669a327aff5c6cb1eb2b8a238c6044e33e7ef8885833d89a7
            args:
              - gateway
              - run
              - --no-supervise
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              GOPATH: /opt/data/go
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_CRON_TIMEOUT: "900"
              HOME: /opt/data
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: LITELLM_API_KEY
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: LITELLM_API_KEY
              OPENAI_BASE_URL: http://litellm.cortex.svc.cluster.local:4000/v1
              MEMINI_BASE_URL: http://memini.cortex.svc.cluster.local:8080
              MEMINI_HOME: personal/exikle
              MEMINI_NAMESPACE: homelab/hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: MEMINI_API_KEY
              FORGEJO_PAT:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: FORGEJO_PAT
              PATH: /opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              SEARXNG_URL: http://searxng.cortex.svc.cluster.local:8080
              SUMMARY_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: LITELLM_API_KEY
              SUMMARY_LLM_MODEL: opencode-go/mimo-v2.5
              SUMMARY_LLM_URL: http://litellm.cortex.svc.cluster.local:4000/v1
              TERM: xterm-256color
              TERMINAL_MAX_FOREGROUND_TIMEOUT: "1800"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.dcunha.io
              HERMES_DASHBOARD_OIDC_ISSUER: https://id.dcunha.io
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              GATEWAY_ALLOWED_USERS: exikle
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 1000
              runAsNonRoot: false
              runAsUser: 0
    externalSecrets:
      config:
        forceRename: hermes-config
        refreshInterval: 5m
        data:
          - secretKey: MEMINI_API_KEY
            remoteRef:
              key: memini
              property: MEMINI_API_KEY
        dataFrom:
          - extract:
              key: forgejo
          - extract:
              key: litellm
          - extract:
              key: hermes
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_OIDC_CLIENT_SECRET }}"
              MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
              API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
              FORGEJO_PAT: "{{ .DUSK_BOT_CLUSTER_TOKEN }}"
            templateFrom:
              - configMap:
                  name: hermes-configmap
                  items:
                    - key: env
    persistence:
      agent-source:
        type: emptyDir
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /agent-src
            install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
      config-yaml:
        type: configMap
        defaultMode: 0o755
        name: hermes-configmap
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
      skill-adhd-friendly-communication:
        type: configMap
        name: hermes-skill-adhd-friendly-communication
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/adhd-friendly-communication
                readOnly: true
            init:
              - path: /etc/hermes-skills/adhd-friendly-communication
                readOnly: true
      skill-artemis-cluster-ops:
        type: configMap
        name: hermes-skill-artemis-cluster-ops
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/artemis-cluster-ops
                readOnly: true
            init:
              - path: /etc/hermes-skills/artemis-cluster-ops
                readOnly: true
      skill-cluster-health:
        type: configMap
        items:
          - key: SKILL.md
            path: SKILL.md
          - key: node-baselines.md
            path: references/node-baselines.md
          - key: targetdown-check.sh
            mode: 0o755
            path: scripts/targetdown-check.sh
          - key: trim-triage-log.sh
            mode: 0o755
            path: scripts/trim-triage-log.sh
        name: hermes-skill-cluster-health
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/cluster-health
                readOnly: true
            init:
              - path: /etc/hermes-skills/cluster-health
                readOnly: true
      skill-forgejo-gitea-api:
        type: configMap
        name: hermes-skill-forgejo-gitea-api
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/forgejo-gitea-api
                readOnly: true
            init:
              - path: /etc/hermes-skills/forgejo-gitea-api
                readOnly: true
      skill-session-review:
        type: configMap
        name: hermes-skill-session-review
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/session-review
                readOnly: true
            init:
              - path: /etc/hermes-skills/session-review
                readOnly: true
      skill-skill-change-pr:
        type: configMap
        name: hermes-skill-skill-change-pr
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/skill-change-pr
                readOnly: true
            init:
              - path: /etc/hermes-skills/skill-change-pr
                readOnly: true
      cluster-health-seed:
        type: configMap
        name: hermes-cluster-health-seed
        advancedMounts:
          hermes:
            init:
              - path: /run/seed/cluster-health
                readOnly: true
      config:
        type: secret
        defaultMode: 0o400
        externalSecretRef: config
        advancedMounts:
          hermes:
            init:
              - path: /run/config/env
                subPath: env
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            init:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - pods/log
                - nodes
                - services
                - namespaces
                - configmaps
                - persistentvolumes
                - persistentvolumeclaims
                - endpoints
                - resourcequotas
                - limitranges
                - serviceaccounts
                - events
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "apps"
              resources:
                - deployments
                - daemonsets
                - statefulsets
                - replicasets
                - controllerrevisions
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "batch"
              resources:
                - "jobs"
                - "cronjobs"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "networking.k8s.io"
              resources:
                - "ingresses"
                - ingressclasses
                - networkpolicies
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "storage.k8s.io"
              resources:
                - storageclasses
                - csinodes
                - csidrivers
                - volumeattachments
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "helm.toolkit.fluxcd.io"
              resources:
                - "helmreleases"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "kustomize.toolkit.fluxcd.io"
              resources:
                - "kustomizations"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "source.toolkit.fluxcd.io"
              resources:
                - gitrepositories
                - helmrepositories
                - ocirepositories
                - buckets
                - helmcharts
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "external-secrets.io"
              resources:
                - externalsecrets
                - secretstores
                - clustersecretstores
              verbs:
                - "get"
                - "list"
                - "watch"
        hermes-pod-delete:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods"
              verbs:
                - "delete"
        hermes-exec-deploy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods/exec"
              verbs:
                - "create"
            - apiGroups:
                - "apps"
              resources:
                - "deployments"
              verbs:
                - "patch"
                - "update"
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-pod-delete:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-pod-delete
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-exec-deploy:
          type: RoleBinding
          roleRef:
            identifier: hermes-exec-deploy
          subjects:
            - identifier: hermes
              serviceAccount: hermes
              namespace: cortex
    route:
      app:
        hostnames:
          - hermes.dcunha.io
        parentRefs:
          - name: edge-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
    service:
      app:
        ipFamilies:
          - IPv4
        ports:
          dashboard:
            port: 9119
          gateway:
            port: 8642
    serviceAccount:
      hermes: {}
