---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  timeout: 15m
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        initContainers:
          chown-data:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                find /opt/data -path /opt/data/lost+found -prune -o \( ! -user 10000 -o ! -group 10000 \) -exec chown -h 10000:10000 {} +
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_READ_SEARCH
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/user.yaml /opt/data/config.yaml
                : > /opt/data/.env
                chmod 600 /opt/data/.env
                STATE=/opt/data/workspace/cluster-health
                mkdir -p "$STATE/archive" /opt/data/skills

                skill_name() {
                  sed -n '/^name:/{s/^name:[[:space:]]*//;p;q}' "$1" | tr -d "\"'"
                }

                for g in /etc/hermes-skills/*/SKILL.md; do
                  skill_name "$g"
                done > /tmp/git-skill-names
                find /opt/data/skills -path '*/.*' -prune -o -name SKILL.md -type f -print > /tmp/local-skills

                while IFS= read -r l; do
                  d="$(dirname "$l")"
                  [ "$d" = /opt/data/skills ] && continue
                  if grep -qxF "$(skill_name "$l")" /tmp/git-skill-names; then
                    for r in "$d"/references/*-triage.md; do
                      if [ -f "$r" ]; then
                        cp -n "$r" "$STATE/archive/$(basename "$r" .md).full.md" || true
                      fi
                    done
                    rm -rf "$d"
                  fi
                done < /tmp/local-skills

                for f in /run/seed/cluster-health/*.md; do
                  cp -nL "$f" "$STATE/$(basename "$f")" || true
                done
            dependsOn: chown-data
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          install-memini:
            image:
              repository: nousresearch/hermes-agent
              tag: v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
            command:
              - /bin/sh
              - -c
              - |
                set -e
                SHA=338800768d1b21f1ce1a2616b62b6c7cff3a76ee
                # no network when the installed plugin is already at the pinned SHA
                cur=$(git -C /opt/data/plugins/memini rev-parse HEAD 2>/dev/null || true)
                if [ "$cur" != "$SHA" ]; then
                  hermes plugins install eleboucher/memini-hermes --ref "$SHA" --force --yes-deps --no-enable
                fi
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
            args:
              - gateway
              - run
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: API_SERVER_KEY
              HERMES_HOME: /opt/data
              HERMES_CRON_TIMEOUT: "900"
              HOME: /opt/data
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: LITELLM_API_KEY
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: LITELLM_API_KEY
              OPENAI_BASE_URL: http://litellm.cortex.svc.cluster.local:4000/v1
              MEMINI_BASE_URL: http://memini.cortex.svc.cluster.local:8080
              MEMINI_HOME: personal/exikle
              MEMINI_NAMESPACE: homelab/hermes
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: MEMINI_API_KEY
              FORGEJO_PAT:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: FORGEJO_PAT
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              SEARXNG_URL: http://searxng.cortex.svc.cluster.local:8080
              TERM: xterm-256color
              TERMINAL_MAX_FOREGROUND_TIMEOUT: "1800"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.dcunha.io
              HERMES_DASHBOARD_OIDC_ISSUER: https://id.dcunha.io
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
              GATEWAY_ALLOWED_USERS: exikle
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      config:
        forceRename: hermes-config
        refreshInterval: 5m
        data:
          - secretKey: MEMINI_API_KEY
            remoteRef:
              key: memini
              property: MEMINI_API_KEY
        dataFrom:
          - extract:
              key: forgejo
          - extract:
              key: litellm
          - extract:
              key: hermes
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_OIDC_CLIENT_SECRET }}"
              MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
              API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
              FORGEJO_PAT: "{{ .DUSK_BOT_CLUSTER_TOKEN }}"
            templateFrom:
              - configMap:
                  name: hermes-configmap
                  items:
                    - key: env
    persistence:
      config-yaml:
        type: configMap
        name: hermes-configmap
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/config.yaml
                readOnly: true
                subPath: config.yaml
            init:
              - path: /run/config
                readOnly: true
      skill-adhd-friendly-communication:
        type: configMap
        name: hermes-skill-adhd-friendly-communication
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/adhd-friendly-communication
                readOnly: true
            init:
              - path: /etc/hermes-skills/adhd-friendly-communication
                readOnly: true
      skill-artemis-cluster-ops:
        type: configMap
        name: hermes-skill-artemis-cluster-ops
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/artemis-cluster-ops
                readOnly: true
            init:
              - path: /etc/hermes-skills/artemis-cluster-ops
                readOnly: true
      skill-cluster-health:
        type: configMap
        items:
          - key: SKILL.md
            path: SKILL.md
          - key: node-baselines.md
            path: references/node-baselines.md
          - key: targetdown-check.sh
            mode: 0o755
            path: scripts/targetdown-check.sh
          - key: trim-triage-log.sh
            mode: 0o755
            path: scripts/trim-triage-log.sh
        name: hermes-skill-cluster-health
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/cluster-health
                readOnly: true
            init:
              - path: /etc/hermes-skills/cluster-health
                readOnly: true
      skill-forgejo-gitea-api:
        type: configMap
        name: hermes-skill-forgejo-gitea-api
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/forgejo-gitea-api
                readOnly: true
            init:
              - path: /etc/hermes-skills/forgejo-gitea-api
                readOnly: true
      skill-session-review:
        type: configMap
        name: hermes-skill-session-review
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/session-review
                readOnly: true
            init:
              - path: /etc/hermes-skills/session-review
                readOnly: true
      skill-skill-change-pr:
        type: configMap
        name: hermes-skill-skill-change-pr
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes-skills/skill-change-pr
                readOnly: true
            init:
              - path: /etc/hermes-skills/skill-change-pr
                readOnly: true
      cluster-health-seed:
        type: configMap
        name: hermes-cluster-health-seed
        advancedMounts:
          hermes:
            init:
              - path: /run/seed/cluster-health
                readOnly: true
      config:
        type: secret
        defaultMode: 0o400
        externalSecretRef: config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/.env
                readOnly: true
                subPath: env
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            chown-data:
              - path: /opt/data
            init:
              - path: /opt/data
            install-memini:
              - path: /opt/data
            app:
              - path: /opt/data
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - hermes.dcunha.io
        parentRefs:
          - name: edge-gateway
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
    service:
      app:
        ipFamilies:
          - IPv4
        ports:
          dashboard:
            port: 9119
          gateway:
            port: 8642
    serviceAccount:
      hermes: {}
