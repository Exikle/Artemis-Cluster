---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: hermes
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
  callbackUrls:
    - "https://hermes.dcunha.io/auth/callback"
  clientID: hermes
  launchUrl: "https://hermes.dcunha.io/"
  logo:
    autoGenerate: false
  pkceEnabled: false
  secret:
    keys:
      clientID: HERMES_DASHBOARD_OIDC_CLIENT_ID
      clientSecret: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
    storeClientSecret: true
