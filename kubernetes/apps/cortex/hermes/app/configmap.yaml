---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    custom_providers:
      - name: litellm
        base_url: http://litellm.cortex.svc.cluster.local:4000/v1
        key_env: LITELLM_API_KEY
        models:
          opencode-go/deepseek-v4-flash:
            context_length: 131072
          opencode-go/minimax-m3:
            context_length: 1000000
          opencode-go/glm-5.2:
            context_length: 1048560
          opencode-go/mimo-v2.5:
            context_length: 262144
          opencode-go/qwen3.6-plus:
            context_length: 262144
          opencode-go/qwen3.7-max:
            context_length: 262144
          opencode-go/kimi-k2.6:
            context_length: 262128
          opencode-go/kimi-k2.7-code:
            context_length: 262128
    model:
      default: opencode-go/minimax-m3
      provider: custom:litellm
      context_length: 1000000
    model_aliases:
      dsv4f:
        model: opencode-go/deepseek-v4-flash
        provider: custom:litellm
      qwen:
        model: opencode-go/qwen3.6-plus
        provider: custom:litellm
      qwenmax:
        model: opencode-go/qwen3.7-max
        provider: custom:litellm
      minimax:
        model: opencode-go/minimax-m3
        provider: custom:litellm
      glm:
        model: opencode-go/glm-5.2
        provider: custom:litellm
      mimo:
        model: opencode-go/mimo-v2.5
        provider: custom:litellm
      kimi:
        model: opencode-go/kimi-k2.6
        provider: custom:litellm
      kimicode:
        model: opencode-go/kimi-k2.7-code
        provider: custom:litellm
    fallback_providers:
      - provider: custom:litellm
        model: opencode-go/glm-5.2
      - provider: custom:litellm
        model: opencode-go/mimo-v2.5
    auxiliary:
      approval:
        provider: custom:litellm
        model: opencode-go/minimax-m3
        timeout: 60
      compression:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      web_extract:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      session_search:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      vision:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      goal_judge:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      title_generation:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      profile_describer:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      triage_specifier:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      kanban_decomposer:
        provider: custom:litellm
        model: opencode-go/minimax-m3
      curator:
        provider: custom:litellm
        model: opencode-go/minimax-m3
        timeout: 600
    memory:
      provider: memini
    plugins:
      enabled:
        - memini
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 900
      lifetime_seconds: 1800
      persistent_shell: true
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    streaming:
      enabled: false
    approvals:
      mode: smart
      timeout: 60
      cron_mode: approve
      smart_policy: |
        This agent runs unattended cron jobs against a homelab Kubernetes
        cluster (Artemis) and a self-hosted Forgejo at git.dcunha.io.

        APPROVE these — they are the agent's normal working shapes:
          - curl to git.dcunha.io/api/v1/repos/exikle/* to read contents,
            create a branch, PUT a file, and open a pull request
          - curl to chaski.observability.svc.cluster.local for notifications
          - read-only curl to vmsingle/vmalert/alertmanager in observability
          - reads and writes under /opt/data/workspace and /opt/data/skills
          - base64, sha256sum, diff, grep, sed, awk, and JSON already saved
            to disk piped into python3 for parsing

        ESCALATE anything that:
          - reads or writes a Kubernetes Secret, /opt/data/.env, or any
            credential other than $FORGEJO_PAT in an Authorization header
          - targets Talos, node-level state, or the control plane
          - merges a pull request, rewrites history, or writes to main
          - deletes or scales a workload outside the auto-fix classes the
            running skill documents
          - reaches a host outside the cluster or git.dcunha.io
      deny:
        - "*api/v1/repos/*/pulls/*/merge*"
        - "*git push*--force*"
        - "*git push*origin*main*"
        - "*talosctl*"
        - "*kubectl*drain*"
        - "*kubectl*cordon*"
        - "*kubectl*delete*"
        - "*flux*uninstall*"
        - "*flux*delete*"
        - "*helm*uninstall*"
        - "*ceph*osd*"
        - "*kubectl*get*secret*"
        - "*/opt/data/.env*"
        - "*curl*|*sh*"
        - "*wget*|*sh*"
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - "169.254.169.254"
          - "metadata.google.internal"
    privacy:
      redact_pii: true
    agent:
      max_turns: 150
      gateway_timeout: 1800
      gateway_timeout_warning: 900
      restart_drain_timeout: 60
      api_max_retries: 3
      reasoning_effort: medium
    delegation:
      model: opencode-go/minimax-m3
      max_concurrent_children: 8
      max_spawn_depth: 2
    moa:
      default_preset: council
      presets:
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: opencode-go/minimax-m3
            - provider: custom:litellm
              model: opencode-go/glm-5.2
            - provider: custom:litellm
              model: opencode-go/mimo-v2.5
          aggregator:
            provider: custom:litellm
            model: opencode-go/minimax-m3
          reference_temperature: 0.6
          aggregator_temperature: 0.4
          max_tokens: 8192
    platforms:
      matrix:
        enabled: false
    matrix:
      require_mention: false
      auto_thread: false
      dm_mention_threads: false
    display:
      platforms:
        matrix:
          tool_progress: "off"
    mcp_servers:
      ops:
        url: http://litellm.cortex.svc.cluster.local:4000/ops/mcp
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
      general:
        url: http://litellm.cortex.svc.cluster.local:4000/general/mcp
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
    web:
      search_backend: searxng
  env: |-
    LITELLM_API_KEY={{ .MASTER_KEY }}
    OPENAI_API_KEY={{ .MASTER_KEY }}
    OPENAI_BASE_URL=http://litellm.cortex.svc.cluster.local:4000/v1
    SUMMARY_LLM_API_KEY={{ .MASTER_KEY }}
    API_SERVER_KEY={{ .API_SERVER_KEY }}
