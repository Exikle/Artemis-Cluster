---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litellm-operator-manager-role-extra
rules:
  - apiGroups: ["litellm.home-operations.com"]
    resources: ["litellmteams", "litellmvirtualkeys"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["litellm.home-operations.com"]
    resources: ["litellmteams/status", "litellmvirtualkeys/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["litellm.home-operations.com"]
    resources: ["litellmteams/finalizers", "litellmvirtualkeys/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-operator-manager-rolebinding-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-operator-manager-role-extra
subjects:
  - kind: ServiceAccount
    name: litellm-operator
    namespace: cortex
