---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
  annotations:
    postgres.dcunha.io/skip-patch: "prisma-needs-its-own-dsn"
spec:
  image: ghcr.io/berriai/litellm:v1.99.1@sha256:a53a7d3ffebede1925bd3ee8a21e4a7b9b63e2e68ec883af136edcccb6eeb82c
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  callbacks:
    callbacks:
      - prometheus
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-postgres
          key: url_prisma
    - name: REDIS_HOST
      value: dragonfly.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
  generalSettings:
    database_url: os.environ/DATABASE_URL
  volumeMounts:
    - name: postgres-server-ca
      mountPath: /var/run/secrets/postgres-server-ca
      readOnly: true
  volumes:
    - name: postgres-server-ca
      secret:
        secretName: postgres-server-ca
        defaultMode: 0440
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 60
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 2Gi
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
  service:
    type: ClusterIP
    port: 4000
