---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: litellm
  namespace: cortex
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: litellm-mcp
  cors:
    allowOrigins:
      - "*"
    allowMethods:
      - DELETE
      - GET
      - POST
      - OPTIONS
    allowHeaders:
      - Accept
      - Content-Type
      - Last-Event-ID
      - Mcp-Protocol-Version
      - Mcp-Session-Id
    exposeHeaders:
      - Mcp-Session-Id
