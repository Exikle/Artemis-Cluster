---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
# litellm — single MCP aggregator for all tiers (general/media/ops), separated via
# each LiteLLMMCPServer's access_groups + URL-based namespacing (/<group>/mcp),
# not separate proxy processes. See /home/exikle/.claude/plans/effervescent-cooking-hoare.md
# for why: bjw-s (our only working reference) runs one proxy; our prior 3-tier
# ToolHive split was never NetworkPolicy-enforced anyway, just client-side config
# hygiene, so one proxy doesn't weaken that.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.96.0@sha256:90d8de0ea6fbb3cad145d1019d00a0149ae400b1e18e2011a60f1988f143f672
  env:
    - name: REDIS_HOST
      value: dragonfly.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 60
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 2Gi
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
  service:
    type: ClusterIP
    port: 4000
