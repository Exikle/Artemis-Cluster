---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-ha
spec:
  alias: ha
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    command:
      - ha-mcp-web
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-automation.svc.cluster.local:8123
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: ha-mcp
            key: HA_TOKEN
      - name: ENABLE_TOOL_SEARCH
        value: "true"
    image: ghcr.io/homeassistant-ai/ha-mcp:latest@sha256:ff80e07eeb4652a22e781c12883204888b8bce0a95b4b875fa7e74c6b0f32767
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8086
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir:
          medium: Memory
        name: tmp
