---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-github
spec:
  alias: github
  authTokenRef:
    name: github-mcp
    key: GITHUB_PERSONAL_ACCESS_TOKEN
  authType: bearer_token
  params:
    access_groups: ["ops"]
    allow_all_keys: true
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    args:
      - --port
      - "8080"
      - http
    env:
      - name: GITHUB_API_URL
        value: https://api.github.com
      - name: LOG_LEVEL
        value: info
      - name: GITHUB_READ_ONLY
        value: "true"
    envFrom:
      - secretRef:
          name: github-mcp
    image: ghcr.io/github/github-mcp-server:v1.11.0@sha256:fbec75de11c255213fa08d80fb166abe73d851fff631c51c0079872967720699
    path: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
