---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-seerr
spec:
  alias: seerr
  params:
    access_groups: ["media"]
    allow_all_keys: true
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    command:
      - npx
      - -y
      - "@jhomen368/overseerr-mcp@2.3.0"
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp
      - name: HTTP_MODE
        value: "true"
      - name: PORT
        value: "8085"
      - name: SEERR_URL
        value: http://seerr.media.svc.cluster.local
    envFrom:
      - secretRef:
          name: seerr-mcp
    image: node:24.21.0-alpine@sha256:be80f76cf40ec8e42b9bec49f60a55e0660f30af58d3e5a25530785b30ea67e2
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8085
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
