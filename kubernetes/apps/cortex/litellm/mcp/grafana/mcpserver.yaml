---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-grafana
spec:
  alias: grafana
  params:
    access_groups: ["general"]
    allow_all_keys: true
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    args:
      - -t
      - streamable-http
      - -address
      - 0.0.0.0:8000
      - -allowed-hosts
      - mcp-grafana:8000,mcp-grafana.cortex:8000,mcp-grafana.cortex.svc:8000,mcp-grafana.cortex.svc.cluster.local:8000
      - -disable-write
      - -disable-agento11y
      - -disable-asserts
      - -disable-assistant
      - -disable-athena
      - -disable-clickhouse
      - -disable-cloudwatch
      - -disable-elasticsearch
      - -disable-graphite
      - -disable-incident
      - -disable-influxdb
      - -disable-oncall
      - -disable-pyroscope
      - -disable-quickwit
      - -disable-sift
      - -disable-snowflake
    env:
      - name: GRAFANA_URL
        value: http://grafana-service.observability.svc.cluster.local:3000
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: grafana-mcp
            key: GRAFANA_SERVICE_ACCOUNT_TOKEN
    image: docker.io/grafana/mcp-grafana:1.4.1@sha256:cfcf06863c23b2db64c41b0379d1efe95703aca4ba5434d90674f72ec0b7d810
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
