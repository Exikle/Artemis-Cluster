---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/aplaceforallmystuff/mcp-arr
# Runs the official GHCR image, not npx: npm publishing is a manual, separate
# step there and lags the tag-triggered GHCR pipeline badly — 1.6.1 (added
# MCP_TRANSPORT=http) through 1.7.2 (fixed a gateway/proxy deadlock in that
# same transport, exactly the failure mode litellm's own gateway would hit)
# were never published to npm; npm's actual latest is still 1.6.5.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-arr
spec:
  alias: arr
  params:
    access_groups: ["media"]
  proxyRef: litellm
  transport: http
  workload:
    env:
      - name: MCP_TRANSPORT
        value: http
      - name: HOST
        value: 0.0.0.0
      - name: PORT
        value: "3000"
      - name: SONARR_URL
        value: http://sonarr.media.svc.cluster.local
      - name: RADARR_URL
        value: http://radarr.media.svc.cluster.local
      - name: PROWLARR_URL
        value: http://prowlarr.media.svc.cluster.local
    envFrom:
      - secretRef:
          name: arr-mcp
    image: ghcr.io/aplaceforallmystuff/mcp-arr:1.7.3
    port: 3000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
