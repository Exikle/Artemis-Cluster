---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-arr
spec:
  alias: arr
  params:
    access_groups: ["media"]
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    env:
      - name: MCP_TRANSPORT
        value: http
      - name: HOST
        value: 0.0.0.0
      - name: PORT
        value: "3000"
      - name: SONARR_URL
        value: http://sonarr.media.svc.cluster.local
      - name: RADARR_URL
        value: http://radarr.media.svc.cluster.local
      - name: PROWLARR_URL
        value: http://prowlarr.media.svc.cluster.local
    envFrom:
      - secretRef:
          name: arr-mcp
    image: ghcr.io/aplaceforallmystuff/mcp-arr:1.7.3@sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 3000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
