---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-forgejo
spec:
  alias: forgejo
  params:
    access_groups: ["ops"]
    allow_all_keys: true
    allowed_tools:
      - add_issue_labels
      - create_branch
      - create_issue
      - create_issue_comment
      - create_label
      - create_pr_review
      - create_pull_request
      - edit_issue
      - edit_issue_comment
      - edit_pull_request
      - get_authenticated_user
      - get_branch
      - get_file_contents
      - get_issue
      - get_label
      - get_milestone
      - get_pr_diff
      - get_pull_request
      - get_repo
      - get_server_version
      - list_action_runners_jobs
      - list_branches
      - list_issue_comments
      - list_issues
      - list_labels
      - list_milestones
      - list_pr_commits
      - list_pr_files
      - list_pr_reviews
      - list_pull_requests
      - list_releases
      - list_repo_commits
      - list_tags
      - merge_pull_request
      - remove_issue_label
      - search_repos
      - update_pr_branch
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    command:
      - sh
      - -c
      - >-
        npm install --no-save --prefix /tmp/app @ric_/forgejo-mcp@0.1.7 &&
        cp /patch/http-fixed.mjs /tmp/app/http-fixed.mjs &&
        exec node /tmp/app/http-fixed.mjs --port 8080
    env:
      - name: FORGEJO_URL
        value: https://git.dcunha.io
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp
    envFrom:
      - secretRef:
          name: forgejo-mcp
    image: node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
      - mountPath: /patch
        name: patch
        readOnly: true
    volumes:
      - emptyDir: {}
        name: tmp
      - configMap:
          name: forgejo-mcp-configmap
        name: patch
