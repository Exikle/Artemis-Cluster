---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-forgejo
spec:
  alias: forgejo
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    command:
      - sh
      - -c
      - >-
        npm install --no-save --prefix /tmp/app @ric_/forgejo-mcp@0.1.7 &&
        cp /patch/http-fixed.mjs /tmp/app/http-fixed.mjs &&
        exec node /tmp/app/http-fixed.mjs --port 8080
    env:
      - name: FORGEJO_URL
        value: https://git.dcunha.io
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp
    envFrom:
      - secretRef:
          name: forgejo-mcp
    image: node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp
      - mountPath: /patch
        name: patch
        readOnly: true
    volumes:
      - emptyDir: {}
        name: tmp
      - configMap:
          name: forgejo-mcp-configmap
        name: patch
