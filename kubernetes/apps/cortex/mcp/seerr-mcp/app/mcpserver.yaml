---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://www.npmjs.com/package/@jhomen368/overseerr-mcp — pinned to
# the current latest (was unpinned under ToolHive) since litellm-operator has
# no proxy layer to absorb an unexpected upstream regression.
# Note: env var is SEERR_URL — NOT SEERR_HOST (silently breaks)
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-seerr
spec:
  alias: seerr
  params:
    access_groups: ["media"]
  proxyRef: litellm
  transport: http
  workload:
    command:
      - npx
      - "-y"
      - "@jhomen368/overseerr-mcp@2.2.0"
    env:
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp
      - name: HTTP_MODE
        value: "true"
      - name: PORT
        value: "8085"
      - name: SEERR_URL
        value: http://seerr.media.svc.cluster.local
    envFrom:
      - secretRef:
          name: seerr-mcp
    image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    port: 8085
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
