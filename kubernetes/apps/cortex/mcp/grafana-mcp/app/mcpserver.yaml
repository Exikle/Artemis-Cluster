---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/grafana/mcp-grafana (official Grafana MCP server)
# Default transport is stdio — needs explicit -t streamable-http to serve at /mcp.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-grafana
spec:
  alias: grafana
  params:
    access_groups: ["general"]
  proxyRef: litellm
  transport: http
  workload:
    args:
      - -t
      - streamable-http
      - -address
      - 0.0.0.0:8000
    env:
      - name: GRAFANA_URL
        value: http://grafana-service.observability.svc.cluster.local:3000
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: grafana-mcp
            key: GRAFANA_SERVICE_ACCOUNT_TOKEN
    image: docker.io/grafana/mcp-grafana:1.1.0@sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
