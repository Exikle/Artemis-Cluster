---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/containers/kubernetes-mcp-server
# Auth: in-cluster ServiceAccount (mcp-k8s-sa, see serviceaccount.yaml) — auto-detects SA at runtime
# ClusterRole mcp-k8s grants read + patch/update on workloads + read on Flux/Ceph/CNPG CRDs
# --port starts Streamable HTTP at /mcp and SSE at /sse simultaneously
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-k8s
spec:
  alias: k8s
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    args:
      - --disable-multi-cluster
      - --port
      - "8080"
    image: quay.io/containers/kubernetes_mcp_server:v0.0.63@sha256:9317449ed47916a297f71b955eab57402064de852bf1fb007c4e0705754de2b3
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    serviceAccountName: mcp-k8s-sa
