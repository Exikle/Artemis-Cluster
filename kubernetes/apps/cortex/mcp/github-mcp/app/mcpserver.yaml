---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/github/github-mcp-server (official GitHub MCP server)
# `http` subcommand serves Streamable HTTP at the server root ("/"), not "/mcp" —
# path override required, confirmed against docs/streamable-http.md and the hosted
# api.githubcopilot.com/mcp/ toolset URL convention (both root-based).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-github
spec:
  alias: github
  authTokenRef:
    name: github-mcp
    key: GITHUB_PERSONAL_ACCESS_TOKEN
  authType: bearer_token
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    args:
      - --port
      - "8080"
      - http
    env:
      - name: GITHUB_API_URL
        value: https://api.github.com
      - name: LOG_LEVEL
        value: info
    envFrom:
      - secretRef:
          name: github-mcp
    image: ghcr.io/github/github-mcp-server:v1.10.1@sha256:1817b57d43916532dc002bdc5f344d639bd9fb54a9148d42168458f7c3280567
    path: ""
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
