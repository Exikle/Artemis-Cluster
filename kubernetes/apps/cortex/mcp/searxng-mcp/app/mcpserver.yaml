---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/ihor-sokoliuk/mcp-searxng
# MCP_HTTP_HOST must be 0.0.0.0 — defaults to 127.0.0.1-only, which is unreachable
# from the litellm proxy pod.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-searxng
spec:
  alias: searxng
  params:
    access_groups: ["general"]
  proxyRef: litellm
  transport: http
  workload:
    env:
      - name: MCP_HTTP_PORT
        value: "8080"
      - name: MCP_HTTP_HOST
        value: 0.0.0.0
      - name: SEARXNG_URL
        value: http://searxng.cortex.svc.cluster.local:8080
    image: docker.io/isokoliuk/mcp-searxng:1.11.1@sha256:b6727fc950cf1a7501d70f863b563d9fc689d6e33c773296ed845070c5646b48
    port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
