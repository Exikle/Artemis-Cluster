---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/VictoriaMetrics/mcp-victorialogs (official VictoriaLogs MCP server)
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: victoria-logs-mcp
spec:
  alias: victoria_logs
  params:
    access_groups: ["general"]
  proxyRef: litellm
  transport: http
  workload:
    env:
      - name: MCP_SERVER_MODE
        value: http
      - name: MCP_LISTEN_ADDR
        value: :8081
      - name: MCP_LOG_FORMAT
        value: json
      - name: MCP_LOG_LEVEL
        value: info
      - name: VL_INSTANCE_ENTRYPOINT
        value: http://victoria-logs-server.observability.svc.cluster.local:9428
    image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
    port: 8081
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
