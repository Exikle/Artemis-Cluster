---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://code.squarecows.com/SquareCows/forgejo-mcp
# Package: @ric_/forgejo-mcp@0.1.5 (npm) declares two bin entries in the same package —
# forgejo-mcp (stdio, dist/index.js) and forgejo-mcp-http (dist/http.js). There is no
# separate "@ric_/forgejo-mcp-http" package (a since-fixed README error pointed there —
# confirmed 404 on the npm registry). Must invoke via `npx -p <pkg> <bin>` since the bin
# name differs from the package name. Endpoint: /mcp.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-forgejo
spec:
  alias: forgejo
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    command:
      - npx
      - "-y"
      - "-p"
      - "@ric_/forgejo-mcp@0.1.5"
      - forgejo-mcp-http
      - --port
      - "8080"
    env:
      - name: FORGEJO_URL
        value: https://git.dcunha.io
      - name: HOME
        value: /tmp
      - name: NPM_CONFIG_CACHE
        value: /tmp
    envFrom:
      - secretRef:
          name: forgejo-mcp
    image: node:24.20.0-alpine@sha256:229ca4bf7cc64a8c41ad43c2782745cb46c0c07dfdf90636c002f8825586a3fc
    port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir: {}
        name: tmp
