---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://github.com/homeassistant-ai/ha-mcp
# Default image CMD speaks stdio only; ha-mcp-web is the project's dedicated HTTP
# entrypoint (fastmcp-http.json: transport http, 0.0.0.0:8086, path /mcp) — confirmed
# against bjw-s-labs/home-ops's litellm-operator adoption of this same server.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-ha
spec:
  alias: ha
  params:
    access_groups: ["ops"]
  proxyRef: litellm
  transport: http
  workload:
    command:
      - ha-mcp-web
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-automation.svc.cluster.local:8123
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: ha-mcp
            key: HA_TOKEN
    image: ghcr.io/homeassistant-ai/ha-mcp:latest@sha256:198fa1567c6661d3b4b20cff10dfaf0c6ddecd2c4dbf13828df2a1ce23eac2fd
    port: 8086
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    volumeMounts:
      - mountPath: /tmp
        name: tmp
    volumes:
      - emptyDir:
          medium: Memory
        name: tmp
