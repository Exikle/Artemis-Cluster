---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-seerr
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-seerr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      automountServiceAccountToken: false
    controllers:
      mcp-seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.dcunha.io/exikle/seerr-mcp
              tag: 0.3.2@sha256:4f7ee70a612bb07baaa3f3c09f9ea7ca6de7450e198cd95fbc6f58dd81318066
            env:
              ALLOWED_ORIGINS: "*"
              SEERR_URL: http://seerr.media.svc.cluster.local
            envFrom:
              - secretRef:
                  name: seerr-mcp
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8085
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 2
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 2
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 2
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      app:
        forceRename: seerr-mcp
        dataFrom:
          - extract:
              key: seerr
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: 8081
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics
            interval: 60s
            scrapeTimeout: 15s
