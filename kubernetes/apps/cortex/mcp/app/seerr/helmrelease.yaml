---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-seerr
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-seerr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
    controllers:
      mcp-seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: node
              tag: 24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
            command:
              - npx
              - -y
              - "@jhomen368/overseerr-mcp@2.3.1"
            env:
              HOME: /tmp
              NPM_CONFIG_CACHE: /tmp
              HTTP_MODE: "true"
              PORT: "8085"
              SEERR_URL: http://seerr.media.svc.cluster.local
            envFrom:
              - secretRef:
                  name: seerr-mcp
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      app:
        forceRename: seerr-mcp
        dataFrom:
          - extract:
              key: seerr
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: 8085
