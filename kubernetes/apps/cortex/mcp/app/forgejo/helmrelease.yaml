---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-forgejo
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
    controllers:
      mcp-forgejo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: git.dcunha.io/exikle/forgejo-mcp
              tag: 0.3.1@sha256:30e6ce0182e5fde60f353730d766b275f27c487eb70685ec641c09e2230b14de
            env:
              FORGEJO_DISABLED_AREAS: actions,organizations,packages,repo-settings
              FORGEJO_URL: https://git.dcunha.io
              PORT: "8080"
              RATE_LIMIT_MAX: "6000"
            envFrom:
              - secretRef:
                  name: forgejo-mcp
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 2
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 2
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      app:
        forceRename: forgejo-mcp
        dataFrom:
          - extract:
              key: forgejo
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              FORGEJO_MCP_API_KEY: "{{ .FORGEJO_MCP_API_KEY }}"
              FORGEJO_TOKEN: "{{ .DUSK_BOT_CLUSTER_TOKEN }}"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
