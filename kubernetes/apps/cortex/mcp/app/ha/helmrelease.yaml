---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-ha
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-ha
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
    controllers:
      mcp-ha:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 8.7.0@sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448
            command:
              - ha-mcp-web
            env:
              HOMEASSISTANT_URL: http://home-assistant.home-automation.svc.cluster.local:8123
              HOMEASSISTANT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ha-mcp
                    key: HA_TOKEN
              ENABLE_TOOL_SEARCH: "true"
              HA_MCP_DISABLE_SETTINGS_UI: "true"
              MCP_HEALTHZ: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8086
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 2
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 2
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    externalSecrets:
      app:
        forceRename: ha-mcp
        dataFrom:
          - extract:
              key: home-assistant
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HA_TOKEN: "{{ .HA_TOKEN }}"
    persistence:
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
