---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Source: https://mcp.context7.com — hosted HTTP endpoint, no container needed
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-context7
spec:
  alias: context7
  authTokenRef:
    name: context7-mcp
    key: api_key
  authType: bearer_token
  params:
    access_groups: ["general"]
  proxyRef: litellm
  transport: http
  url: https://mcp.context7.com/mcp
