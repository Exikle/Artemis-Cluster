---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp
spec:
  parentRefs:
    - name: agentgateway
      sectionName: http
  rules:
    - name: ops
      matches:
        - path:
            type: PathPrefix
            value: /ops/mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-ops
    - name: general
      matches:
        - path:
            type: PathPrefix
            value: /general/mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-general
    - name: agent
      matches:
        - path:
            type: PathPrefix
            value: /agent/mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-agent
