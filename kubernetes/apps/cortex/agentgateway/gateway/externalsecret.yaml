---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretname agentgateway-opencode
spec:
  dataFrom:
    - extract:
        key: agentgateway
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *secretname
    template:
      data:
        Authorization: "{{ .OPENCODE_GO_API_KEY }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretname agentgateway-key-ops
spec:
  dataFrom:
    - extract:
        key: agentgateway
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *secretname
    template:
      metadata:
        labels:
          ai.dcunha.io/apikey: "true"
      data:
        ops: '{"key":"{{ .KEY_OPS }}","metadata":{"user_id":"ops"}}'
