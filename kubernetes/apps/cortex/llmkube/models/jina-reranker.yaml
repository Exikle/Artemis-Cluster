---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: jina-reranker
spec:
  format: gguf
  hardware:
    accelerator: cpu
  quantization: FP16
  source: https://huggingface.co/gpustack/jina-reranker-v1-tiny-en-GGUF/resolve/main/jina-reranker-v1-tiny-en-FP16.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: jina-reranker
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ymir
  batchSize: 4096
  contextSize: 4096
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - jina-reranker
    - --metrics
  image: ghcr.io/ggml-org/llama.cpp:server-b11870@sha256:1fa7f8f0ca663fdcf3203dc125a7e0b5c9e49c9ed054b049599666cd7e300eb0
  mode: rerank
  modelCache:
    persistence: Ephemeral
  modelRef: jina-reranker
  nodeSelector:
    kubernetes.io/hostname: ymir
  parallelSlots: 2
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
  replicas: 1
  resources:
    cpu: "1"
    ephemeralStorage: 2Gi
    memory: 1Gi
  runtime: llamacpp
  uBatchSize: 2048
