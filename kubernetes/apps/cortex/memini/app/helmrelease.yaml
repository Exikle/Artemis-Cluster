---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 30m
  values:
    fullnameOverride: memini
    controllers:
      main:
        type: deployment
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: postgres
              MEMINI_DEDUP_INTERVAL: 168h
              MEMINI_DEDUP_LLM_MERGE: "true"
              MEMINI_DEFAULT_NAMESPACE: homelab
              MEMINI_DEMOTE_AFTER: "0"
              MEMINI_EMBED_BASE_URL: http://qwen3-embedding.cortex.svc.cluster.local:8080/v1
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_BATCH: "4"
              MEMINI_EMBED_MAX_BATCH_CHARS: "1000"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_EMBED_MODEL: qwen3-embedding
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_LLM_API_KEY
              MEMINI_LLM_BASE_URL: http://litellm.cortex.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: opencode-go/deepseek-v4-flash
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  configMapKeyRef:
                    name: memini-postgres
                    key: url
              MEMINI_RECALL_EMBED_TIMEOUT: "20s"
              MEMINI_RERANK: http://jina-reranker.cortex.svc.cluster.local:8080/v1
              MEMINI_RERANK_MAX_BATCH_CHARS: "120000"
              MEMINI_RERANK_MAX_DOC_CHARS: "1800"
              MEMINI_RERANK_MODEL: jina-reranker
              MEMINI_RERANK_POOL: "25"
              MEMINI_RERANK_TIMEOUT: "20s"
              MEMINI_SPLIT_DEDUP_LLM_MERGE: "true"
              MEMINI_TOMBSTONE_TTL: 720h
              MEMINI_WRITE_EMBED_TIMEOUT: "20s"
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    grafanaDashboards:
      enabled: true
    persistence:
      data:
        enabled: false
    route:
      internal:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://memini.dcunha.io/healthz
            conditions: ["[STATUS] == 200"]
        parentRefs:
          - name: internal-gateway
            namespace: network
        hostnames:
          - memini.dcunha.io
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
              - path:
                  type: PathPrefix
                  value: /v1
              - path:
                  type: PathPrefix
                  value: /healthz
              - path:
                  type: PathPrefix
                  value: /readyz
            backendRefs:
              - identifier: main
                port: 8080
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 8081
    serviceMonitor:
      main:
        enabled: true
