---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  values:
    container_runtime: containerd
    image:
      repository: docker.io/crowdsecurity/crowdsec
      tag: v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    config:
      parsers:
        s02-enrich:
          edge-whitelist.yaml: |
            name: artemis/edge-whitelist
            description: Frostlink's own public IP, which probes edge-gateway through towonel
            whitelist:
              reason: frostlink relay and probes
              ip:
                - 40.233.88.33
      simulation.yaml: |
        simulation: true
      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "127.0.0.1/32"
                - "10.0.0.0/8"
        db_config:
          use_wal: true
          flush:
            max_age: 7d
            agents_autodelete:
              login_password: 1d
    lapi:
      deployAnnotations:
        reloader.stakater.com/auto: "true"
      envFrom:
        - secretRef:
            name: crowdsec
      metrics:
        serviceMonitor:
          enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    agent:
      acquisition:
        - namespace: network
          podName: edge-gateway-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy crowdsecurity/base-http-scenarios
        - name: PARSERS
          value: crowdsecurity/cri-logs crowdsecurity/whitelists
      metrics:
        serviceMonitor:
          enabled: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          appsec_configs:
            - artemis/appsec-bot-challenge
            - crowdsecurity/appsec-bot-challenge-exclude-ai-crawlers
            - crowdsecurity/appsec-bot-challenge-exclude-api
            - crowdsecurity/appsec-bot-challenge-exclude-crawler-files
            - crowdsecurity/appsec-bot-challenge-exclude-feeds
            - crowdsecurity/appsec-bot-challenge-exclude-google-ads
            - crowdsecurity/appsec-bot-challenge-exclude-monitoring
            - crowdsecurity/appsec-bot-challenge-exclude-search-engines
            - crowdsecurity/appsec-bot-challenge-exclude-social
            - crowdsecurity/appsec-bot-challenge-exclude-static
            - crowdsecurity/appsec-bot-challenge-exclude-webhooks
            - crowdsecurity/appsec-bot-challenge-exclude-wikimedia-citation
            - crowdsecurity/appsec-bot-challenge-scoring
            - crowdsecurity/appsec-bot-challenge-scoring-balanced
          labels:
            type: appsec
      configs:
        artemis-bot-challenge.yaml: |
          name: artemis/appsec-bot-challenge
          inband:
            pre_eval:
              - filter: req.Host != "git.dcunha.io" && req.Host != "jelu.dcunha.io"
                apply:
                  - ExemptFromChallenge("unprotected-host")
              - filter: req.RemoteAddr startsWith "10." || req.RemoteAddr startsWith "40.233.88.33"
                apply:
                  - ExemptFromChallenge("lan-or-frostlink")
              - filter: req.UserAgent() startsWith "Gatus/"
                apply:
                  - ExemptFromChallenge("gatus")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path endsWith "/info/refs" || req.URL.Path endsWith "/git-upload-pack" || req.URL.Path endsWith "/git-receive-pack" || req.URL.Path contains "/info/lfs/")
                apply:
                  - ExemptFromChallenge("forgejo-git-transport")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path startsWith "/api/" || req.URL.Path startsWith "/v2/" || req.URL.Path == "/v2" || req.URL.Path == "/swagger.v1.json")
                apply:
                  - ExemptFromChallenge("forgejo-api")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path contains "/raw/" || req.URL.Path contains "/archive/" || req.URL.Path contains "/releases/download/" || req.URL.Path contains "/media/" || req.URL.Path contains "/attachments/")
                apply:
                  - ExemptFromChallenge("forgejo-files")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path startsWith "/user/login" || req.URL.Path startsWith "/user/oauth2/" || req.URL.Path startsWith "/login/oauth/")
                apply:
                  - ExemptFromChallenge("forgejo-login")
              - filter: req.Host == "git.dcunha.io" && (req.URL.Path startsWith "/assets/" || req.URL.Path startsWith "/avatars/" || req.URL.Path startsWith "/repo-avatars/" || req.URL.Path startsWith "/user/avatar/")
                apply:
                  - ExemptFromChallenge("forgejo-static")
              - filter: req.Host == "git.dcunha.io" && req.URL.RawQuery contains "go-get=1"
                apply:
                  - ExemptFromChallenge("forgejo-go-get")
              - filter: req.Host == "jelu.dcunha.io" && (req.URL.Path startsWith "/api/" || req.URL.Path startsWith "/oauth2/" || req.URL.Path startsWith "/login/oauth2/code/" || req.URL.Path startsWith "/assets/" || req.URL.Path startsWith "/files/" || req.URL.Path startsWith "/v3/api-docs" || req.URL.Path startsWith "/swagger-ui" || req.URL.Path startsWith "/favicon" || req.URL.Path startsWith "/apple-touch-icon" || req.URL.Path startsWith "/android-chrome-" || req.URL.Path startsWith "/mstile-" || req.URL.Path in ["/sw.js", "/registerSW.js", "/manifest.webmanifest", "/manifest.json", "/site.webmanifest"])
                apply:
                  - ExemptFromChallenge("jelu-machine-routes")
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-bot-challenge
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        seccompProfile:
          type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-appsec
            patch: |-
              - op: replace
                path: /spec/template/spec/initContainers/0/resources/limits/memory
                value: 256Mi
          - target:
              kind: ServiceMonitor
              name: crowdsec-service
            patch: |-
              - op: add
                path: /spec/endpoints/0/honorLabels
                value: true
