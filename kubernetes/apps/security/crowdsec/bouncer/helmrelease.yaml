---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  interval: 1h
  values:
    config:
      bouncer:
        apiKeySecretRef:
          key: BOUNCER_KEY_ENVOY
          name: crowdsec
        lapiURL: http://crowdsec-service.security.svc.cluster.local:8080
      exemptIPs:
        - 10.0.0.0/8
        - 40.233.88.33/32
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    fullnameOverride: crowdsec-bouncer
    image:
      repository: ghcr.io/kdwils/envoy-proxy-bouncer
      tag: v0.8.4@sha256:3c7ff986f04c5f1739989463d2e9553f0e7163f9a55d02d240ed6e794e4078f0
    referenceGrant:
      create: true
      fromNamespaces:
        - network
    replicaCount: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: null
        memory: 128Mi
