---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
spec:
  chartRef:
    kind: OCIRepository
    name: tinyauth
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    controllers:
      tinyauth:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tinyauthapp/tinyauth
              tag: v5.1.3@sha256:a1bde189951900f84a60f133c26a1ec7a3264073ec7875b548f4fbadb7f5f735
            env:
              TINYAUTH_APPURL: https://auth.dcunha.io
              TINYAUTH_ANALYTICS_ENABLED: false
              # v5.1.0 label-provider auto-detect wants an in-cluster SA token
              # (not mounted); ACLs here come from TINYAUTH_APPS_* env, not labels
              TINYAUTH_LABELPROVIDER: none
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket-ID
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://id.dcunha.io/authorize
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://id.dcunha.io/api/oidc/token
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://id.dcunha.io/api/oidc/userinfo
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
              TINYAUTH_AUTH_SECURECOOKIE: true
              TINYAUTH_AUTH_SESSIONEXPIRY: 604800
              TINYAUTH_AUTH_TRUSTEDPROXIES: 10.42.0.0/16
              TINYAUTH_LDAP_ADDRESS: ldap://lldap.security.svc.cluster.local:3890
              TINYAUTH_LDAP_BASEDN: dc=dcunha,dc=io
              TINYAUTH_LDAP_BINDDN: cn=admin,ou=people,dc=dcunha,dc=io
              TINYAUTH_LDAP_BINDPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: lldap
                    key: LLDAP_LDAP_USER_PASS
              TINYAUTH_RESOURCES_PATH: /data/resources
              TINYAUTH_DATABASE_PATH: /data/tinyauth.db
              # OIDC provider mode (v5.1.0+) — stable signing keys from the
              # tinyauth secret; emptyDir /data would otherwise regenerate
              # them on every restart and invalidate cached JWKS
              TINYAUTH_OIDC_PRIVATEKEYPATH: /secrets/oidc/key.pem
              TINYAUTH_OIDC_PUBLICKEYPATH: /secrets/oidc/key.pub
              TINYAUTH_OIDC_CLIENTS_IMMICH_CLIENTID: immich
              TINYAUTH_OIDC_CLIENTS_IMMICH_CLIENTSECRETFILE: /secrets/oidc/immich-client-secret
              TINYAUTH_OIDC_CLIENTS_IMMICH_NAME: Immich
              TINYAUTH_OIDC_CLIENTS_IMMICH_TRUSTEDREDIRECTURIS: "https://photos.dcunha.io/auth/login,https://photos.dcunha.io/user-settings,https://photos.dcunha.io/api/oauth/mobile-redirect,app.immich:///oauth-callback"
              # every app ACL needs BOTH group keys — OAuth sessions check _OAUTH_GROUPS,
              # LDAP-password sessions check _LDAP_GROUPS; an unset key allows any
              # authenticated user of that login type. Since v5.1.0 every ACL'd app
              # ALSO needs _OAUTH_WHITELIST: the rules engine matches it against the
              # OAuth email before the group check and an empty whitelist denies all
              # OAuth users (CheckFilter returns ErrFilterEmpty → EffectDeny); /.*/ is
              # a match-all regex so the group lists stay the real gate
              TINYAUTH_APPS_BAZARR_OAUTH_WHITELIST: "/.*/"
              TINYAUTH_APPS_BAZARR_OAUTH_GROUPS: app_admin,app_ops
              TINYAUTH_APPS_BAZARR_LDAP_GROUPS: app_admin,app_ops
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    persistence:
      oidc:
        type: secret
        name: tinyauth
        defaultMode: 0o400
        advancedMounts:
          tinyauth:
            app:
              - path: /secrets/oidc
                readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          tinyauth:
            app:
              - path: /data
                subPath: data
    route:
      app:
        hostnames:
          - auth.dcunha.io
        parentRefs:
          - name: external-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
