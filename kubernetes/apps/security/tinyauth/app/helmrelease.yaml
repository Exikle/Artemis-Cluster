---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
spec:
  chartRef:
    kind: OCIRepository
    name: tinyauth
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    controllers:
      tinyauth:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/steveiliop56/tinyauth
              tag: v5.0.7@sha256:0793c71c49906e079d90c7e693cded9df569217a92d717dc9b171f2116fcd1c6
            env:
              TINYAUTH_APPURL: https://auth.dcunha.io
              TINYAUTH_ANALYTICS_ENABLED: false
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket-ID
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://id.dcunha.io/authorize
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://id.dcunha.io/api/oidc/token
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://id.dcunha.io/api/oidc/userinfo
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
              TINYAUTH_AUTH_SECURECOOKIE: true
              TINYAUTH_AUTH_SESSIONEXPIRY: 604800
              TINYAUTH_AUTH_TRUSTEDPROXIES: 10.42.0.0/16
              TINYAUTH_LDAP_ADDRESS: ldap://lldap.security.svc.cluster.local:3890
              TINYAUTH_LDAP_BASEDN: dc=dcunha,dc=io
              TINYAUTH_LDAP_BINDDN: cn=admin,ou=people,dc=dcunha,dc=io
              TINYAUTH_LDAP_BINDPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: lldap
                    key: LLDAP_LDAP_USER_PASS
              TINYAUTH_RESOURCES_PATH: /data/resources
              TINYAUTH_DATABASE_PATH: /data/tinyauth.db
              # every app ACL needs BOTH keys — OAuth sessions check _OAUTH_GROUPS,
              # LDAP-password sessions check _LDAP_GROUPS; an unset key allows any
              # authenticated user of that login type
              TINYAUTH_APPS_BAZARR_OAUTH_GROUPS: app_admin
              TINYAUTH_APPS_BAZARR_LDAP_GROUPS: app_admin
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: &port 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          tinyauth:
            app:
              - path: /data
                subPath: data
    route:
      app:
        hostnames:
          - auth.dcunha.io
        parentRefs:
          - name: external-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
