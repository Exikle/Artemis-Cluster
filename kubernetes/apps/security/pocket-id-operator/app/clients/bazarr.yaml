---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bazarr
  namespace: security
spec:
  allowedUserGroups:
    - name: app-admin
      namespace: security
  callbackUrls:
    - "https://bazarr.dcunha.io/oauth2/callback"
  launchUrl: "https://bazarr.dcunha.io/"
  logo:
    autoGenerate: false
  pkceEnabled: false
  secret:
    storeClientSecret: false
