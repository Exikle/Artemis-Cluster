---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eco
spec:
  chartRef:
    kind: OCIRepository
    name: eco
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        # official image requires root: WorldGenerator's GDI+ render fails as UID 1000
        # even with writable rootfs + HOME set (kaizoku/flaresolverr exception pattern)
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      terminationGracePeriodSeconds: 300
    controllers:
      eco:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: strangeloopgames/eco-game-server
              tag: 0.14.0.2-beta@sha256:8f89c44def0dce7d506704b2a6e080d7684e87627b2a3a40afcfb45baf46eee9
            args:
              - --nogui
              - --userToken=$(ECO_USER_TOKEN)
            command:
              - ./EcoServer
            stdin: true
            tty: true
            env:
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
              # no passwd entry for UID 1000 in this image; fontconfig/GDI+ need a writable HOME
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: eco
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3001
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3001
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 1000m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # WorldGenerator's GDI+ terrain-map render writes inside /app; RO root breaks it
              readOnlyRootFilesystem: false
    persistence:
      data:
        existingClaim: eco
        advancedMounts:
          eco:
            app:
              - path: /app/Storage
                subPath: storage
              - path: /app/Configs
                subPath: configs
              - path: /app/Mods/UserCode
                subPath: mods
      tmp:
        type: emptyDir
        advancedMounts:
          eco:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/Logs
                subPath: logs
    route:
      app:
        annotations:
          # eco.dcunha.io resolves to the Service LB IP (game traffic), which has no
          # 80/443 listener — the auto-discovered check would time out. Probe the
          # in-process web server over cluster DNS instead.
          gatus.home-operations.com/endpoint: |-
            url: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:3001"
            conditions: ["[STATUS] == 200"]
            ui:
              hide-url: true
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: eco.dcunha.io
          lbipam.cilium.io/ips: 10.10.99.92
        controller: eco
        externalTrafficPolicy: Local
        ports:
          game:
            port: 3000
            protocol: UDP
          webadmin:
            port: 3001
            protocol: TCP
