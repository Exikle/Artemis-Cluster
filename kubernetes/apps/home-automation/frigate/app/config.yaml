---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  config.yml: |-
    # Managed by GitOps. Frigate reads this read-only from a mounted ConfigMap;
    # edit here and let Flux roll it out (reloader restarts the pod on change).
    # NOTE: because this file is mounted read-only, Frigate's UI "Save & Restart"
    # and on-disk version auto-migration cannot write back. On a version bump,
    # reconcile any schema changes here by hand.

    mqtt:
      enabled: true
      host: mosquitto.home-automation.svc.cluster.local
      port: 1883

    # OpenVINO detector on the Intel Arc (claimed via DRA, see helmrelease).
    detectors:
      ov:
        type: openvino
        device: GPU

    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    # VAAPI hardware decode on the Arc (LIBVA_DRIVER_NAME=iHD set in the pod env).
    ffmpeg:
      hwaccel_args: preset-vaapi

    # Pull each NVR channel once through go2rtc, then fan out to detect + record.
    # Stream names match the camera's true location; <ch>01 = main, <ch>02 = sub.
    # ch1=backyard ch2=front_door ch3=left_side ch4=driveway ch5=cam05
    # ch6=right_side ch7=inside ch8=cam08. Password comes from the frigate Secret.
    go2rtc:
      streams:
        backyard:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/101
        backyard_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/102
        front_door:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/201
        front_door_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/202
        left_side:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/301
        left_side_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/302
        driveway:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/401
        driveway_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/402
        cam05:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/501
        cam05_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/502
        right_side:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/601
        right_side_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/602
        inside:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/701
        inside_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/702
        cam08:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/801
        cam08_sub:
          - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.10.62.10:8554/Streaming/Channels/802

        # Cass's Owltron Wi-Fi cameras (IOT VLAN), single stream each, no NVR substream.
        cass_kitchen:
          - rtsp://10.10.152.50:5543/live/channel0
        cass_litterbox:
          - rtsp://10.10.152.57:5543/live/channel0
        cass_dining_room:
          - rtsp://10.10.152.59:5543/live/channel0
        cass_living_room_chair:
          - rtsp://10.10.152.66:5543/live/channel0
        cass_family_room:
          - rtsp://10.10.152.67:5543/live/channel0
        cass_bedroom_1:
          - rtsp://admin:{FRIGATE_OWLTRON_RTSP_PASSWORD}@10.10.152.72:5543/live/channel0
        cass_hallway_2f:
          - rtsp://10.10.152.70:5543/live/channel0
        cass_bedroom_2:
          - rtsp://10.10.152.140:5543/live/channel0

    cameras:
      driveway:
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/driveway
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/driveway_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        detect:
          enabled: true
        live:
          streams:
            driveway: driveway_sub
        # Top ~30% of the frame is the street; masking it stops passing cars and
        # sidewalk pedestrians. The driveway zone then gates what is an alert.
        motion:
          mask:
            street:
              coordinates: 0,0,1,0,1,0.30,0,0.30
        zones:
          driveway_zone:
            coordinates: 0,1,0,0.60,0.35,0.42,0.70,0.40,1,0.48,1,1
            objects:
              - person
              - car
        review:
          alerts:
            required_zones:
              - driveway_zone
      backyard:
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/backyard
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/backyard_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        detect:
          enabled: true
        live:
          streams:
            backyard: backyard_sub
      left_side:
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/left_side
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/left_side_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        detect:
          enabled: true
        live:
          streams:
            left_side: left_side_sub
      right_side:
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/right_side
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/right_side_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        detect:
          enabled: true
        live:
          streams:
            right_side: right_side_sub
      inside:
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/inside
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/inside_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        detect:
          enabled: true
        live:
          streams:
            inside: inside_sub
      front_door:
        enabled: false
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/front_door
              input_args: preset-rtsp-restream
              roles: [record, detect]
      cam05:
        enabled: false
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/cam05
              input_args: preset-rtsp-restream
              roles: [record, detect]
      cam08:
        enabled: false
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/cam08
              input_args: preset-rtsp-restream
              roles: [record, detect]
      cass_kitchen:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_kitchen
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_kitchen: cass_kitchen
      cass_litterbox:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_litterbox
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_litterbox: cass_litterbox
      cass_dining_room:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_dining_room
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_dining_room: cass_dining_room
      cass_living_room_chair:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_living_room_chair
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_living_room_chair: cass_living_room_chair
      cass_family_room:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_family_room
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_family_room: cass_family_room
      cass_bedroom_1:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_bedroom_1
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_bedroom_1: cass_bedroom_1
      cass_hallway_2f:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_hallway_2f
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_hallway_2f: cass_hallway_2f
      cass_bedroom_2:
        ffmpeg:
          output_args:
            record: preset-record-generic
          inputs:
            - path: rtsp://127.0.0.1:8554/cass_bedroom_2
              input_args: preset-rtsp-restream
              roles: [record, detect]
        detect:
          enabled: true
        live:
          streams:
            cass_bedroom_2: cass_bedroom_2
    record:
      enabled: true
      continuous:
        days: 3
      alerts:
        retain:
          days: 30
          mode: all
      detections:
        retain:
          days: 30
          mode: all

    snapshots:
      enabled: true
      retain:
        default: 14

    objects:
      track:
        - person
        - car
      filters:
        person:
          min_score: 0.6
          threshold: 0.7

    version: 0.17-0
