---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": [
              "10.10.152.10/24",
              "fd00:10:10:152::10/64"
            ],
            "mac": "02:4d:60:06:55:be"
          }]
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          iot-v6-route:
            image:
              repository: docker.io/library/alpine
              tag: 3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
            command:
              - sh
              - -c
              - |
                # keep net1's RA default as the only IPv6 default; see networking.md § Thread routing
                gw=$(ip -6 route show dev eth0 | awk '$1 ~ /^fd00:42:/ && /metric 1024/ {print $1; exit}')
                [ -n "$gw" ] || exit 0
                for i in $(seq 1 30); do ip -6 route show default | grep -q net1 && break; sleep 2; done
                ip -6 route del default via "$gw" dev eth0 || true
                ip -6 route show default
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_ADMIN
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.3@sha256:638c4c8d62caad377e70bfa7beef75f70c9343a49aed64aad824f2cd06843c1c
            env:
              HASS_HTTP_TRUSTED_PROXY_1: 10.10.0.0/24
              HASS_HTTP_TRUSTED_PROXY_2: 10.42.0.0/16
              RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-postgres
                    key: url
            envFrom:
              - externalSecretRef:
                  identifier: env
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              readOnlyRootFilesystem: true
    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: home-assistant
          - extract:
              key: govee
          - extract:
              key: leviton
          - extract:
              key: pirate-weather
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HASS_ELEVATION: "{{ .ELEVATION }}"
              HASS_GOVEE_API_KEY: "{{ .GOVEE_API_KEY }}"
              HASS_LATITUDE: "{{ .LATITUDE }}"
              HASS_LEVITON_PASSWORD: "{{ .LEVITON_PASSWORD }}"
              HASS_LEVITON_USERNAME: "{{ .LEVITON_USERNAME }}"
              HASS_LONGITUDE: "{{ .LONGITUDE }}"
              HASS_PIRATE_WEATHER_API_KEY: "{{ .PIRATE_WEATHER_API_KEY }}"
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: home-assistant
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
          - hass.dcunha.io
        parentRefs:
          - name: external-gateway
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 8123
    service:
      app:
        ports:
          http:
            port: 8123
