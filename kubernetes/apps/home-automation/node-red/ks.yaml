---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app node-red
spec:
  targetNamespace: home-automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/home-automation/node-red/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  components:
    # Canary for copyMethod: Direct — no VolumeSnapshot and no staged PVC, so a
    # run creates no miroir volume at all. node-red keeps its flows as JSON
    # files and its PVC holds no SQLite, so a live crash-consistent read is safe
    # here. Do not move an app with a database in its PVC onto this component.
    - ../../../../components/kopiur/backup-direct
  postBuild:
    substitute:
      APP: node-red
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_STORAGECLASS: miroir
  wait: false
