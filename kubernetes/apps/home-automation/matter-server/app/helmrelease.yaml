---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: matter-server
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": [
              "10.10.152.11/24",
              "fd00:10:10:152::11/64"
            ],
            "mac": "02:0c:d8:a2:91:8f"
          }]
      hostUsers: false
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        supplementalGroups:
          - 34
        sysctls:
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "128"
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          iot-v6-route:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:c6b073f8e9e58d881f6ffba6ebf3b9ebd60b9e7d6e8337018c0e68bb5c356873
            command:
              - sh
              - -c
              - |
                # keep net1's RA default as the only IPv6 default; see networking.md § Thread routing
                gw=$(ip -6 route show dev eth0 | awk '$1 ~ /^fd00:42:/ && /metric 1024/ {print $1; exit}')
                [ -n "$gw" ] || exit 0
                for i in $(seq 1 30); do ip -6 route show default | grep -q net1 && break; sleep 2; done
                ip -6 route del default via "$gw" dev eth0 || true
                ip -6 route show default
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_ADMIN
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.0@sha256:b051f3f5bcc8df0f582773055d18e68136332135587d7bfc8b6c1bb8eacb75c7
            env:
              LOG_LEVEL: info
              PORT: &port 5580
              PRIMARY_INTERFACE: net1
              STORAGE_PATH: /data
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 36
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              limits:
                memory: 350Mi
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
        advancedMounts:
          matter-server:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dcunha.io"
        parentRefs:
          - name: internal-gateway
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
