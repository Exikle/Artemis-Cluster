---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.tekton.dev/tektonconfig_v1alpha1.json
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-system
  profile: all
  chain:
    disabled: true
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
  pipeline:
    default-pod-template: |
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/managed-by: tekton-pipelines
    running-in-environment-with-injected-sidecars: false
  pruner:
    disabled: false
    schedule: "*/15 * * * *"
    resources:
      - taskrun
      - pipelinerun
    keep: 20
  result:
    disabled: true
