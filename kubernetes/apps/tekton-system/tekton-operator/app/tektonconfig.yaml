---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.tekton.dev/tektonconfig_v1alpha1.json
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: tekton-system
  profile: all
  chain:
    disabled: true
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: false
  # Completed TaskRun pods keep the kubernetes.io/pvc-protection finalizer alive
  # on the runner's generated setup PVCs, so every retained run pins a 1Gi
  # ceph-block RBD image in Terminating. One oci-push produces 10 TaskRuns, so
  # keep: 50 on a daily schedule leaked ~5 volumes for up to 24h.
  pruner:
    disabled: false
    schedule: "0 */4 * * *"
    resources:
      - taskrun
      - pipelinerun
    keep: 20
  result:
    disabled: true
