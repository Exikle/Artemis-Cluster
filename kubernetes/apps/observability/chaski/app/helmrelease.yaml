# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: chaski-secret
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      targets:
        pushover:
          apprise:
            url: 'pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "PUSHOVER_TOKEN" }}'
      routes:
        alertmanager:
          target: pushover
          title: '[{{ .payload.commonLabels.severity | default "info" | toUpper }}] {{ .payload.commonLabels.alertname }} — {{ .payload.status | toUpper }}{{ if eq .payload.status "firing" }} ({{ len .payload.alerts }}){{ end }}'
          message: |-
            {{- range .payload.alerts }}
            <b>{{ .labels.alertname }}</b>{{ if .labels.namespace }} <small>({{ .labels.namespace }})</small>{{ end }}
            {{ coalesce .annotations.description .annotations.summary .annotations.message "No description available" | trunc 200 }}
            {{ end -}}
          params:
            format: html
            priority: '{{ if eq .payload.status "resolved" }}low{{ else if eq .payload.commonLabels.severity "critical" }}high{{ else }}normal{{ end }}'
            sound: '{{ ternary "alien" "gamelan" (eq .payload.commonLabels.severity "critical") }}'
            url: "{{ .payload.externalURL }}"
            url_title: View-in-Alertmanager
        apoci:
          target: pushover
          title: "[apoci]"
          message: "{{ .payload.message | replace \"\\n\" \"<br>\" }}"
          params:
            format: html
            priority: normal
            sound: cosmic
            url: https://registry.dcunha.io
            url_title: Open-apoci
