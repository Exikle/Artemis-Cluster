# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: chaski-secret
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      targets:
        pushover:
          apprise:
            url: 'pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "PUSHOVER_TOKEN" }}'
      templates:
        alert-title: '{{ .payload.commonLabels.alertname }} — {{ .payload.status | toUpper }}{{ if eq .payload.status "firing" }} ({{ len .payload.alerts }}){{ end }}'
        alert-body: |-
          {{- range .payload.alerts }}
          <b>{{ .labels.alertname }}</b>{{ if .labels.namespace }} <small>({{ .labels.namespace }})</small>{{ end }}
          {{ coalesce .annotations.description .annotations.summary .annotations.message "No description available" | trunc 200 }}
          {{ end -}}
        route-title: '{{ if .payload.alerts }}{{ template "alert-title" . }}{{ else }}{{ .payload.title | default (toTitleCase .route) }}{{ end }}'
        route-message: '{{ if .payload.alerts }}{{ template "alert-body" . }}{{ else }}{{ .payload.message }}{{ end }}'
        route-url: '{{ if .payload.alerts }}{{ .payload.externalURL | default "" }}{{ else }}{{ .payload.url | default "" }}{{ end }}'
      routes:
        critical:
          target: pushover
          title: '{{ template "route-title" . }}'
          message: '{{ template "route-message" . }}'
          params:
            format: html
            priority: high
            sound: alien
            url: '{{ template "route-url" . }}'
            url_title: View-Details
        warning:
          target: pushover
          title: '{{ template "route-title" . }}'
          message: '{{ template "route-message" . }}'
          params:
            format: html
            priority: normal
            sound: gamelan
            url: '{{ template "route-url" . }}'
            url_title: View-Details
        info:
          target: pushover
          title: '{{ template "route-title" . }}'
          message: '{{ template "route-message" . }}'
          params:
            format: html
            priority: low
            sound: pushover
            url: '{{ template "route-url" . }}'
            url_title: View-Details
