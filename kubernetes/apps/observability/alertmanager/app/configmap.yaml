---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - equal:
          - alertname
          - namespace
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
    route:
      receiver: blackhole
      group_by:
        - alertname
        - cluster
        - job
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: blackhole
          matchers:
            - alertname = InfoInhibitor
        # The client pool is a loopfile whose only job is to give the four
        # diskless nodes a MiroirNode, so consumers can realize a DRBD client
        # leg. loopfile takes only a baseDir — no size cap — so the pool
        # reports the node's root filesystem and reads 70-80% full while
        # holding nothing. Every replica lives in the nvme pool, so this
        # alert can only ever be a false positive here.
        - receiver: blackhole
          matchers:
            - alertname = MiroirPoolUsageHigh
            - pool = client
        - receiver: heartbeat
          group_interval: 2m
          group_wait: 0s
          repeat_interval: 2m30s
          matchers:
            - alertname = Watchdog
        - receiver: chaski-critical
          matchers:
            - severity = critical
        - receiver: chaski-warning
          matchers:
            - severity = warning
        - receiver: chaski-info
          matchers:
            - severity = info
    receivers:
      - name: blackhole
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/HEARTBEAT_URL
            http_config:
              bearer_token_file: /etc/alertmanager-secrets/HEARTBEAT_TOKEN
            send_resolved: false
      - name: chaski-critical
        webhook_configs:
          - url: http://chaski.observability.svc.cluster.local:8080/hooks/critical
            send_resolved: true
      - name: chaski-warning
        webhook_configs:
          - url: http://chaski.observability.svc.cluster.local:8080/hooks/warning
            send_resolved: true
      - name: chaski-info
        webhook_configs:
          - url: http://chaski.observability.svc.cluster.local:8080/hooks/info
            send_resolved: true
