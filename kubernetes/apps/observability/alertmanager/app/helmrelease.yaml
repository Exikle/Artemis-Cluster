---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
spec:
  chartRef:
    kind: OCIRepository
    name: alertmanager
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534

    controllers:
      app:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheus/alertmanager
              tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
            args:
              - --config.file=/etc/alertmanager/alertmanager.yaml
              - --storage.path=/alertmanager
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 9093
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: 9093
                  initialDelaySeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    externalSecrets:
      secrets:
        forceRename: alertmanager-secret
        dataFrom:
          - extract:
              key: pushover
          - extract:
              key: gatus
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HEARTBEAT_TOKEN: "{{ .HEARTBEAT_TOKEN }}"
              HEARTBEAT_URL: "https://{{ .STATUS_HOSTNAME }}/api/v1/endpoints/core_Heartbeat/external?success=true"
              ALERTMANAGER_PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
              PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
    persistence:
      config:
        type: configMap
        name: alertmanager-config
        globalMounts:
          - path: /etc/alertmanager
      secrets:
        type: secret
        externalSecretRef: secrets
        globalMounts:
          - path: /etc/alertmanager-secrets
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: miroir
        globalMounts:
          - path: /alertmanager
      tmp:
        type: emptyDir

        globalMounts:
          - path: /tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: alertmanager
            url: "http://alertmanager.observability.svc.cluster.local:9093/-/healthy"
            conditions:
              - "[STATUS] == 200"
        hostnames:
          - alertmanager.dcunha.io
        parentRefs:
          - name: internal-gateway
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9093

    service:
      app:
        ports:
          http:
            port: 9093
