---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
      auto_assign_org: "true"
      auto_assign_org_id: "1"
      auto_assign_org_role: Admin
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Pocket-ID
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid,profile,email,groups
      auth_url: https://id.dcunha.io/authorize
      token_url: https://id.dcunha.io/api/oidc/token
      api_url: https://id.dcunha.io/api/oidc/userinfo
      use_pkce: "true"
      use_refresh_token: "true"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      email_attribute_path: email
      role_attribute_path: "contains(groups[*], 'app_admin') && 'Admin' || contains(groups[*], 'app_ops') && 'Editor' || 'Viewer'"
      groups_attribute_path: groups
    database:
      type: postgres
      host: postgres-rw.database.svc:5432
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
      ssl_mode: verify-full
      ca_cert_path: /var/run/secrets/postgres-server-ca/ca.crt
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.dcunha.io
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_INSTALL_PLUGINS
                  value: victoriametrics-logs-datasource
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres
                      key: POSTGRES_PASSWORD
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: postgres-server-ca
                  mountPath: /var/run/secrets/postgres-server-ca
                  readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              emptyDir:
                sizeLimit: 2Gi
            - name: postgres-server-ca
              secret:
                defaultMode: 0o440
                secretName: postgres-server-ca
  httpRoute:
    metadata:
      annotations:
        gatus.home-operations.com/endpoint: |-
          name: grafana
    spec:
      hostnames:
        - grafana.dcunha.io
      parentRefs:
        - name: internal-gateway
          namespace: network
        - name: external-gateway
          namespace: network
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  disableDefaultSecurityContext: All
