---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: victoria-logs-vector-k8s-monitoring
            patch: |
              $patch: delete
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: victoria-logs-vector-k8s-monitoring
  values:
    fullnameOverride: victoria-logs
    server:
      persistentVolume:
        enabled: true
        storageClassName: miroir
        size: 8Gi
      podAnnotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": [
              "10.10.152.14/24",
              "fd00:10:10:152::14/64"
            ],
            "mac": "02:1a:c3:7f:9e:44"
          }]
      retentionPeriod: 14d
      route:
        enabled: true
        hostnames:
          - logs.dcunha.io
        parentRefs:
          - name: internal-gateway
            namespace: network
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      serviceMonitor:
        enabled: true
      syslog:
        udp:
          - name: syslog-udp
            value: :514
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: grafana
