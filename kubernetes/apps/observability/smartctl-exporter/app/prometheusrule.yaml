---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter
spec:
  groups:
    - name: smartctl-exporter
      rules:
        - alert: SmartDeviceHighTemperature
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} drive {{ $labels.device }} temperature is {{ $value }}°C"
        - alert: SmartDeviceTestFailed
          expr: smartctl_device_smart_status == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} drive {{ $labels.device }} SMART health check failed"
        - alert: SmartDeviceCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} NVMe {{ $labels.device }} has a critical warning"
        - alert: SmartDeviceMediaErrors
          expr: delta(smartctl_device_media_errors[1w]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} NVMe {{ $labels.device }} has media errors"
        - alert: SmartDeviceAvailableSpareUnderThreshold
          expr: smartctl_device_available_spare <= smartctl_device_available_spare_threshold
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} NVMe {{ $labels.device }} available spare is below threshold"
        # SAS/SCSI media damage (pantheon vmpool members). NVMe rules above never see these drives.
        - alert: SmartScsiGrownDefectsIncreasing
          expr: delta(smartctl_scsi_grown_defect_list[1d]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} SAS {{ $labels.device }} grew {{ $value }} defect(s) in 24h"
        - alert: SmartReallocatedSectorsIncreasing
          expr: delta(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[1d]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.device }} reallocated {{ $value }} sector(s) in 24h"
