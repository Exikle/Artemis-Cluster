---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: pve-exporter
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      pve-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.10.2@sha256:7ed5dbff1b145e62e94003cb78d70226d9a7c4d4d1c928b3c7daed21ae9a84d8
            env:
              PYTHONWARNINGS: once
              PVE_VERIFY_SSL: "false"
            envFrom:
              - secretRef:
                  name: pve-exporter-secret
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    externalSecrets:
      env:
        dataFrom:
          - extract:
              key: proxmox
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: pve-exporter-secret
          template:
            data:
              PVE_USER: "{{ .PVE_USER }}"
              PVE_TOKEN_NAME: "{{ .PVE_TOKEN_NAME }}"
              PVE_TOKEN_VALUE: "{{ .PVE_TOKEN_VALUE }}"
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          pve-exporter:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        ports:
          metrics:
            port: 9221
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /pve
            params:
              target:
                - 10.10.99.104:8006
            interval: 60s
            scrapeTimeout: 30s
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
              - action: replace
                sourceLabels:
                  - __param_target
                targetLabel: instance
