---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: pve-exporter
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      pve-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.10.0@sha256:4867684c0a937716f11f770a32d32958bded507cf570fc334f774392afcb2f37
            env:
              PYTHONWARNINGS: once
              PVE_VERIFY_SSL: "false"
            envFrom:
              - secretRef:
                  name: pve-exporter-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          pve-exporter:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        ports:
          metrics:
            port: 9221
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /pve
            params:
              target:
                - 10.10.99.104:8006
            interval: 60s
            scrapeTimeout: 30s
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
              - action: replace
                sourceLabels:
                  - __param_target
                targetLabel: instance
