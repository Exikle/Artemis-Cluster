---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    # Every zeroscaler HPA in the cluster keys off probe_success from this one
    # pod. With no requests it ran BestEffort, so CPU contention on a busy node
    # starved its probe goroutines until it missed its own liveness probe --
    # taking probe_success with it and idling every scale-to-zero app to nought.
    # Requests (not limits) are what buy it a guaranteed share; no CPU limit, so
    # it can still burst through a probe sweep without being throttled.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    securityContext:
      capabilities:
        add:
          - NET_RAW
        drop:
          - ALL
    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: CertificateExpiringSoon
          expr: |-
            ((probe_ssl_earliest_cert_expiry - time()) / 86400 < 21)
              and (probe_ssl_earliest_cert_expiry > 0)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              The TLS certificate served by {{ $labels.instance }} expires in
              {{ $value | printf "%.0f" }} days
        - alert: CertificateExpired
          expr: |-
            ((probe_ssl_earliest_cert_expiry - time()) / 86400 <= 0)
              and (probe_ssl_earliest_cert_expiry > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              The TLS certificate served by {{ $labels.instance }} has EXPIRED
        - alert: HttpsProbeFailed
          expr: |-
            probe_success{job="blackbox-https"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              The HTTPS probe for {{ $labels.instance }} has been failing for 15 minutes
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
