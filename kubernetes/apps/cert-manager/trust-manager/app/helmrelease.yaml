---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  chartRef:
    kind: OCIRepository
    name: trust-manager
  interval: 1h
  values:
    app:
      trust:
        namespace: cert-manager
    secretTargets:
      authorizedSecrets:
        - postgres-client-ca
        - root-ca
      enabled: true
