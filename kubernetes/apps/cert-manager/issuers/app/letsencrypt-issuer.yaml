---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          cloudflare:
            email: ${ACME_EMAIL}
            apiTokenSecretRef:
              name: cloudflare-bootstrap
              key: CF_TOKEN
        selector:
          dnsZones:
            - "dcunha.io"
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-frostlink
              key: CF_TOKEN
        selector:
          dnsZones:
            - "frostlink.dev"
