---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/stepaction_v1beta1.json
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: buildx-bake
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: docker, buildx, buildkit, oci
    tekton.dev/displayName: "buildx bake"
spec:
  description: >-
    Builds an app's docker-bake.hcl against a remote buildkitd and pushes the
    result. No Docker daemon is involved: buildx talks to buildkitd over TCP,
    so docker-bake.hcl stays the single source of truth for context, platforms
    and build args. Writes the pushed digest to the DIGEST result.
  params:
    - name: app
      description: App name; the bake file is read from apps/<app>.
      type: string
    - name: image
      description: Fully qualified image name without a tag.
      type: string
    - name: tags
      description: Newline-separated list of fully qualified tags to push.
      type: string
    - name: output-mode
      description: >-
        "registry" pushes the image and exports the build cache; "cacheonly"
        builds and discards, publishing nothing.
      type: string
      default: registry
    - name: buildkit-address
      description: Address of the remote buildkitd.
      type: string
    - name: source-path
      description: Checked-out repository. Pass $(workspaces.source.path).
      type: string
    - name: docker-config-path
      description: Directory holding a Docker config.json. Pass $(workspaces.docker-config.path).
      type: string
    - name: version
      description: Upstream version recorded in the image labels.
      type: string
    - name: revision
      description: Commit SHA recorded in the image labels.
      type: string
  results:
    - name: DIGEST
      description: Digest of the pushed image or index.
      type: string
  image: docker.io/library/docker:29-cli@sha256:27a51d5ab1cd38d9eeaba7b415b8c07bc10c31e1cf1ec8d78f6413fcfab3f44f
  # Params arrive as env, never interpolated into the script: a multi-line or
  # multi-word value substituted inline splices into the middle of a statement.
  env:
    - name: DOCKER_CONFIG_PATH
      value: $(params.docker-config-path)
    - name: APP
      value: $(params.app)
    - name: IMAGE
      value: $(params.image)
    - name: TAGS
      value: $(params.tags)
    - name: OUTPUT_MODE
      value: $(params.output-mode)
    - name: BUILDKIT_ADDRESS
      value: $(params.buildkit-address)
    - name: SOURCE_PATH
      value: $(params.source-path)
    - name: VERSION
      value: $(params.version)
    - name: REVISION
      value: $(params.revision)
  command:
    - sh
  args:
    - -ceu
    - |-
      # buildx writes builder state into $DOCKER_CONFIG, but the workspace is
      # a read-only secret mount, so the auth is copied somewhere writable.
      export DOCKER_CONFIG=/tmp/docker
      mkdir -p "${DOCKER_CONFIG}"
      cp "${DOCKER_CONFIG_PATH}/config.json" "${DOCKER_CONFIG}/config.json"

      cd "${SOURCE_PATH}/apps/${APP}"

      # Shared files (.dockerignore) are copied in without clobbering an app's
      # own copy, matching how the repository stages a build context.
      cp -n "${SOURCE_PATH}/include/.dockerignore" . 2>/dev/null || true

      docker buildx create --name remote --driver remote --use "${BUILDKIT_ADDRESS}"

      set -- \
          --file docker-bake.hcl \
          --metadata-file /tmp/bake-metadata.json \
          --set "*.cache-from=type=registry,ref=${IMAGE}-build-cache" \
          --set "*.labels.org.opencontainers.image.title=${APP}" \
          --set "*.labels.org.opencontainers.image.url=https://${IMAGE}" \
          --set "*.labels.org.opencontainers.image.version=${VERSION}" \
          --set "*.labels.org.opencontainers.image.revision=${REVISION}"

      if [ "${OUTPUT_MODE}" = "cacheonly" ]; then
          # A validation build publishes nothing at all: no image, and no cache
          # export either, so a pull request cannot write to either registry or
          # poison the cache the release path reads back.
          set -- "$@" --set "*.output=type=cacheonly"
      else
          set -- "$@" \
              --set "*.cache-to=type=registry,ref=${IMAGE}-build-cache,mode=max,compression=zstd,force-compression=true" \
              --set "*.output=type=image,push=true,compression=zstd,force-compression=true"

          # Tags go in via a bake override file rather than --set: --set takes a
          # single reference, so a comma-joined list is read as one invalid tag.
          # The HCL already declares an empty docker-metadata-action target for
          # image to inherit, which is the same mechanism the Actions path used.
          TAGS_JSON=""
          for tag in ${TAGS}; do
              TAGS_JSON="${TAGS_JSON}${TAGS_JSON:+,}\"${tag}\""
          done
          printf '{"target":{"docker-metadata-action":{"tags":[%s]}}}' "${TAGS_JSON}" \
              > /tmp/tags.json
          set -- "$@" --file /tmp/tags.json
      fi

      # image-all carries the platform list; image alone would silently build
      # only the builder's native platform whatever the bake file declares.
      docker buildx bake image-all "$@"

      if [ "${OUTPUT_MODE}" = "cacheonly" ]; then
          # Nothing was pushed, so there is no digest. The result still has to
          # be written or Tekton fails the TaskRun for an unset result.
          printf "" > "$(step.results.DIGEST.path)"
          echo "Validated ${IMAGE} (nothing published)"
          exit 0
      fi

      # Every platform in image-all is built by the one bake invocation, so the
      # push already yields a single index. There is nothing to merge.
      DIGEST=$(awk -F\" '/containerimage.digest/ { print $4 }' /tmp/bake-metadata.json | head -1)
      if [ -z "${DIGEST}" ]; then
          echo "No digest in bake metadata" >&2
          cat /tmp/bake-metadata.json >&2
          exit 1
      fi
      printf "%s" "${DIGEST}" > "$(step.results.DIGEST.path)"
      echo "Pushed ${IMAGE}@${DIGEST}"
