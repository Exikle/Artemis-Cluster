---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/stepaction_v1beta1.json
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: bake-options
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: docker, buildx, oci
    tekton.dev/displayName: "bake options"
spec:
  description: >-
    Reads VERSION out of an app's docker-bake.hcl and derives the tag list.
    Mirrors the repository's app-options and app-versions composite actions so
    both CI paths tag images identically.
  params:
    - name: app
      description: App name; the bake file is read from apps/<app>.
      type: string
    - name: images
      description: Newline-separated image names, without tags, to generate tags for.
      type: string
    - name: release
      description: When "true" emit release tags, otherwise a single sandbox tag.
      type: string
    - name: source-path
      description: Checked-out repository. Pass $(workspaces.source.path).
      type: string
  results:
    - name: VERSION
      description: Upstream version string from the bake file.
      type: string
    - name: TAGS
      description: Space-separated fully qualified tags.
      type: string
  image: docker.io/library/docker:29-cli@sha256:3f4743208d2338c934d7b8bcfbe1bb54c0b2355c510ad5e0f31c0c4a54bd704e
  # Params arrive as env, never interpolated into the script: `images` is
  # multi-line, and substituting it inline splices raw newlines into the middle
  # of a shell statement.
  env:
    - name: APP
      value: $(params.app)
    - name: IMAGES
      value: $(params.images)
    - name: RELEASE
      value: $(params.release)
    - name: SOURCE_PATH
      value: $(params.source-path)
  command:
    - sh
  args:
    - -ceu
    - |-
      cd "${SOURCE_PATH}/apps/${APP}"

      # Read the variable straight out of the HCL. buildx would need a builder
      # connection for this, and resolving the version must not depend on
      # buildkitd being reachable.
      VERSION=$(sed -n '/variable "VERSION"/,/}/p' docker-bake.hcl \
          | sed -n 's/.*default[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)

      if [ -z "${VERSION}" ]; then
          echo "No VERSION default found in ${SOURCE_PATH}/apps/${APP}/docker-bake.hcl" >&2
          exit 1
      fi
      printf "%s" "${VERSION}" > "$(step.results.VERSION.path)"

      # Same ladder as the app-versions action: an optional v, then one to three
      # numeric components. Anything trailing is dropped from the semantic form.
      if echo "${VERSION}" | grep -qE '^v?[0-9]+'; then
          CORE=$(echo "${VERSION#v}" | sed 's/[^0-9.].*$//' | cut -d. -f1-3)
          MAJOR=$(echo "${CORE}" | cut -d. -f1)
          MINOR=$(echo "${CORE}" | cut -d. -f2 -s); MINOR=${MINOR:-0}
          PATCH=$(echo "${CORE}" | cut -d. -f3 -s); PATCH=${PATCH:-0}
          SEMANTIC="${MAJOR}.${MINOR}.${PATCH}"
          RAW=$(echo "${VERSION#v}" | cut -d- -f1)
      else
          SEMANTIC=$(date -u +%Y.%-m.%-d)
          RAW="${VERSION}"
          MAJOR=""
          MINOR=""
      fi

      : > /tmp/tags
      for image in ${IMAGES}; do
          if [ "${RELEASE}" = "true" ]; then
              echo "${image}:rolling" >> /tmp/tags
              echo "${image}:${SEMANTIC}" >> /tmp/tags
              if [ -n "${MAJOR}" ]; then
                  echo "${image}:${MAJOR}" >> /tmp/tags
                  echo "${image}:${MAJOR}.${MINOR}" >> /tmp/tags
              fi
              if [ "${RAW}" != "${SEMANTIC}" ]; then
                  echo "${image}:${RAW}" >> /tmp/tags
              fi
          else
              echo "${image}:sandbox" >> /tmp/tags
          fi
      done

      sort -u /tmp/tags | tr '\n' ' ' > "$(step.results.TAGS.path)"
      echo "Version ${VERSION} -> tags:"
      sort -u /tmp/tags
