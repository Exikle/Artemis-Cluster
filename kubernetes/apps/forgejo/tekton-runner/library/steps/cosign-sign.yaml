---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/stepaction_v1beta1.json
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: cosign-sign
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Security
    tekton.dev/tags: cosign, oci, sign
    tekton.dev/displayName: "cosign sign"
spec:
  description: >-
    Signs an OCI artifact by digest with a cosign key. The private key comes
    from a Secret-backed workspace, its passphrase from a Secret via env, and
    registry auth from a Docker config workspace. Image is distroless so this
    runs cosign directly with args.
  params:
    - name: digest-url
      description: Digest-qualified reference to sign, e.g. host/repo@sha256:...
      type: string
    - name: cosign-path
      description: Directory holding cosign.key. Pass $(workspaces.cosign.path).
      type: string
    - name: docker-config-path
      description: Directory holding a Docker config.json. Pass $(workspaces.docker-config.path).
      type: string
    - name: signing-secret-name
      description: Secret holding the key passphrase under the 'password' key.
      type: string
  image: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
  env:
    - name: DOCKER_CONFIG
      value: $(params.docker-config-path)
    - name: COSIGN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: $(params.signing-secret-name)
          key: password
  command:
    - /ko-app/cosign
  args:
    - sign
    - --yes
    - --key
    - $(params.cosign-path)/cosign.key
    - $(params.digest-url)
