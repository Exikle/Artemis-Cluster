---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-tag-artifact
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: flux, oci
    tekton.dev/displayName: "flux tag artifact"
spec:
  description: >-
    Moves a tag onto an already-pushed Flux OCI artifact. Registry credentials
    are provided through a Secret-backed workspace, never as params.
  params:
    - name: artifact-url
      description: Existing tagged OCI reference to re-tag from, e.g. oci://host/repo:sha.
      type: string
    - name: tag
      description: Tag to move onto the artifact.
      type: string
      default: main
    - name: username
      description: Registry username.
      type: string
    - name: token-file
      description: File name under the auth workspace holding the registry token.
      type: string
  workspaces:
    - name: auth
      description: Secret-backed workspace holding the registry token file.
  steps:
    - name: flux-tag-artifact
      ref:
        name: flux-tag-artifact
      computeResources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 1Gi
      params:
        - name: artifact-url
          value: $(params.artifact-url)
        - name: tag
          value: $(params.tag)
        - name: username
          value: $(params.username)
        - name: auth-path
          value: $(workspaces.auth.path)
        - name: token-file
          value: $(params.token-file)
