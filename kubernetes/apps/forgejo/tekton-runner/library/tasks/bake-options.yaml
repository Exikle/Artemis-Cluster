---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bake-options
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: docker, buildx, oci
    tekton.dev/displayName: "bake options"
spec:
  description: >-
    Resolves an app's version and the tag list to publish, from its
    docker-bake.hcl.
  params:
    - name: app
      description: App name.
      type: string
    - name: images
      description: Newline-separated image names without tags.
      type: string
    - name: release
      description: When "true" emit release tags, otherwise a sandbox tag.
      type: string
      default: "false"
  workspaces:
    - name: source
      description: The checked-out repository.
  results:
    - name: VERSION
      description: Upstream version string.
      value: $(steps.bake-options.results.VERSION)
    - name: TAGS
      description: Space-separated fully qualified tags.
      value: $(steps.bake-options.results.TAGS)
  steps:
    - name: bake-options
      ref:
        name: bake-options
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      params:
        - name: app
          value: $(params.app)
        - name: images
          value: $(params.images)
        - name: release
          value: $(params.release)
        - name: source-path
          value: $(workspaces.source.path)
