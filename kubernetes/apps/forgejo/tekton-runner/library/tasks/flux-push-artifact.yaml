---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-push-artifact
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: flux, oci
    tekton.dev/displayName: "flux push artifact"
spec:
  description: >-
    Pushes a Flux OCI artifact and returns its digest URL. Registry credentials
    are provided through a Secret-backed workspace, never as params.
  params:
    - name: artifact-url
      description: Tagged OCI reference to push, e.g. oci://host/repo:sha.
      type: string
    - name: source
      description: Source URL recorded in the artifact metadata.
      type: string
    - name: revision
      description: Revision recorded in the artifact metadata.
      type: string
    - name: username
      description: Registry username.
      type: string
    - name: token-file
      description: File name under the auth workspace holding the registry token.
      type: string
    - name: path
      description: Directory to package.
      type: string
      default: "."
  workspaces:
    - name: source
      description: The checked-out repository to package.
    - name: auth
      description: Secret-backed workspace holding the registry token file.
  results:
    - name: DIGEST_URL
      description: Repository URL (no tag) with the pushed digest appended.
  steps:
    - name: flux-push-artifact
      ref:
        name: flux-push-artifact
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 2Gi
      params:
        - name: artifact-url
          value: $(params.artifact-url)
        - name: path
          value: $(params.path)
        - name: source
          value: $(params.source)
        - name: revision
          value: $(params.revision)
        - name: username
          value: $(params.username)
        - name: auth-path
          value: $(workspaces.auth.path)
        - name: token-file
          value: $(params.token-file)
        - name: source-path
          value: $(workspaces.source.path)
    - name: write-results
      image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      command:
        - sh
      args:
        - -ceu
        - |-
          printf "%s" "$(steps.flux-push-artifact.results.DIGEST_URL)" > "$(results.DIGEST_URL.path)"
