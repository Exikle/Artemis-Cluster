---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-notify
  annotations:
    tekton.dev/categories: Deployment
    tekton.dev/tags: flux, webhook
    tekton.dev/displayName: "flux notify"
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    Pings the Flux webhook receiver to trigger immediate reconciliation.
    Wraps the flux-notify StepAction; token and URL come from a Secret.
    Best-effort by design: the step runs after the artifact is already pushed
    and Flux polls on its own interval, so onError:continue keeps a failed
    ping visible in the TaskRun without failing a delivered build.
  params:
    - name: signing-secret-name
      description: Secret holding 'webhook-token' and 'webhook-url' keys.
      type: string
  steps:
    - name: flux-notify
      ref:
        name: flux-notify
      onError: continue
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      params:
        - name: signing-secret-name
          value: $(params.signing-secret-name)
