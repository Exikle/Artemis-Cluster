---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-artifact-release
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Build Tools
    tekton.dev/tags: flux, oci, cosign
    tekton.dev/displayName: "flux artifact release"
spec:
  description: >-
    Clones the repository, pushes it as a Flux OCI artifact, moves the release
    tag onto it, signs the digest with cosign and verifies the signature — all
    as steps in one pod, so a release costs one pod allocation rather than five.
    Checkout is folded in rather than shared from a prior task so the source
    workspace never crosses a pod boundary and can be a plain emptyDir: that
    retires the per-run ReadWriteOnce PVC, and with it Tekton's affinity
    assistant, which was forcing every pod of a run onto whichever node the
    clone landed on. Every credential arrives
    through a Secret-backed workspace. The verify steps are inline rather than
    StepAction refs because a ref step cannot mount the shared scratch volume
    the derived public key is written to.

    Step requests are deliberately small. Tekton renders each step as its own
    container, so Kubernetes sums their requests when scheduling even though
    only one step ever runs at a time; sizing each step for its own peak made
    the pod unschedulable on a busy node.
  params:
    - name: url
      description: Repository URL to clone from.
      type: string
    - name: sha
      description: Commit SHA to check out.
      type: string
    - name: artifact-url
      description: Tagged OCI reference to push, e.g. oci://host/repo:sha.
      type: string
    - name: source
      description: Source URL recorded in the artifact metadata.
      type: string
    - name: revision
      description: Revision recorded in the artifact metadata (e.g. main@sha1:abc).
      type: string
    - name: username
      description: Registry username.
      type: string
    - name: token-file
      description: File name under the auth workspace holding the registry token.
      type: string
    - name: signing-secret-name
      description: Secret holding the key passphrase under the 'password' key.
      type: string
    - name: tag
      description: Tag to move onto the artifact.
      type: string
      default: main
    - name: path
      description: Directory to package.
      type: string
      default: "."
  workspaces:
    - name: source
      description: Scratch workspace the repository is cloned into; expects an emptyDir.
    - name: basic-auth
      description: Secret-backed workspace with .gitconfig and .git-credentials.
    - name: auth
      description: Secret-backed workspace holding the registry token file.
    - name: cosign
      description: Secret-backed workspace holding cosign.key.
    - name: docker-config
      description: Secret-backed workspace holding a Docker config.json for registry auth.
  results:
    - name: DIGEST_URL
      description: Repository URL (no tag) with the pushed digest appended.
      value: $(steps.push.results.DIGEST_URL)
  volumes:
    - name: scratch
      emptyDir: {}
  steps:
    - name: clone
      ref:
        name: git-clone
      computeResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      params:
        - name: output-path
          value: $(workspaces.source.path)
        - name: basic-auth-path
          value: $(workspaces.basic-auth.path)
        - name: url
          value: $(params.url)
        - name: revision
          value: $(params.sha)
        - name: submodules
          value: "false"
        - name: verbose
          value: "false"
    - name: push
      ref:
        name: flux-push-artifact
      computeResources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 2Gi
      params:
        - name: artifact-url
          value: $(params.artifact-url)
        - name: path
          value: $(params.path)
        - name: source
          value: $(params.source)
        - name: revision
          value: $(params.revision)
        - name: username
          value: $(params.username)
        - name: auth-path
          value: $(workspaces.auth.path)
        - name: token-file
          value: $(params.token-file)
        - name: source-path
          value: $(workspaces.source.path)
    - name: tag
      ref:
        name: flux-tag-artifact
      computeResources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 1Gi
      params:
        - name: artifact-url
          value: $(params.artifact-url)
        - name: tag
          value: $(params.tag)
        - name: username
          value: $(params.username)
        - name: auth-path
          value: $(workspaces.auth.path)
        - name: token-file
          value: $(params.token-file)
    - name: sign
      ref:
        name: cosign-sign
      computeResources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 1Gi
      params:
        - name: digest-url
          value: $(steps.push.results.DIGEST_URL)
        - name: cosign-path
          value: $(workspaces.cosign.path)
        - name: docker-config-path
          value: $(workspaces.docker-config.path)
        - name: signing-secret-name
          value: $(params.signing-secret-name)
    - name: derive-pubkey
      image: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      computeResources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 512Mi
      env:
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.signing-secret-name)
              key: password
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      command:
        - /ko-app/cosign
      args:
        - public-key
        - --key
        - $(workspaces.cosign.path)/cosign.key
        - --outfile
        - /scratch/cosign.pub
    - name: verify
      image: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      computeResources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 1Gi
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.docker-config.path)
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      command:
        - /ko-app/cosign
      args:
        - verify
        - --key
        - /scratch/cosign.pub
        - --insecure-ignore-tlog
        - $(steps.push.results.DIGEST_URL)
