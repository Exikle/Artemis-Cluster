---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/pipeline_v1.json
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oci-push
  labels:
    app.kubernetes.io/name: oci-push
spec:
  description: >-
    For each cluster registry, clone the repository, push it as a Flux OCI
    artifact, move the main tag, sign the digest with cosign and verify the
    signature — one pod per registry, and no shared volume between them. Finally trigger the Flux webhook
    receiver, which waits only on the standalone registry because that is the
    only artifact Flux reads; the Forgejo mirror still gates the run's success.
  params:
    - name: url
      description: Repository URL to clone from.
      type: string
    - name: sha
      description: Commit SHA to check out and tag the artifacts with.
      type: string
    - name: source-url
      description: Source URL recorded in the artifact metadata.
      type: string
    - name: revision
      description: Revision recorded in the artifact metadata (e.g. main@sha1:abc).
      type: string
    - name: creds-secret
      description: Secret holding password, webhook-token, and webhook-url keys.
      type: string
    - name: username
      description: Registry username for both registries.
      type: string
      default: exikle
    - name: forgejo-oci-url
      description: OCI repository on the Forgejo package registry.
      type: string
      default: oci://git.dcunha.io/exikle/artemis-cluster
    - name: registry-oci-url
      description: OCI repository on the standalone registry.
      type: string
      default: oci://registry.dcunha.io/exikle/artemis-cluster
  workspaces:
    - name: source
      description: Scratch workspace for the checkout; bound to an emptyDir per task.
    - name: basic-auth
      description: Secret workspace with .git-credentials and .gitconfig.
    - name: registry-auth
      description: Secret workspace with ci-token and registry-token files.
    - name: cosign-creds
      description: Secret workspace with the cosign.key file.
    - name: docker-config
      description: Secret workspace with a config.json holding registry auth.
  results:
    - name: digest-url
      description: Digest-qualified reference of the Forgejo artifact.
      value: $(tasks.release-forgejo.results.DIGEST_URL)
    - name: registry-digest-url
      description: Digest-qualified reference of the standalone registry artifact.
      value: $(tasks.release-registry.results.DIGEST_URL)
  tasks:
    # ── Standalone registry (the artifact Flux actually reads) ──
    - name: release-registry
      taskRef:
        name: flux-artifact-release
      params:
        - name: url
          value: $(params.url)
        - name: sha
          value: $(params.sha)
        - name: artifact-url
          value: $(params.registry-oci-url):$(params.sha)
        - name: source
          value: $(params.source-url)
        - name: revision
          value: $(params.revision)
        - name: username
          value: $(params.username)
        - name: token-file
          value: registry-token
        - name: signing-secret-name
          value: $(params.creds-secret)
      workspaces:
        - name: source
          workspace: source
        - name: basic-auth
          workspace: basic-auth
        - name: auth
          workspace: registry-auth
        - name: cosign
          workspace: cosign-creds
        - name: docker-config
          workspace: docker-config
    # ── Forgejo package registry (off-cluster mirror, no consumer) ──
    - name: release-forgejo
      taskRef:
        name: flux-artifact-release
      params:
        - name: url
          value: $(params.url)
        - name: sha
          value: $(params.sha)
        - name: artifact-url
          value: $(params.forgejo-oci-url):$(params.sha)
        - name: source
          value: $(params.source-url)
        - name: revision
          value: $(params.revision)
        - name: username
          value: $(params.username)
        - name: token-file
          value: ci-token
        - name: signing-secret-name
          value: $(params.creds-secret)
      workspaces:
        - name: source
          workspace: source
        - name: basic-auth
          workspace: basic-auth
        - name: auth
          workspace: registry-auth
        - name: cosign
          workspace: cosign-creds
        - name: docker-config
          workspace: docker-config
    # ── Notify Flux ──
    - name: notify
      runAfter:
        - release-registry
      taskRef:
        name: flux-notify
      params:
        - name: signing-secret-name
          value: $(params.creds-secret)
