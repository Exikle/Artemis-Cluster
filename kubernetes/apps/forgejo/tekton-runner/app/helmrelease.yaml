---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-runner
spec:
  chartRef:
    kind: OCIRepository
    name: tekton-runner
  interval: 1h
  values:
    app-template:
      controllers:
        forgejo-tekton-runner:
          replicas: 2
          strategy: RollingUpdate
          containers:
            runner:
              env:
                FORGEJO_URL: "http://forgejo.external-endpoints.svc.cluster.local:3000"
                # Binary default is 5Gi. Script groups here write nothing to the
                # source workspace, so that is a needless ephemeral-storage claim.
                RUNNER_DEFAULT_WORKSPACE_SIZE_LIMIT: 1Gi
                RUNNER_REDACTION_REGEXES: |-
                  (?i)authorization:\s*(bearer|token)\s+\S+
                  https://[^:/@\s]+:[^@\s]+@
                # Redis-backed failover: the standby adopts in-flight Tekton runs
                # instead of losing them. Dragonfly is a supported standalone
                # endpoint (Sentinel/Cluster are not). Index 4 per
                # .agents/references/postgres-dragonfly.md. RUNNER_NAME,
                # RUNNER_REDIS_KEY_PREFIX and RUNNER_REDIS_ENCRYPTION_KEY_FILE all
                # come from the chart, templated to the release name.
                RUNNER_REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/4"
