---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkit
spec:
  chartRef:
    kind: OCIRepository
    name: buildkit
  interval: 1h
  values:
    controllers:
      buildkit:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: Unconfined
        containers:
          buildkitd:
            image:
              repository: docker.io/moby/buildkit
              tag: v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
            args:
              - --addr
              - tcp://0.0.0.0:1234
              - --oci-worker-no-process-sandbox
            env:
              BUILDKIT_STEP_LOG_MAX_SIZE: "10485760"
              BUILDKIT_STEP_LOG_MAX_SPEED: "10485760"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [buildctl, --addr, tcp://localhost:1234, debug, workers]
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                drop: ["ALL"]
                add: ["SETUID", "SETGID"]
              readOnlyRootFilesystem: false
    persistence:
      buildkit:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: miroir
        globalMounts:
          - path: /home/user/.local/share/buildkit
    service:
      app:
        controller: buildkit
        ports:
          buildkit:
            port: 1234
