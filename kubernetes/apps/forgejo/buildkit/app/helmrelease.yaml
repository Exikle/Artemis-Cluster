---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildkit
spec:
  chartRef:
    kind: OCIRepository
    name: buildkit
  interval: 1h
  values:
    controllers:
      buildkit:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Rootless buildkitd unshares user namespaces, which the default
            # AppArmor profile denies. app-template 5.0.1 rejects the
            # appArmorProfile securityContext field, so use the annotation.
            container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: Unconfined
        containers:
          buildkitd:
            image:
              repository: docker.io/moby/buildkit
              tag: v0.32.0-rootless@sha256:40615b4a00f9a791b6fd1d6c41ebfc690e4f4b2e3710240bdd043b4467bc4d7a
            args:
              - --addr
              - tcp://0.0.0.0:1234
              # Rootless without privileged requires skipping the process
              # sandbox; the pod itself is already the isolation boundary.
              - --oci-worker-no-process-sandbox
            env:
              BUILDKIT_STEP_LOG_MAX_SIZE: "10485760"
              BUILDKIT_STEP_LOG_MAX_SPEED: "10485760"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    # buildkitd listens on TCP only, so buildctl has to be told
                    # where to look: its default is a unix socket that does not
                    # exist here.
                    command: [buildctl, --addr, tcp://localhost:1234, debug, workers]
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 8Gi
            securityContext:
              # rootlesskit maps UIDs via newuidmap/newgidmap, which are setuid
              # binaries: allowPrivilegeEscalation must stay true or the exec is
              # denied outright, and SETUID/SETGID must remain in the bounding
              # set or their file capabilities cannot be honoured.
              allowPrivilegeEscalation: true
              capabilities:
                drop: ["ALL"]
                add: ["SETUID", "SETGID"]
              # buildkitd writes its worker state and snapshots to the root
              # filesystem, so it cannot be read-only.
              readOnlyRootFilesystem: false
    persistence:
      buildkit:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        globalMounts:
          - path: /home/user/.local/share/buildkit
    service:
      app:
        controller: buildkit
        ports:
          buildkit:
            port: 1234
