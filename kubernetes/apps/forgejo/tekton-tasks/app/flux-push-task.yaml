---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tekton.dev/task_v1.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flux-push
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: Deployment
    tekton.dev/displayName: "flux push artifact"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Pushes the source workspace as a Flux OCI artifact to both cluster
    registries and moves the main tag. Registry tokens are read from the
    registry-auth workspace, never passed as params.
  params:
    - name: sha
      description: Commit SHA used as the artifact tag.
      type: string
    - name: source-url
      description: Source URL recorded in the artifact metadata.
      type: string
    - name: revision
      description: Revision recorded in the artifact metadata (e.g. main@sha1:abc).
      type: string
    - name: forgejo-oci-url
      description: OCI repository on the Forgejo package registry.
      type: string
      default: oci://git.dcunha.io/exikle/artemis-cluster
    - name: registry-oci-url
      description: OCI repository on the standalone registry.
      type: string
      default: oci://registry.dcunha.io/exikle/artemis-cluster
  workspaces:
    - name: source
      description: The checked-out repository to package.
    - name: registry-auth
      description: Secret workspace with ci-token and registry-token files.
  results:
    - name: digest-url
      description: Digest-qualified reference of the Forgejo artifact.
    - name: registry-digest-url
      description: Digest-qualified reference of the standalone registry artifact.
  steps:
    - name: push
      # renovate: datasource=docker depName=ghcr.io/fluxcd/flux-cli
      image: ghcr.io/fluxcd/flux-cli:v2.9.2@sha256:816466603e4b2e30b4fce6ecc0df49c255660deb15f625ec84c9a0dc3c55b1dd
      workingDir: $(workspaces.source.path)
      env:
        - name: SHA
          value: $(params.sha)
        - name: SOURCE_URL
          value: $(params.source-url)
        - name: REVISION
          value: $(params.revision)
        - name: FORGEJO_OCI_URL
          value: $(params.forgejo-oci-url)
        - name: REGISTRY_OCI_URL
          value: $(params.registry-oci-url)
        - name: AUTH_PATH
          value: $(workspaces.registry-auth.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        CI_TOKEN="$(cat "${AUTH_PATH}/ci-token")"
        REGISTRY_TOKEN="$(cat "${AUTH_PATH}/registry-token")"

        extract_digest() {
          sed -n 's/.*"digest": *"\([^"]*\)".*/\1/p'
        }

        DIGEST=$(flux push artifact \
          "${FORGEJO_OCI_URL}:${SHA}" \
          --path=. \
          --source="${SOURCE_URL}" \
          --revision="${REVISION}" \
          --creds="exikle:${CI_TOKEN}" \
          --output json | extract_digest)
        printf "%s" "${FORGEJO_OCI_URL#oci://}@${DIGEST}" > "$(results.digest-url.path)"

        flux tag artifact "${FORGEJO_OCI_URL}:${SHA}" \
          --tag main \
          --creds="exikle:${CI_TOKEN}"

        REGISTRY_DIGEST=$(flux push artifact \
          "${REGISTRY_OCI_URL}:${SHA}" \
          --path=. \
          --source="${SOURCE_URL}" \
          --revision="${REVISION}" \
          --creds="exikle:${REGISTRY_TOKEN}" \
          --output json | extract_digest)
        printf "%s" "${REGISTRY_OCI_URL#oci://}@${REGISTRY_DIGEST}" > "$(results.registry-digest-url.path)"

        flux tag artifact "${REGISTRY_OCI_URL}:${SHA}" \
          --tag main \
          --creds="exikle:${REGISTRY_TOKEN}"
