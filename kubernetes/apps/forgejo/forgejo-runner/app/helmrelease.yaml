---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    forgejo:
      url: "http://forgejo.external-endpoints.svc.cluster.local:3000"
      existingSecret: forgejo-runner-secret

    image:
      repository: git.dcunha.io/exikle/forgejo-runner
      tag: "12.13.0"
      digest: sha256:2c5b94d99ed6531bd80f4eeca2312e1e4060e5620dc81541206922982ae085f3

    plugin:
      image:
        tag: "12.10.9"
        digest: sha256:7fb94371ccc6ef3ff7e2110b2c04050a68bb8031d3224ed8aee2cd5e1d31c673

    podLabels:
      app.kubernetes.io/component: forgejo-runner

    runnerConfig: |
      cache:
        enabled: true
        dir: /data/cache
        port: 8088
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
      runner:
        capacity: 4
        labels:
          - ubuntu-latest:k8s:/config/podspec-default.yaml
          - ubuntu-24.04:k8s:/config/podspec-default.yaml
          - default:k8s:/config/podspec-default.yaml
          - docker:k8s:/config/podspec-dind.yaml
          - multiarch:k8s:/config/podspec-dind.yaml
          - talos:k8s:/config/podspec-talos.yaml
        timeout: 3h
        shutdown_timeout: 3m

    podSpecs:
      podspec-default.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 256Mi
        restartPolicy: Never
      podspec-dind.yaml: |
        initContainers:
          - name: dind
            image: docker:29.7-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 4Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
            readinessProbe:
              exec:
                command:
                  - sh
                  - -c
                  - test -f /certs/client/ca.pem && test -f /certs/client/cert.pem && test -f /certs/client/key.pem
              initialDelaySeconds: 2
              periodSeconds: 1
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        restartPolicy: Never
      podspec-talos.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea96a5b525857bee41cc132cf95df67191b73cdd681569ada3000111420397e
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
        volumes:
          - name: talos
            secret:
              secretName: forgejo-runner-talos
        restartPolicy: Never
