---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    forgejo:
      url: "http://forgejo.external-endpoints.svc.cluster.local:3000"
      existingSecret: forgejo-runner-secret

    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.1"
      digest: sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552

    plugin:
      image:
        repository: git.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "13.2.1"
        digest: sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 512Mi

    podLabels:
      app.kubernetes.io/component: forgejo-runner

    runnerConfig: |
      cache:
        enabled: true
        dir: /data/cache
        port: 8088
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
      runner:
        capacity: 10
        labels:
          - ubuntu-latest:k8s:///config/podspec-default.yaml
          - ubuntu-24.04:k8s:///config/podspec-default.yaml
          - default:k8s:///config/podspec-default.yaml
          - buildkit:k8s:///config/podspec-buildkit.yaml
          - docker:k8s:///config/podspec-dind.yaml
          - multiarch:k8s:///config/podspec-dind.yaml
          - talos:k8s:///config/podspec-talos.yaml
        timeout: 3h
        shutdown_timeout: 3m

    podSpecs:
      podspec-buildkit.yaml: |
        containers:
          - env:
              - name: BUILDKIT_HOST
                value: tcp://buildkit.forgejo.svc.cluster.local:1234
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
              - mountPath: /buildkit-certs
                name: buildkit-certs
                readOnly: true
        volumes:
          - name: buildkit-certs
            secret:
              secretName: buildkit-client-cert
        restartPolicy: Never
      podspec-default.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 256Mi
        restartPolicy: Never
      podspec-dind.yaml: |
        initContainers:
          - name: dind
            image: docker:29.9-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 4Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
            readinessProbe:
              exec:
                command:
                  - sh
                  - -c
                  - test -f /certs/client/ca.pem && test -f /certs/client/cert.pem && test -f /certs/client/key.pem
              initialDelaySeconds: 2
              periodSeconds: 1
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        restartPolicy: Never
      podspec-talos.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
        volumes:
          - name: talos
            secret:
              secretName: forgejo-runner-talos
        restartPolicy: Never
