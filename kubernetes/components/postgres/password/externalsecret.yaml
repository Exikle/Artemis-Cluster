---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${PG_APP}-postgres-auth
spec:
  dataFrom:
    - extract:
        key: postgres-artemis
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ${PG_APP}-postgres-auth
    template:
      engineVersion: v2
      data:
        username: ${DATABASE_OWNER:=${PG_APP}}
        password: "{{ .password }}"
