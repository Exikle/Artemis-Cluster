---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${PG_APP}-db-auth
  namespace: database
spec:
  targetNamespace: database
  path: ./kubernetes/components/postgres/password/role-secret
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: ${PG_APP}
      OWNER: ${DATABASE_OWNER:=${PG_APP}}
