---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2
      annotationSelector: "!postgres.dcunha.io/skip-cert-patch"
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          defaultPodOptions:
            annotations:
              k8s.ksgate.org/postgres-ready: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Cluster",
                  "name": "postgres",
                  "namespace": "database",
                  "expression": "resource.status.readyInstances >= 1"
                }
              k8s.ksgate.org/postgres-service: |
                {
                  "apiVersion": "v1",
                  "kind": "Service",
                  "name": "pooler-rw",
                  "namespace": "database"
                }
              k8s.ksgate.org/database-applied: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Database",
                  "name": "postgres-${PG_APP}",
                  "namespace": "database",
                  "expression": "resource.status.applied"
                }
            schedulingGates:
              - name: k8s.ksgate.org/postgres-ready
              - name: k8s.ksgate.org/postgres-service
              - name: k8s.ksgate.org/database-applied
          persistence:
            postgres-certs:
              type: secret
              name: "postgres-{{ .Release.Name }}-cert"
              defaultMode: 0600
              globalMounts:
                - path: /var/run/secrets/postgresql
            postgres-server-ca:
              type: secret
              name: "postgres-server-ca"
              defaultMode: 0440
              globalMounts:
                - path: /var/run/secrets/postgres-server-ca
  - target:
      group: litellm.home-operations.com
      kind: LiteLLMProxy
      version: v1alpha1
      annotationSelector: "!postgres.dcunha.io/skip-cert-patch"
    patch: |-
      apiVersion: litellm.home-operations.com/v1alpha1
      kind: LiteLLMProxy
      metadata:
        name: not-used
      spec:
        podAnnotations:
          postgres.dcunha.io/cert: postgres-${PG_APP}-cert
        volumeMounts:
          - name: postgres-certs
            mountPath: /var/run/secrets/postgresql
            readOnly: true
          - name: postgres-server-ca
            mountPath: /var/run/secrets/postgres-server-ca
            readOnly: true
        volumes:
          - name: postgres-certs
            secret:
              secretName: postgres-${PG_APP}-cert
              defaultMode: 0600
          - name: postgres-server-ca
            secret:
              secretName: postgres-server-ca
              defaultMode: 0440
