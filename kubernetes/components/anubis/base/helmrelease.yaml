---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-anubis
  annotations:
    anubis.dcunha.io/skip-route-patch: "true"
    postgres.dcunha.io/skip-cert-patch: "true"
spec:
  chartRef:
    kind: OCIRepository
    name: ${APP}-anubis
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      anubis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.27.0@sha256:8828275668b7bc675679f100970f9714f731388fbbf66ae94de8aca952e3fc4a
            env:
              BIND: ":8080"
              ED25519_PRIVATE_KEY_HEX:
                valueFrom:
                  secretKeyRef:
                    key: ED25519_PRIVATE_KEY_HEX
                    name: ${APP}-anubis-key
              METRICS_BIND: ":9090"
              OG_EXPIRY_TIME: 24h
              OG_PASSTHROUGH: "true"
              POLICY_FNAME: /etc/anubis/policy.yaml
              SERVE_ROBOTS_TXT: "true"
              TARGET: ${ANUBIS_TARGET}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - anubis
                      - --healthcheck
                  initialDelaySeconds: 1
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - anubis
                      - --healthcheck
                  initialDelaySeconds: 1
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      policy:
        type: configMap
        name: ${APP}-anubis-policy
        globalMounts:
          - path: /etc/anubis
            readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          anubis:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        controller: anubis
        ports:
          http:
            port: 8080
          metrics:
            port: 9090
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 30s
            path: /metrics
