---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          defaultPodOptions:
            annotations:
              k8s.ksgate.org/dragonfly-ready: |
                {
                  "apiVersion": "dragonflydb.io/v1alpha1",
                  "kind": "Dragonfly",
                  "name": "dragonfly",
                  "namespace": "database",
                  "expression": "resource.status.phase == 'Ready'"
                }
              k8s.ksgate.org/dragonfly-service: |
                {
                  "apiVersion": "v1",
                  "kind": "Service",
                  "name": "dragonfly",
                  "namespace": "database"
                }
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2
    patch: |-
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/dragonfly-ready
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/dragonfly-service
