---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  # Pinned explicitly on every policy, whatever the value. copyMethod is
  # server-defaulted, and a server-defaulted field has no field owner under
  # server-side apply — re-applying a manifest that omits it can silently flip a
  # stored value when the CRD is upgraded. Default Snapshot so an app added
  # later fails safe: Direct is a live crash-consistent read, which is wrong for
  # anything holding a SQLite file (and silently so until a restore).
  copyMethod: ${KOPIUR_COPYMETHOD:=Snapshot}
  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      mode: ${KOPIUR_CACHE_MODE:=Ephemeral}
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=miroir-local}
    # fsGroup must track the app's own gid, not the repository default: with
    # copyMethod Snapshot the source clone is mounted read-only, so the kubelet
    # cannot chgrp it and a mismatched mover just gets permission denied. It also
    # owns the cache PVC, which the mover must be able to write.
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: atlas
  retention:
    keepDaily: 30
    keepHourly: 24
    keepLatest: 5
    keepMonthly: 6
    keepWeekly: 8
  sources:
    - pvc:
        name: ${APP}
  staging:
    storageClassName: ${KOPIUR_STAGING_STORAGECLASS:=miroir-local}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir}
