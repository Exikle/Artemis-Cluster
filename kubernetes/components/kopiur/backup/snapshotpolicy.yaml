---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      mode: ${KOPIUR_CACHE_MODE:=Ephemeral}
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=miroir}
    # fsGroup must track the app's own gid, not the repository default: with
    # copyMethod Snapshot the source clone is mounted read-only, so the kubelet
    # cannot chgrp it and a mismatched mover just gets permission denied. It also
    # owns the cache PVC, which the mover must be able to write.
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: atlas
  retention:
    keepDaily: 30
    keepHourly: 24
    keepLatest: 5
    keepMonthly: 6
    keepWeekly: 8
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir}
