---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The ../backup component with copyMethod flipped to Direct.
#
# Direct mounts the live source PVC read-only instead of staging a CSI copy, so
# a run creates no VolumeSnapshot and no staged PVC — no miroir volume at all.
# That is the whole point: 28 hourly policies staging a replicas-1 volume each
# is the churn that drove miroir#390's bitmap races.
#
# The cost is consistency. Direct reads a live filesystem, so the capture is
# crash-consistent spread across the read rather than taken at one instant.
# Use it ONLY for a PVC with no database in it. An app holding SQLite — and
# especially one in WAL mode, where the `.sqlite` and its `-wal` would be read
# moments apart — must stay on the ../backup component, or the backup can
# restore torn and nothing tells you until you need it.
#
# staging and volumeSnapshotClassName are removed rather than blanked: the
# admission webhook rejects a staged-PVC override under Direct outright, and an
# empty string does not count as absent for spec.staging.storageClassName.
components:
  - ../backup
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      - op: replace
        path: /spec/copyMethod
        value: Direct
      - op: remove
        path: /spec/staging
      - op: remove
        path: /spec/volumeSnapshotClassName
