domain: k8s-schemas.home-operations.com
include_core: true

overrides:
  - name: kustomize
    match:
      apiGroup: kustomize.config.k8s.io
    schema: https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
  - name: helmrelease-app-template
    match:
      kind: HelmRelease
      chartRefOciUrl: oci://ghcr.io/bjw-s-labs/helm/app-template
    schema: https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
